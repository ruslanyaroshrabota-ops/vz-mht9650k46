*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;margin:0;height:100%;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}

#banner{display:none;margin-top:6px;font-size:13px;background:#fff4e0;border:1px solid #f0c27a;border-radius:10px;padding:6px 8px}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:500;display:flex;gap:6px;justify-content:space-around;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:#fffffff2;box-shadow:0 -1px 6px #0002}

.pl{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}

#days,#chips{touch-action:pan-x;overscroll-behavior:contain}
#grab{width:40px;height:5px;border-radius:3px;background:#ccd;margin:4px auto 8px}

h2{font-size:19px;margin:2px 40px 2px 0}

.badge{display:inline-block;font-size:12.5px;border-radius:8px;padding:2px 7px;margin:2px 4px 2px 0;background:#eef1f4}

.leaflet-tooltip.rlbl:before{display:none}.leaflet-tooltip.rlbl.past{background:#9aa3adcc}.leaflet-tooltip.rlbl.now{background:#1e88e5}
.chip.route{border-color:#1f3a5f;color:#1f3a5f;font-weight:600}.chip.route.on{background:#1f3a5f;color:#fff}

.trk h3,h3{font-size:16px;margin:12px 0 4px}.tri{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.trs{font-size:12px;color:var(--mut);white-space:nowrap}

 закрыта или на ремонте.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.spottedbylocals.com/venice/forte-marghera/","https://it.wikipedia.org/wiki/Forte_Marghera"],"acc":"area","gq":"Forte Marghera","status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/71/Forte-marghera.jpg/960px-Forte-marghera.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"warn","t":"Доступ не подтверждён"},"2":{"s":"warn","t":"Доступ не подтверждён"}},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Forte_Marghera%2C_albordi%C4%9Dejo.jpeg/960px-Forte_Marghera%2C_albordi%C4%9Dejo.jpeg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Forte_Marghera,_albordi%C4%9Dejo.jpeg","by":"Aisano","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Forte_Marghera%2C_Feldbahnlok_Windhoff_1.jpeg/960px-Forte_Marghera%2C_Feldbahnlok_Windhoff_1.jpeg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Forte_Marghera,_Feldbahnlok_Windhoff_1.jpeg","by":"Aisano","lic":"CC BY-SA 3.0"}],"desc":"Крепость на материке, в Местре: французы начали её в 1805 году, достраивали австрийцы после 1814-го. В 1848-м её заняли восставшие венецианцы, в 1849-м после осады оставили. Сохранились пятиугольное ядро с четырьмя бастионами, овальная гавань-дарсена и длинные кирпичные казармы начала XIX века. До 1980-х здесь были склады и казармы, теперь это городской парк и площадка для событий. Смотреть стоит на кирпич, воду и бастионы снаружи — не на внутренности закрытых зданий.","photoPage":"https://it.wikipedia.org/wiki/Forte_Marghera","photoNear":0},{"id":9,"name":"Piazzale Roma · главный узел","lat":45.43794,"lng":12.31877,"cluster":"Запад · вход в Венецию","cats":["transport"],"indoor":0,"price":"Площадь €0","addr":"Piazzale Roma, Venezia, Italy","why":"Здесь заканчивается автобус из Местре, начинаются пешие прогулки и лодки. Автобусная площадка и причалы — разные зоны. Для бесплатной DE нужен водный причал D; для любой другой линии смотрите её номер и табло.","time":"DE работает бесплатно только 31 октября — 2 ноября.","caveat":"","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://muoversi.venezia.it/it/content/commemorazione-dei-defunti-servizi-gratuiti-e-fermata-straordinaria-di-linea-13","https://andreafrison.com/app/mini-venice/en/lines/bus/24h/"],"acc":"area","gq":"Piazzale Roma Venezia","status":"ok","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Piazzale_Roma.JPG/960px-Piazzale_Roma.JPG?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"free","t":"DE с причала D: :09 :29 :49, 09:09–16:49"},"2":{"s":"free","t":"DE с причала D: :09 :29 :49, 09:09–16:49"},"31":{"s":"free","t":"DE с причала D: :09 :29 :49, 09:09–16:49"}},"layer":"logistics","tip":"Бесплатный DE на кладбище 2.11: причал D, 09:09–16:49 каждые 20 мин (:09, :29, :49), через Ferrovia, Guglie, Tre Archi. Обратно с кладбища (причал A) :15, :35, :55 до 17:15.","photoPage":"https://it.wikipedia.org/wiki/Piazzale_Roma","photoNear":0},{"id":10,"name":"Bacareto da Lele","lat":45.43755,"lng":12.32126,"cluster":"Запад · вход в Венецию","cats":["food"],"indoor":1,"price":"≈ €6–10 на двоих (мини-панини + вино)","addr":"Bacareto da Lele, Santa Croce 184, Venezia, Italy","why":"Мини-бутерброды и напитки у стойки возле входа в город. Сумма — наш ориентир на небольшой перекус вдвоём, не фиксированный набор. Очень маленькое место без столиков: не подходит для долгого отдыха ног.","time":"Пн–пт 06:00–20:00 · сб 06:00–14:00 · вс закрыто.","caveat":"1 ноября не рассчитывать. 2 ноября — обычный понедельничный график, без отдельной гарантии праздничных изменений.","pin":"","links":["https://bacaretodalele.it/","https://www.tripadvisor.com/Restaurant_Review-g187870-d1900957-Reviews-Bacareto_da_Lele-Venice_Veneto.html"],"acc":"object","gq":"Bacareto da Lele Venezia","status":"ok","checked":"31.10 (сайты, TripAdvisor, OSM)","photo":null,"days":{"1":{"s":"closed","t":"Вс закрыто"},"2":{"s":"open","t":"06:00–20:00"},"3":{"s":"open","t":"06:00–20:00"}},"hidden":true,"hiddenWhy":"обычная закусочная (отбор v4, 01.11)"},{"id":11,"name":"Scuola Grande di San Rocco","lat":45.43653,"lng":12.3253,"cluster":"Запад · вход в Венецию","cats":["art"],"indoor":1,"price":"€12/чел (€24 на двоих), с церковью €14; только касса","addr":"Scuola Grande di San Rocco, San Polo 3052, Venezia, Italy","why":"Один насыщенный интерьер с живописью Тинторетто вместо долгого обхода музеев. Платная альтернатива, не обязательство. Билеты в кассе; в основной бюджет бесплатных занятий не включены.","time":"09:30–17:30 · касса до 17:00 · 3 ноября закрыто.","caveat":"","pin":"","links":["https://www.musa.guide/it/discover/venice/scuola-grande-di-san-rocco","https://en.wikipedia.org/wiki/Scuola_Grande_di_San_Rocco"],"acc":"object","gq":"Scuola Grande di San Rocco","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/Scuola_Grande_di_San_Rocco_%28Venice%29.jpg/960px-Scuola_Grande_di_San_Rocco_%28Venice%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"3":{"s":"closed","t":"3.11 закрыто"},"1":{"s":"open","t":"09:30–17:30 · €12/чел"},"2":{"s":"open","t":"09:30–17:30 · €12/чел"}},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/Scuola_Grande_di_San_Rocco_%28Venice%29.jpg/960px-Scuola_Grande_di_San_Rocco_%28Venice%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Scuola_Grande_di_San_Rocco_(Venice).jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Scuola_Grande_di_San_Rocco_%28Venice%29_-_Il_Salone_Maggiore.jpg/960px-Scuola_Grande_di_San_Rocco_%28Venice%29_-_Il_Salone_Maggiore.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Scuola_Grande_di_San_Rocco_(Venice)_-_Il_Salone_Maggiore.jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Campo_San_Rocco_%28Venice%29.jpg/960px-Campo_San_Rocco_%28Venice%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Campo_San_Rocco_(Venice).jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"}],"desc":"Дом братства святого Роха, покровителя от чумы: братство основано в 1478 году, здание строили с 1515 по 1560 год, сменилось несколько архитекторов. С 1564 по 1587 год залы расписывал Тинторетто с помощниками, среди них сын Доменико: на потолке верхнего зала — сцены Ветхого Завета, на стенах — Нового, а в зале Альберго — «Распятие». Это не музей, а один огромный зал-шкатулка: золочёный потолок, мраморный пол с узором, живопись на каждой стене. Рядом стоит одноимённая церковь, где хранятся мощи святого.","photoPage":"https://it.wikipedia.org/wiki/Scuola_Grande_di_San_Rocco","photoNear":0},{"id":12,"name":"San Pantalon · расписной потолок","lat":45.43572,"lng":12.32474,"cluster":"Запад · вход в Венецию","cats":["art","free"],"indoor":1,"price":"Вход €0","addr":"Chiesa di San Pantalon, Venezia, Italy","why":"Скромный фасад и огромная потолочная живопись внутри. Короткий заход, когда дверь открыта. Можно спокойно сесть и посмотреть на роспись; пожертвование добровольное.","time":"10:00–12:30 и 15:30–18:00, пятница закрыто, воскресная месса 10:00 (официальный сайт). В отзыве августа 2026 — закрыто в часы работы.","caveat":"Есть отзыв августа 2026: церковь оказалась закрыта даже в указанные часы. Только по пути; службы не прерывать.","pin":"","links":["https://www.tripadvisor.com/Attraction_Review-g187870-d866623-Reviews-Church_of_San_Pantalon-Venice_Veneto.html","https://en.wikipedia.org/wiki/San_Pantalon","https://commons.wikimedia.org/wiki/File:Interior_of_San_Pantaleone_(Venice)_Organo.jpg"],"acc":"object","gq":"Chiesa di San Pantalon Venezia","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Venezia_-_chiesa_di_San_Pantaleone.jpg/960px-Venezia_-_chiesa_di_San_Pantaleone.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"open","t":"10:00–12:30, 15:30–18:00 (месса 10:00)"},"2":{"s":"open","t":"10:00–12:30, 15:30–18:00"}},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Venezia_-_chiesa_di_San_Pantaleone.jpg/960px-Venezia_-_chiesa_di_San_Pantaleone.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Venezia_-_chiesa_di_San_Pantaleone.jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/The_church_of_San_Pantalon.jpg/960px-The_church_of_San_Pantalon.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:The_church_of_San_Pantalon.jpg","by":"Venice-life","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1a/Interior_of_San_Pantaleone_%28Venice%29_Organo.jpg/960px-Interior_of_San_Pantaleone_%28Venice%29_Organo.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Interior_of_San_Pantaleone_(Venice)_Organo.jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8e/Interior_of_San_Pantaleone_%28Venice%29_Fonte_battesimale.jpg/960px-Interior_of_San_Pantaleone_%28Venice%29_Fonte_battesimale.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Interior_of_San_Pantaleone_(Venice)_Fonte_battesimale.jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"}],"desc":"Снаружи — голый кирпичный фасад без облицовки, внутри — потолок, ради которого сюда и заходят: «Мученичество и апофеоз святого Пантелеймона» Джан Антонио Фумиани, написан на холсте в 1680–1704 годах в ракурсе «снизу вверх» (sotto in su) — картина как будто уходит в небо. Смотреть лучше сидя, запрокинув голову. Ещё здесь последняя работа Веронезе «Св. Пантелеймон исцеляет мальчика» и «Коронование Девы» Виварини и д'Алеманьи (1444) в капелле Святого Гвоздя; орган — работа Гаэтано Каллидо.","photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Pantalon","photoNear":0},{"id":13,"name":"Tiberiade · благотворительный секонд-хенд","lat":45.44026985167025,"lng":12.330012917518616,"cluster":"Запад · вход в Венецию","cats":["market"],"indoor":1,"price":"Вход €0","addr":"Charity Shop Tiberiade, Campiello del Spezier 2035, Venezia, Italy","why":"Посуда, небольшие вещи для дома и винтаж из пожертвований. Нужен первый магазин у San Stae, Santa Croce 2035. Это северная часть района, а не соседняя дверь с Lele. Покупки отдельно, ассортимент меняется.","time":"По каталогам: пн 16:00–19:00 · вс закрыто.","caveat":"Небольшая волонтёрская лавка: работу именно 2 ноября не подтвердили. Не делать ради неё отдельную большую петлю.","pin":"","links":["https://dispensavintage.it/products/charity-shop-t-i-b-e-r-i-a-d-e-venezia"],"acc":"object","gq":"Charity Shop Tiberiade Venezia","status":"ok","checked":"31.10 (сайты, TripAdvisor, OSM)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/Venezia_Rio_di_San_Stae.jpg/960px-Venezia_Rio_di_San_Stae.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"closed","t":"Вероятно закрыто"},"2":{"s":"warn","t":"пн 16:00–19:00? (волонтёры)"}},"hi perto.it/venezia/supermercato-despar-teatro-italia-2573706"],"acc":"object","gq":"Despar Teatro Italia Venezia","status":"warn","checked":"31.10 (сайты, TripAdvisor, OSM)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Venezia_Teatro_Italia_%2835938422211%29.jpg/960px-Venezia_Teatro_Italia_%2835938422211%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"open","t":"08:00–21:00 (официально, праздничное открытие)"},"2":{"s":"open","t":"08:00–21:00"}},"hidden":true,"hiddenWhy":"супермаркет (отбор v4, 01.11)","photoPage":"https://commons.wikimedia.org/wiki/File:Venezia_Teatro_Italia_(35938422211).jpg","photoNear":0},{"id":16,"name":"Misericordia и Ormesini","lat":45.44319,"lng":12.33434,"cluster":"Каннареджо · каналы и театр","cats":["walk","water"],"indoor":0,"price":"€0","addr":"Fondamenta della Misericordia, Venezia, Italy","why":"Длинные набережные: гулять вдоль воды, смотреть лодки и заглянуть за закусками. Это район для свободной прогулки, не одна дверь. Вечером может быть оживлённо; отсутствие людей не обещаем.","time":"","caveat":"","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city"],"acc":"area","gq":"Fondamenta della Misericordia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Fondamenta_della_Misericordia_%28Venice%29.jpg/960px-Fondamenta_della_Misericordia_%28Venice%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{},"hidden":true,"hiddenWhy":"стандартная прогулка (отбор v4, 01.11)","photoPage":"https://commons.wikimedia.org/wiki/File:Fondamenta_della_Misericordia_(Venice).jpg","photoNear":0},{"id":17,"name":"Bacareto da ea Neni","lat":45.44549,"lng":12.32873,"cluster":"Каннареджо · каналы и театр","cats":["food"],"indoor":1,"price":"cicchetto €2,50 · spritz €3,50 → ≈ €11–13 на двоих","addr":"Bacareto da ea Neni, Fondamenta degli Ormesini 2737, Venezia, Italy","why":"Одна остановка на чиккетти вместо дорогого ресторанного обеда. Плановая сумма на двоих зависит от количества закусок. В карточке заведения spritz указан по €3,50; столиков и тепла для долгого отдыха не обещаем.","time":"Понедельник закрыто. Часы остальных дней расходятся в каталогах: 11:00–21:00 либо 11:00–13:30 / 18:00–22:30. Уточнить перед заходом","caveat":"Это обычные часы Tripadvisor, не специальное подтверждение на 1 ноября. Прежнее 18:00–22:30 заменено актуальной карточкой.","pin":"Метка — ориентир у соседнего Birreria Zanon (№2735). Neni находится рядом, №2737; перед входом проверь вывеску.","links":["https://www.tripadvisor.it/Restaurant_Review-g187870-d12994798-Reviews-Bacareto_da_ea_Neni-Venice_Veneto.html"],"acc":"approx","gq":"Bacareto da ea Neni Venezia","status":"warn","checked":"31.10 (сайты, TripAdvisor, OSM)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Venice%2C_Cannaregio%2C_Fond._degli_Ormesini%2C_evening.jpg/960px-Venice%2C_Cannaregio%2C_Fond._degli_Ormesini%2C_evening.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"2":{"s":"closed","t":"Пн закрыто"},"1":{"s":"open","t":"11:00–21:00 (обычный вс)"}},"hidden":true,"hiddenWhy":"пн закрыто (отбор v4, 01.11)","photoPage":"https://commons.wikimedia.org/wiki/File:Venice,_Cannaregio,_Fond._degli_Ormesini,_evening.jpg","photoNear":0},{"id":18,"name":"Ponte Chiodo","lat":45.44284,"lng":12.33472,"cluster":"Каннареджо · каналы и театр","cats":["hidden","photo"],"indoor":0,"price":"Осмотр €0","addr":"Ponte Chiodo, Venezia, Italy","why":"Маленький мост без привычных перил — необычная деталь у тихого канала. Рассматривать и фотографировать с набережной. Не воспринимать мост как приглашение пройти к частному дому.","time":"","caveat":"Не заходить за ограждение или к закрытым дверям; рядом нет защиты от падения в воду.","pin":"","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city","https://it.wikipedia.org/wiki/Ponte_Chiodo","https://commons.wikimedia.org/wiki/File:Ponte_Chiodo_sul_Rio_San_Felice.jpg"],"acc":"object","gq":"Ponte Chiodo Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/Ponte_de_Chiodo.JPG/960px-Ponte_de_Chiodo.JPG?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Ponte_Chiodo_sul_Rio_San_Felice.jpg/960px-Ponte_Chiodo_sul_Rio_San_Felice.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Ponte_Chiodo_sul_Rio_San_Felice.jpg","by":"André Corboz","lic":"CC BY-SA 4.0"}],"desc":"Каменный арочный мостик через Rio di San Felice в Каннареджо — без парапетов: ни перил, ни ограждения, только ступенчатая дуга над водой, какими венецианские мосты были в старину. Название связывают с родом Chiodo, которому мост принадлежал. Он соединяет набережную Fondamenta di San Felice с частным домом, поэтому это вещь «для глаз»: смотрите и снимайте с набережной, на сам мост за порог дома не выходите. Для Марии — редкая живая деталь старой Венеции, которой не найти в современных городах.","photoPage":"https://it.wikipedia.org/wiki/Ponte_Chiodo","photoNear":0},{"id":19,"name":"Palazzo Soranzo Van Axel","lat":45.4394911,"lng":12.339658,"cluster":"Риальто и Мираколи","cats":["art","free"],"indoor":1,"price":"Вход €0","addr":"Palazzo Soranzo Van Axel, Cannaregio 6099, Venezia, Italy","why":"Дворы, каменные лестницы и небольшая порция современного искусства. На ваши даты открыта выставка Su Xiaobai’s Alchemical Universe. Доступ по выставочному маршруту, не ко всем комнатам частного дворца.","time":"10:00–18:00 · вторник закрыто · выставка до 22 ноября.","caveat":"1–2 ноября подходят; 3 ноября, во вторник, не переносить. При толпе можно посмотреть меньше залов.","pin":"","links":["https://www.lavocedivenezia.it/palazzo-soranzo-van-axel-ingresso-gratuito/","https://www.pearllam.com/wp-content/uploads/2026/05/Su-Xiaobai-61st-Venice-Biennale-Announcement-EN-20260424_F.pdf","https://it.wikipedia.org/wiki/Palazzo_Soranzo_Van_Axel","https://en.wikipedia.org/wiki/Palazzo_Soranzo_Van_Axel"],"acc":"object","gq":"Palazzo Soranzo Van Axel","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Palazzo_Soranzo_Van_Axel_%28Venice%29.jpg/960px-Palazzo_Soranzo_Van_Axel_%28Venice%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"3":{"s":"closed","t":"Вт закрыто"},"1":{"s":"free","t":"10:00–18:00 · вход свободный"},"2":{"s":"free","t":"10:00–18:00 · вход свободный"}},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/Palazzo_Soranzo_Van_Axel_%28Venice%29_on_rio_de_Ca%27Widmann.jpg/960px-Palazzo_Soranzo_Van_Axel_%28Venice%29_on_rio_de_Ca%27Widmann.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Palazzo_Soranzo_Van_Axel_(Venice)_on_rio_de_Ca%27Widmann.jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Palazzo_Soranzo_Van_Axel_ingresso_Venezia_notte.jpg/960px-Palazzo_Soranzo_Van_Axel_ingresso_Venezia_notte.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Palazzo_Soranzo_Van_Axel_ingresso_Venezia_notte.jpg","by":"This Photo was taken by Wolfgang Moroder.  \n\nFeel free to use my photos, but ple","lic":"CC BY-SA 3.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Palazzo_Soranzo_Van_Axel_%28Venice%29.jpg/960px-Palazzo_Soranzo_Van_Axel_%28Venice%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Palazzo_Soranzo_Van_Axel_(Venice).jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"}],"desc":"Венецианская поздняя готика, построена в 1473–1479 годах для Никколо Соранцо (по данным Википедии — из материалов старого палаццо Градениго) рядом с церковью Санта-Мария-деи-Мираколи, на стыке двух каналов. Внутри два двора с наружными лестницами, два «благородных» этажа с балконами-квадрифориями и длинные Г-образные залы портего с видом на пересечение каналов. Деревянный портал с люнетом и гербом Ван Аксель — фламандских купцов, купивших дворец в 1652 году. Выставка современная, но для вас главное тут камень, дворы и лестницы.","photoPage":"https://it.wikipedia.org/wiki/Palazzo_Soranzo_Van_Axel","photoNear":0},{"id":20,"name":"Libreria Miracoli","lat":45.439914156613504,"lng":12.339180707931519,"cluster":"Риальто и Мираколи","cats":["market"],"indoor":1,"price":"Вход €0","addr":"Libreria Miracoli, Campo Santa Maria Nova 6062, Venezia, Italy","why":"Старые книги, открытки и небольшие печатные вещи для дома. Короткий заход рядом с дворцом и церковью Miracoli. Ассортимент и цены зависят от находки.","time":"Часы на ваши даты не подтверждены; зайти только по пути.","caveat":"","pin":"","links":["https://www.awellreadwanderer.com/best-venice-bookstores/","https://hotelarcadia.net/exhibition/vintage-shopping-venice/"],"acc":"object","gq":"Libreria Miracoli Venezia","status":"warn","checked":"31.10 (сайты, TripAdvisor, OSM)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Santa_Maria_dei_Miracoli_%28facciata%29.jpg/960px-Santa_Maria_dei_Miracoli_%28facciata%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"warn","t":"10:30–18:00 (OSM 2024)"},"2":{"s":"warn","t":"10:30–18:00 (OSM 2024)"}},"desc":"Книжная лавка на Кампо Санта-Мария Нова: путеводитель описывает её как место, которое пахнет бумагой и картоном, и советует всем, кто любит старые открытки, книги и гравюры. Владелец, Клаудио, каждый день выставляет у входа ящики с давними вещами — порыться можно ещё с улицы. Это лавка для любителей истории, а не моды: смотрите старые открытки и печатные листы с Венецией, ради находки, а не ради сувенира. Рядом церковь Санта-Мария деи Мираколи — удобный короткий заход по пути.","photoPage":"https://commons.wikimedia.org/wiki/File:Santa_Maria_dei_Miracoli_(facciata).jpg","photoNear":0},{"id":21,"name":"Calle Varisco","lat":45.441135,"lng":12.339281,"cluster":"Риальто и Мираколи","cats":["hidden"],"indoor":0,"price":"€0","addr":"Calle Varisco, Venezia, Italy","why":"Найти очень узкий переулок и пройти по одному до канала. Это маленькое открытие, а не отдельное занятие на час. В отзывах прямо советуют заходить, только когда рядом.","time":"","caveat":"Тупик, а не проход в соседний квартал. Не продолжать путь через частные двери.","pin":"","links":["https://www.tripadvisor.com/Attraction_Review-g187870-d12456414-Reviews-Calle_Varisco-Venice_Veneto.html","https://wanderlog.com/place/details/8883600/calle-varisco-the-narrowest-street-in-venice"],"acc":"object","gq":"Calle Varisco Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Calle_Varisco.jpg/960px-Calle_Varisco.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Calle_Varisco.jpg/960px-Calle_Varisco.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Calle_Varisco.jpg","by":"Venice-life","lic":"CC BY-SA 4.0"}],"desc":"Самая узкая калле Венеции: в самом узком месте около 53 см, плечами не развернуться. Лежит в Каннареджо, между Фондаменте Нове и мостом Риальто, и упирается в канал, так что обратно идти тем же путём. Награда в конце — вид на воду. Отзывы расходятся: одним нравится, другим не стоит отдельной поездки, поэтому заходить лучше, когда вы рядом. Днём и без толпы лучше всего; пустой переулок может казаться глухим.","photoPage":"https://commons.wikimedia.org/wiki/File:Calle_Varisco.jpg","photoNear":0},{"id":22,"name":"Campiello Remer","lat":45.4394,"lng":12.33675,"cluster":"Риальто и Мираколи","cats":["hidden","photo"],"indoor":0,"price":"Двор €0","addr":"Campiello Remer, Venezia, Italy","why":"Выйти из переулка на маленькую площадку у Гранд-канала. Ищите сам двор, не столик в одноимённом заведении. Каменная лестница, фасады и вид на проходящие лодки.","time":"","caveat":"Вечером бывает людно; закрытый проход или рабочую зону причала не обходить.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.tripadvisor.com/Attraction_Review-g187870-d9987749-Reviews-Campiello_Remer-Venice_Veneto.html"],"acc":"area","gq":"Campiello Remer Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/Campiello_Remer.jpg/960px-Campiello_Remer.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{},"hidden":true,"hiddenWhy":"слабое (отбор v4, 01.11)","photoPage":"https://commons.wikimedia.org/wiki/File:Campiello_Remer.jpg","photoNear":0},{"id":23,"name":"Ponte di Rialto","lat":45.43804,"lng":12.3359,"cluster":"Риальто и Мираколи","cats":["photo"],"indoor":0,"price":"Мост €0","addr":"Ponte di Rialto, Venezia, Italy","why":"Главный вид на Гранд-канал, который естественно попадает по пути. Посмотрите с моста и с соседней набережной. Сам мост не требует билета; это не обещание пустого места для фотографии.","time":"","caveat":"","pin":"","links":["https://www.cntraveler.com/shops/venice/mercato-di-rialto"],"acc":"object","gq":"Ponte di Rialto","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/Rialto_Bridge_at_night2.jpg/960px-Rialto_Bridge_at_night2.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"hidden":true,"hiddenWhy":"стандартное — все видят (отбор v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Ponte_di_Rialto","photoNear":0},{"id":24,"name":"Арка у Aquila Nera","lat":45.4374,"lng":12.3374,"cluster":"Риальто и Мираколи","cats":["hidden","photo"],"indoor":0,"price":"Уличный осмотр €0","addr":"Calle dell’Aquila Nera, San Marco, Venezia, Italy","why":"Тот самый кадр из вашего ролика: арка, вода и фасад напротив. Ориентир — переулок у Trattoria Aquila Nera рядом с Риальто. Карта ведёт к улице, не к гарантированному точному месту съёмки. Сверьте арку по вашему кадру.","time":"","caveat":"Геометка Instagram возле San Giovanni Evangelista неверна для этого ориентира. Помост используется лодками; не мешать посадке и не заходить в закрытые зоны.","pin":"Метка показывает переулок Calle dell’Aquila Nera. Точный помост из ролика не геодезически подтверждён: ищите арочный выход к воде, а не ресторанный стол.","links":["https://vie.openalfa.it/vie/calle-dell-aquila-nera-san-marco-venezia-murano-burano-venezia","https://distanzechilometriche.net/mappa/venezia/calle-dell-aquila-nera/","https://www.losviajeros.com/foros.php?p=2109564"],"acc":"approx","gq":null,"status":"free","checked":null,"photo":null,"days":{},"desc":"Calle dell'Aquila Nera — переулок в районе Сан-Марко рядом с Риальто: по отзыву путешественников, спустившись с моста Риальто со стороны остановки вапоретто, впереди видна вывеска Trattoria Aquila Nera. Это ориентир, а не точка с табличкой: метка на карте стоит на улице, и точную арку нужно сверять по вашему кадру из ролика. Ищите арку над водой и фасад напротив; помост у воды используют лодки, поэтому снимайте так, чтобы никому не мешать."},{"id":25,"name":"Palazzo Bembo","lat":45.4370389,"lng":12.3350667,"cluster":"Риальто и Мираколи","cats":["art","free"],"indoor":1,"price":"Вход €0","addr":"Palazzo Bembo, Riva del Carbon 4793, Venezia, Italy","why":"Японские инсталляции, JoJo и окна на Гранд-канал. Personal Structures — отдельная бесплатная выставка, а не платные Giardini / Arsenale. Можно выбрать несколько залов вместо полного обхода.","time":"10:00–18:00 · вторник закрыто · до 22 ноября.","caveat":"1–2 ноября подходят; 3 ноября закрыто. Проверяйте вход в выставку, а не в отель с похожим названием.","pin":"","links":["https://mangaart.jp/exhibitions/ps2026-venice","https://brand.b-ownd.com/en/venice2026/"],"acc":"object","gq":"Palazzo Bembo Venezia","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Palais_Bembo.jpg/960px-Palais_Bembo.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"3":{"s":"closed","t":"Вт закрыто"},"1":{"s":"free","t":"10:00–18:00 · вход свободный"},"2":{"s":"free","t":"10:00–18:00 · вход свободный"}},"hidden":true,"hiddenWhy":"современное искусство — Марии не надо (отбор v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Palazzo_Bembo","photoNear":0},{"id":26,"name":"San Salvador · хор и орган","lat":45.43669,"lng":12.33654,"cluster":"Риальто и Мираколи","cats":["art","free"],"indoor":1,"price":"€0","addr":"Chiesa di San Salvador, San Marco 4835, Venezia, Italy","why":"Спокойная живая музыка, если захочется сменить улицы на церковную акустику. Концерт Guillou Consort, орган Alessandro Perin. Это духовная музыка, не вечернее шоу. Можно оставить необязательным.","time":"1 ноября 2026 · начало 16:00.","caveat":"Количество мест и окончание программы не указаны. В церковь приходят слушать, а не на короткий фотозаход посреди исполнения.","pin":"","links":["https://www.guillouconsort.it/event/concerto-a-san-salvador-venezia/"],"acc":"object","gq":"Chiesa di San Salvador Venezia","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/San_Salvador_Venezia_Notte.jpg/960px-San_Salvador_Venezia_Notte.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"only","t":"Концерт 16:00 · бесплатно · может быть людно"}},"hidden":true,"hiddenWhy":"концерт был в вс (отбор v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Salvador","photoNear":0},{"id":27,"name":"Cantina Do Spade","lat":45.43918,"lng":12.33339,"cluster":"Риальто и Мираколи","cats":["food"],"indoor":1,"price":"Две пасты + 2 бокала ≈ €41–43, coperto €2–6 → ≈ €45–55","addr":"Cantina Do Spade, Calle Do Spade 859, Venezia, Italy","why":"Кандидат на один нормальный итальянский приём пищи вдвоём. В меню: bigoli €16, паста с чернилами каракатицы €17. Две пасты €33, напитки, вода и возможный coperto отдельно. Общая сумма — план, не фиксированный сет.","time":"Ежедневно 10:00–15:00 и 18:00–22:00.","caveat":"Без брони вечером можно не попасть (отзывы 2026). Coperto в отзывах €2 и €6 — спросить до заказа. Сэкономить: одно блюдо на двоих + cicchetti у стойки. Тел. +39 041 521 0583.","pin":"","links":["https://cantinadospade.com/menu/","https://www.tripadvisor.com/Restaurant_Review-g187870-d1034679-Reviews-Cantina_Do_Spade-Venice_Veneto.html"],"acc":"object","gq":"Cantina Do Spade Venezia","status":"ok","checked":"31.10 (сайты, TripAdvisor, OSM)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/Sottoportego_e_ponte_de_le_do_spade_a_Venezia.jpg/960px-Sottoportego_e_ponte_de_le_do_spade_a_Venezia.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"open","t":"10:00–15:00, 18:00–22:00 · бронь по телефону"},"2":{"s":"open","t":"10:00–15:00, 18:00–22:00"}},"hidden":true,"hiddenWhy":"еда — есть лучше в плане (отбор v4, 01.11)","photoPage":"https://commons.wikimedia.org/wiki/File:Sottoportego_e_ponte_de_le_do_spade_a_Venezia.jpg","photoNear":1},{"id":28,"name":"Traghetto Santa Sofia","lat":45.440431,"lng":12.334764,"cluster":"Риальто и Мираколи","cats":["water"],"indoor":0,"price":"€4 / двоих","addr":"Traghetto Santa Sofia, Venezia, Italy","why":"Короткая гондольная переправа: Cannaregio ↔ рынок Риальто. Это пересечение Гранд-канала, не экскурсия. Нужны €2 с человека; мелкие наличные удобнее. Как стоять или садиться — подскажет гребец.","time":"Вс / праздники 09:00–18:00 · пн–пт 08:30–19:00.","caveat":"Базовый график опубликован городом, не обещание конкретной лодки. При остановке работы переходите через Риальто.","pin":"Метка — ориентир возле Foscari Palace / Campo Santa Sofia. Ищите указатель Traghetto на кромке канала; это не остановка вапоретто Ca’ d’Oro.","links":["https://www.comune.venezia.it/it/content/traghetti-parada","https://www.europeforvisitors.com/venice/articles/traghetto.htm"],"acc":"approx","gq":"Traghetto Santa Sofia Venezia","status":"ok","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/%28Venice%29_Traghetto_Santa_Sofia.jpg/960px-%28Venice%29_Traghetto_Santa_Sofia.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"open","t":"09:00–18:00 · €2/чел"},"2":{"s":"open","t":"08:30–19:00 · €2/чел"}},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/%28Venice%29_Traghetto_Santa_Sofia.jpg/960px-%28Venice%29_Traghetto_Santa_Sofia.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:(Venice)_Traghetto_Santa_Sofia.jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/Campo_Santa_Sofia_%28Venice%29.jpg/960px-Campo_Santa_Sofia_%28Venice%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Campo_Santa_Sofia_(Venice).jpg","by":"Didier Descouens","lic":"CC BY-SA 3.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/ba/Traghetto_a_S.Sofia.jpg/960px-Traghetto_a_S.Sofia.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Traghetto_a_S.Sofia.jpg","by":"Original uploader was Adriano at it.wikipedia","lic":"CC BY-SA 3.0"}],"desc":"Гондола-паром через Гранд-канал: от кампо Санта-Софья (рядом с Ка' д'Оро, у Страда Нова) до Пескерии — рыбного рынка Риальто. Это обычный городской транспорт на 3–4 минуты, не экскурсия, и потому интереснее: лодка больше частной, на 10 человек, гребут двое. Венецианцы по традиции плывут стоя, туристы чаще сидят; если гребец велит сесть — садитесь. Платят наличными гребцу, €2, лучше мелочью. В 1950-х таких переправ было около 30, сейчас чуть больше полудюжины, и лодка есть не всегда: нет никого у причала — идите к мосту.","photoPage":"https://commons.wikimedia.org/wiki/File:(Venice)_Traghetto_Santa_Sofia.jpg","photoNear":0},{"id":29,"name":"Рынок Риальто · не барахолка","lat":45.43959,"lng":12.33458,"cluster":"Риальто и Мираколи","cats":["market","food"],"indoor":0,"price":"Осмотр €0","addr":"Mercato di Rialto, Venezia, Italy","why":"Продовольственные ряды: интересны, только когда действительно торгуют. Не заменяет RePulse. Рыбная часть не работает в воскресенье и понедельник. Во вторник возможна утром, но это уже ваш день вылета.","time":"Рыба: вт–сб утром · 1 и 2 ноября рыбные ряды закрыты.","caveat":"В понедельник могут работать овощные продавцы; праздничный состав торговли не подтверждён.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.cntraveler.com/shops/venice/mercato-di-rialto"],"acc":"area","gq":"Mercato di Rialto","status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Pescaria_Rialto_Venice.jpg/960px-Pescaria_Rialto_Venice.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"closed","t":"Рыбные ряды закрыты"},"2":{"s":"warn","t":"Рыбы нет, овощи — может быть"},"3":{"s":"open","t":"Утром рынок работает"}},"hidden":true,"hiddenWhy":"пн без рыбы (отбор v4, 01.11)","photoPage":"https://commons.wikimedia.org/wiki/File:Pescaria_Rialto_Venice.jpg","photoNear":0},{"id":30,"name":"Scala Contarini del Bovolo","lat":45.43481,"lng":12.33455,"cluster":"Сан-Марко · виды и крипта","cats":["hidden","photo"],"indoor":0,"price":"Подъём €9/чел (льготный €7: 12–26 лет и 65+)","addr":"Scala Contarini del Bovolo, San Marco 4297, Venezia, Italy","why":"Спиральная лестница в маленьком дворе — найти, посмотреть снизу и сфотографироваться. В базовом варианте — осмотр снаружи, без подъёма. Платный подъём выбирайте на месте по актуальной цене и очереди.","time":"","caveat":"Расписания подъёма в сторонних источниках расходятся. Доступ в двор может ограничиваться воротами; подъём не включён в бесплатный осмотр.","pin":"","links":["https://www.spottedbylocals.com/venice/scala-contarini-del-bovolo/","https://it.wikipedia.org/wiki/Palazzo_Contarini_del_Bovolo","https://en.wikipedia.org/wiki/Scala_Contarini_del_Bovolo"],"acc":"object","gq":"Scala Contarini del Bovolo","status":"warn","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Scala_Contarini_del_Bovolo_%28Venice%29.jpg/960px-Scala_Contarini_del_Bovolo_%28Venice%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"open","t":"09:30–17:30, последний вход 17:00"},"2":{"s":"open","t":"09:30–17:30, последний вход 17:00"}},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/94/Palazzo_Contarini_del_Bovolo_IMG_3768.JPG/960px-Palazzo_Contarini_del_Bovolo_IMG_3768.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Palazzo_Contarini_del_Bovolo_IMG_3768.JPG","by":"Владимир Шеляпин","lic":"CC0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Scala_Contarini_del_Bovolo_-_Venezia.jpg/960px-Scala_Contarini_del_Bovolo_-_Venezia.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Scala_Contarini_del_Bovolo_-_Venezia.jpg","by":"Petra Venezia","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3b/Masonry_in_the_garden_of_the_Palazzo_Contarini_del_Bovolo.JPG/960px-Masonry_in_the_garden_of_the_Palazzo_Contarini_del_Bovolo.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Masonry_in_the_garden_of_the_Palazzo_Contarini_del_Bovolo.JPG","by":"Ethan Doyle White","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Palazzo_Contarini_del_Bovolo_scala_dall_alto_Venezia.jpg/960px-Palazzo_Contarini_del_Bovolo_scala_dall_alto_Venezia.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Palazzo_Contarini_del_Bovolo_scala_dall_alto_Venezia.jpg","by":"This Photo was taken by Wolfgang Moroder.  \n\nFeel free to use my photos, but ple","lic":"CC BY-SA 3.0"}],"desc":"Спиральная лестница-башня во внутреннем дворе палаццо Contarini del Bovolo; «bòvolo» по-венециански «улитка». Основной корпус — поздняя готика, а в конце XV века (около 1499) к нему добавили ренессансное крыло с лоджиями; пять ярусов арок на колоннах опоясывают башню, наверху — купольный бельведер с видом на крыши. В 1859 году астроном Вильгельм Темпель наблюдал отсюда небо и открыл комету. Во дворе — старинные оголовки колодцев, их тоже стоит рассмотреть. По подписи к фото на Commons — 113 ступеней и около 26 м; без подъёма хватит кадра снизу.","photoPage":"https://commons.wikimedia.org/wiki/File:Scala_Contarini_del_Bovolo_(Venice).jpg","photoNear":0},{"id":31,"name":"Piazza San Marco","lat":45.43426,"lng":12.33851,"cluster":"Сан-Марко · виды и крипта","cats":["photo"],"indoor":0,"price":"Площадь €0","addr":"Piazza San Marco, Venezia, Italy","why":"Увидеть главный ансамбль города снаружи и пройти к большой воде. В этом путеводителе — площадь и фасады, без билетов в собор, дворец и колокольню. В дорогие кафе не обязательно заходить ради вида.","time":"","caveat":"При высокой воде низкие участки могут быть недоступны. Бесплатная площадь не означает бесплатный вход во все здания.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.comune.venezia.it/it/content/murano-illumina-il-mondo-1"],"acc":"area","gq":"Piazza San Marco","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Piazza_San_Marco_%28Venice%29_at_night-msu-2021-6449-.jpg/960px-Piazza_San_Marco_%28Venice%29_at_night-msu-2021-6449-.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"hidden":true,"hiddenWhy":"стандартное (отбор v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Piazza_San_Marco","photoNear":0},{"id":32,"name":"Murano illumina il mondo","lat":45.4344,"lng":12.337989,"cluster":"Сан-Марко · виды и крипта","cats":["art","free"],"indoor":0,"price":"Уличный просмотр €0","addr":"Procuratie Vecchie, Piazza San Marco, Venezia, Italy","why":"Двенадцать авторских световых работ из муранского стекла под аркадами. Смотреть под аркадами Procuratie Vecchie. Это не поездка на остров Мурано и не платный мастер-класс.","time":"Выставка заканчивается 1 ноября 2026.","caveat":"Время окончания и демонтажа в последний день не опубликовано. Не переносить на 2 ноября.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.comune.venezia.it/it/content/murano-illumina-il-mondo-1"],"acc":"area","gq":"Procuratie Vecchie Venezia","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Venezia_piazza_s.Marco.JPG/960px-Venezia_piazza_s.Marco.JPG?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"only","t":"Последний день · смотреть с аркады в любое время"},"2":{"s":"closed","t":"Выставка закончилась"},"3":{"s":"closed","t":"Выставка закончилась"}},"hidden":true,"hiddenWhy":"выставка прошла (v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Procuratie","photoNear":0},{"id":33,"name":"Ponte della Paglia и Riva degli Schiavoni","lat":45.43365,"lng":12.341,"cluster":"Сан-Марко · виды и крипта","cats":["photo","water"],"indoor":0,"price":"€0","addr":"Ponte della Paglia, Venezia, Italy","why":"Мост Вздохов снаружи, лодки и длинный открытый вид на лагуну. Можно продолжить по набережной в сторону Marinaressa. Для фотографий остановиться там, где не перекрываете поток людей.","time":"","caveat":"","pin":"","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/castello-arte-navale-e-tradizioni"],"acc":"object","gq":"Ponte della Paglia Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/Venice%2C_Riva_degli_Schiavoni_2005.jpg/960px-Venice%2C_Riva_degli_Schiavoni_2005.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"hidden":true,"hiddenWhy":"стандартное (отбор v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Ponte_della_Paglia","photoNear":0},{"id":34,"name":"San Zaccaria · крипта","lat":45.43471,"lng":12.3436,"cluster":"Сан-Марко · виды и крипта","cats":["hidden"],"indoor":1,"price":"Церковь €0 · крипта €1,5–3/чел","addr":"Chiesa di San Zaccaria, Venezia, Italy","why":"Небольшое подземное помещение с колоннами и отражениями в воде. В отзывах билет в часовни и крипту — €3,50 с человека. Это маленькое пространство, не лабиринт тоннелей. Цена не является подтверждённым прайсом на день визита.","time":"По Tripadvisor: вс 16:00–18:00 · пн 10:00–12:00 и 16:00–18:00.","caveat":"До оплаты спросить, можно ли спуститься: при воде доступ бывает только до лестницы. Во время служб осмотр может быть ограничен.","pin":"","links":["https://www.tripadvisor.com/Attraction_Review-g187870-d243057-Reviews-Chiesa_di_San_Zaccaria-Venice_Veneto.html","https://it.wikipedia.org/wiki/Chiesa_di_San_Zaccaria_(Venezia)"],"acc":"object","gq":"Chiesa di San Zaccaria Venezia","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/69/Chiesa_di_San_Zaccaria_Venezia.jpg/960px-Chiesa_di_San_Zaccaria_Venezia.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"warn","t":"только 16:00–18:00"},"2":{"s":"open","t":"10:00–12:00, 16:00–18:00"}},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/San_Zaccaria_%283857099704%29.jpg/960px-San_Zaccaria_%283857099704%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:San_Zaccaria_(3857099704).jpg","by":"Leandro Neumann Ciuffo","lic":"CC BY 2.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b7/Chiesa_di_San_Zaccaria_Venezia_2.jpg/960px-Chiesa_di_San_Zaccaria_Venezia_2.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Chiesa_di_San_Zaccaria_Venezia_2.jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d7/Pala_di_San_Zaccaria_%28Venezia%29.jpg/960px-Pala_di_San_Zaccaria_%28Venezia%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Pala_di_San_Zaccaria_(Venezia).jpg","by":"Didier Descouens","lic":"Public domain"}],"desc":"Крипта лежит под капеллой Сан-Тарасио, построена в X–XI веках по образцу крипты Сан-Марко. Два ряда маленьких колонн делят её на три нефа и держат крестовые своды; из убранства только мраморный алтарь с Мадонной. Когда-то здесь стояли гробницы восьми дожей. Пол ниже уровня моря, поэтому внутри обычно вода: при низкой воде идут по настилу, при высокой крипта закрыта. Наверху — фасад Мауро Кодусси и «Сакра конверсационе» Джованни Беллини 1505 года: заходите в крипту вместе с осмотром церкви.","photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Zaccaria","photoNear":0},{"id":35,"name":"Traghetto Dogana · берег San Marco","lat":45.4328,"lng":12.337,"cluster":"Сан-Марко · виды и крипта","cats":["water"],"indoor":0,"price":"€4 / двоих","addr":"Traghetto Dogana Vallaresso, Venezia, Italy","why":"Из района Vallaresso переправиться к Punta della Dogana. Связывает Сан-Марко с Дорсодуро по воде. В Google Maps выбирайте именно гондольную переправу; обычная остановка вапоретто рядом — другая услуга.","time":"Базовый график 09:00–18:00.","caveat":"Если переправа не работает, пеший обход идёт через мост Академии, а не вдоль воды напрямую.","pin":"Метка обозначает Calle Vallaresso. Пройдите к её выходу на воду и ищите Traghetto Dogana. Не путать с платной туристической гондолой.","links":["https://www.comune.venezia.it/it/content/traghetti-parada"],"acc":"approx","gq":"Traghetto Dogana Venezia","status":"ok","checked":"31.10 (ACTV/ATVO)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Traghetto_dogana.jpg/960px-Traghetto_dogana.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"open","t":"09:00–18:00 · €2/чел"},"2":{"s":"open","t":"09:00–18:00 · €2/чел"}},"hidden":true,"hiddenWhy":"вторая переправа — хватит одной (отбор v4, 01.11)","photoPage":"https://commons.wikimedia.org/wiki/File:Traghetto_dogana.jpg","photoNear":0},{"id":36,"name":"Ponte dei Conzafelzi · Palazzo Tetta","lat":45.43835,"lng":12.34216,"cluster":"Кастелло · дворы и Арсенал","cats":["photo"],"indoor":0,"price":"€0","addr":"Ponte dei Conzafelzi, Venezia, Italy","why":"Дворец на развилке каналов: удобный короткий фотозаход. Для вида нужен мост, а не поиск входа во дворец. Внутреннее посещение здесь не запланировано.","time":"","caveat":"","pin":"","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/castello-arte-navale-e-tradizioni","https://pixeoapp.com/photography-guides/europe/italy/ponte-dei-conzafelzi","https://www.komoot.com/highlight/6282672","https://wanderlog.com/place/details/1602322/palazzo-tetta"],"acc":"object","gq":"Ponte dei Conzafelzi Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/92/Palazzo_Tette_from_the_Ponte_Consalfelzi.jpg/960px-Palazzo_Tette_from_the_Ponte_Consalfelzi.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Venedig-Castello-Palazzo-Tetta.jpg/960px-Venedig-Castello-Palazzo-Tetta.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Venedig-Castello-Palazzo-Tetta.jpg","by":"SchiDD","lic":"CC BY 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/Venezia_Ponte_dei_Conzafelzi_%2854223848351%29.jpg/960px-Venezia_Ponte_dei_Conzafelzi_%2854223848351%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Venezia_Ponte_dei_Conzafelzi_(54223848351).jpg","by":"Jorge Franganillo","lic":"CC BY 2.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Rio_del_Paradiso_%28Venice%29%2C_Italy_-_52971440757.jpg/960px-Rio_del_Paradiso_%28Venice%29%2C_Italy_-_52971440757.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Rio_del_Paradiso_(Venice),_Italy_-_52971440757.jpg","by":"dconvertini","lic":"CC BY-SA 2.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/Ponte_dei_Conzafelzi%2C_Venice_%2831376591896%29.jpg/960px-Ponte_dei_Conzafelzi%2C_Venice_%2831376591896%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Ponte_dei_Conzafelzi,_Venice_(31376591896).jpg","by":"Dimitris Kamaras from Athens, Greece","lic":"CC BY 2.0"}],"desc":"Мост с кованой железной оградой через канал в Кастелло, минут десять пешком от Сан-Марко. Смысл захода — вид с середины моста на север: дворец Тетта, кирпичный, узкий, стоит там, где канал Рио ди Санта-Марина делится на два рукава, и окружён водой с трёх сторон — в Венеции так бывает редко. Это частный дворец, внутрь не идём, смотрим с моста. Свет мягче рано утром и к вечеру; в синий час после заката тёплые огни отражаются в воде. Рядом — книжная лавка Libreria Acqua Alta.","photoPage":"https://commons.wikimedia.org/wiki/File:Palazzo_Tette_from_the_Ponte_Consalfelzi.jpg","photoNear":0},{"id":37,"name":"Libreria Acqua Alta","lat":45.43806,"lng":12.34227,"cluster":"Кастелло · дворы и Арсенал","cats":["market","hidden"],"indoor":1,"price":"Вход €0","addr":"Libreria Acqua Alta, Calle Lunga Santa Maria Formosa 5176B, Venezia, Italy","why":"Книги в лодках, необычный интерьер и дворик из роликов. Это действующий магазин. Покупка необязательна; фотографии не должны мешать продавцам и покупателям.","time":"Сторонний ориентир 09:00–19:10; наружные зоны закрываются раньше.","caveat":"Лестница из книг и гондола закрываются при дожде или приливе; последний вход к ним 17:15, в магазин 19:00. Фото не должны мешать покупателям.","pin":"","links":["https://www.localexperiences.online/en/venice/secret-places/","https://www.libreriacqualta.it/en/contacts/"],"acc":"object","gq":"Libreria Acqua Alta Venezia","status":"warn","checked":"31.10 (сайты, TripAdvisor, OSM)","photo":"https://www.libreriacqualta.it/wp-content/uploads/2024/02/ix1a6907_edit.jpg","days":{"1":{"s":"open","t":"09:00–19:10 (сайт: ежедневно)"},"2":{"s":"open","t":"09:00–19:10"}},"photoPage":"https://www.libreriacqualta.it/en/contacts/","hidden":true,"hiddenWhy":"туристическое, очередь (отбор v4, 01.11)"},{"id":38,"name":"Museo di Palazzo Grimani","lat":45.43685678044424,"lng":12.34204262495041,"cluster":"Кастелло · дворы и Арсенал","cats":["art"],"indoor":1,"price":"€0 только 1 ноября","addr":"Museo di Palazzo Grimani, Castello 4858, Venezia, Italy","why":"Исторические залы и Tribuna с античными скульптурами. Государственный музей у Santa Maria Formosa. 1 ноября — первое воскресенье месяца, бесплатный вход по программе Domenica al Museo.","time":"Вт–вс 10:00–19:00 · последний вход 18:00 · пн закрыто.","caveat":"Не путать с Palazzo Vendramin Grimani. 2 ноября закрыт; 3 ноября обычный платный день. На бесплатный вход возможна очередь.","pin":"","links":["https://museogrimani.cultura.gov.it/","https://www.museivenezia.it/musei-gratis-venezia/"],"acc":"object","gq":"Museo di Palazzo Grimani","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Palazzo_Grimani%2C_Venice_%2830483051173%29.jpg/960px-Palazzo_Grimani%2C_Venice_%2830483051173%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"free","t":"Бесплатно · 10:00–19:00, вход до 18:00"},"2":{"s":"closed","t":"Пн закрыто"},"3":{"s":"open","t":"10:00–19:00 · платно"}},"hidden":true,"hiddenWhy":"пн закрыто (отбор v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Palazzo_Grimani_di_Santa_Maria_Formosa","photoNear":0},{"id":39,"name":"Corte Nova · синий проход","lat":45.437,"lng":12.346381,"cluster":"Кастелло · дворы и Арсенал","cats":["hidden"],"indoor":0,"price":"€0","addr":"Sotoportego de Corte Nova, Calle Zorzi, Castello, Venezia, Italy","why":"Найти проход-часовню с сине-золотым потолком и красным камнем. Нужен sotoportego между Calle Zorzi и Corte Nova в Castello, у Santa Giustina. Местная легенда связывает красный камень с остановившейся чумой; это легенда, не исторический факт.","time":"","caveat":"Не выбирать одноимённую Corte Nova в Cannaregio. Если навигатор показывает другой район, сверить название Calle Zorzi.","pin":"","links":["https://www.conoscerevenezia.it/?p=49667","https://ivbc.it/wp-content/uploads/2020/05/Relazione-finale-Corte-Nova.pdf","https://www.savevenice.org/project/sotoportego-di-corte-nova","https://commons.wikimedia.org/wiki/File:Sotoportego_Zorzi_(20920239194).jpg"],"acc":"approx","gq":null,"status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Sotoportego_de_la_Corte_Nova_oder_auch_Sotoportego_de_la_peste-2025-msu-6195-.jpg/960px-Sotoportego_de_la_Corte_Nova_oder_auch_Sotoportego_de_la_peste-2025-msu-6195-.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/Calle_Zorzi_Durchgang_%28Venedig%29_1.jpg/960px-Calle_Zorzi_Durchgang_%28Venedig%29_1.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Calle_Zorzi_Durchgang_(Venedig)_1.jpg","by":"Ricardalovesmonuments","lic":"CC BY-SA 4.0"},{"u":"https://upload.wikimedia.org/wikipedia/commons/2/27/Sotoportego_Zorzi_%2821356089559%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled","page":"https://commons.wikimedia.org/wiki/File:Sotoportego_Zorzi_(21356089559).jpg","by":"Alex Alishevskikh","lic":"CC BY-SA 2.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Sotoportego_Zorzi_%2820920239194%29.jpg/960px-Sotoportego_Zorzi_%2820920239194%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Sotoportego_Zorzi_(20920239194).jpg","by":"Alex Alishevskikh","lic":"CC BY-SA 2.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Calle_Zorzi_Durchgang_%28Venedig%29_2.jpg/960px-Calle_Zorzi_Durchgang_%28Venedig%29_2.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Calle_Zorzi_Durchgang_(Venedig)_2.jpg","by":"Ricardalovesmonuments","lic":"CC BY-SA 4.0"}],"desc":"Проход-sotoportego между Calle Zorzi и Corte Nova выглядит как маленькая часовня: потолок из расписных кессонов (реставраторы датируют его 1730 годом), красные занавеси, по бокам в нишах четыре картины в память об избавлении от чумы 1630 года. Реставрация закончилась в 2016-м. На мраморной табличке над аркой жители двора благодарят Мадонну делла Салюте за то, что их щадили бомбы вражеских самолётов. Это остановка на пару минут, а не маршрут; рядом Santa Giustina.","photoPage":"https://commons.wikimedia.org/wiki/File:Sotoportego_de_la_Corte_Nova_oder_auch_Sotoportego_de_la_peste-2025-msu-6195-.jpg","photoNear":0},{"id":40,"name":"San Francesco della Vigna · дворы","lat":45.43822,"lng":12.34808,"cluster":"Кастелло · дворы и Арсенал","cats":["hidden"],"indoor":0,"price":"При открытом доступе €0","addr":"Chiesa di San Francesco della Vigna, Venezia, Italy","why":"Тихие аркады, старые стены и спокойная пауза среди города. Местная фотограф описывает монастырские дворы как место, куда приходит отдыхать с мужем. Для нас это необязательный короткий заход.","time":"Доступ во дворы на конкретные часы не подтверждён.","caveat":"Не путать со специальными платными посещениями виноградника. Закрытые двери и служебные зоны не обходить.","pin":"","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city","https://en.wikipedia.org/wiki/San_Francesco_della_Vigna"],"acc":"object","gq":"Chiesa di San Francesco della Vigna","status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Facade_of_San_Francesco_della_Vigna_%28Venice%29.jpg/960px-Facade_of_San_Francesco_della_Vigna_%28Venice%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Cloister_of_San_Francesco_della_Vigna_%28Venice%29.jpg/960px-Cloister_of_San_Francesco_della_Vigna_%28Venice%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Cloister_of_San_Francesco_della_Vigna_(Venice).jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/Cloister_%28second%29_of_San_Francesco_della_Vigna_%28Venice%29.jpg/960px-Cloister_%28second%29_of_San_Francesco_della_Vigna_%28Venice%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Cloister_(second)_of_San_Francesco_della_Vigna_(Venice).jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/56/Cloister_of_San_Francesco_della_Vigna_%28Venice%292.jpg/960px-Cloister_of_San_Francesco_della_Vigna_%28Venice%292.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Cloister_of_San_Francesco_della_Vigna_(Venice)2.jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Cloister_of_San_Francesco_della_Vigna_%28Venice%29_-_Well_head.jpg/960px-Cloister_of_San_Francesco_della_Vigna_%28Venice%29_-_Well_head.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Cloister_of_San_Francesco_della_Vigna_(Venice)_-_Well_head.jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"}],"desc":"Монастырь францисканцев при церкви San Francesco della Vigna. Название — от виноградника (vigna) на этом месте: участок отдали под монастырь в 1253 году. Во дворах — аркады на колоннах, кирпичные стены и каменный колодец с резной розеткой; снаружи белый мраморный фасад Палладио (1564–1570) и высокая колокольня. Если двор закрыт, церковь всё равно стоит захода: в Святой капелле — «Мадонна с младенцем и четырьмя святыми» Джованни Беллини (1507).","photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Francesco_della_Vigna","photoNear":0},{"id":41,"name":"Celestia · наружная стена Арсенала","lat":45.4378991,"lng":12.3496928,"cluster":"Кастелло · дворы и Арсенал","cats":["hidden","water"],"indoor":0,"price":"Общественный маршрут €0","addr":"Campo de la Celestia, Venezia, Italy","why":"Кирпичные стены верфи, узкая дорожка и открытая лагуна. Осматривать общественную наружную часть. Это промышленная атмосфера без обещания зайти в закрытые корпуса или платную Биеннале.","time":"","caveat":"На воде бывает ветрено; отдельные проходы могут перекрывать. Не планируйте свободный доступ во внутренний Арсенал.","pin":"Метка обозначает Campo de la Celestia. К наружной дорожке у стены Арсенала пройдите в сторону лагуны; внутренние корпуса не открыты свободно.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/castello-arte-navale-e-tradizioni","https://en.wikipedia.org/wiki/Venetian_Arsenal","https://commons.wikimedia.org/wiki/File:Rielo_drio_la_celestia_verso_nord.JPG"],"acc":"area","gq":"Campo de la Celestia Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Campo_de_l%27Arsenal.jpg/960px-Campo_de_l%27Arsenal.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Rielo_drio_la_celestia_verso_nord.JPG/960px-Rielo_drio_la_celestia_verso_nord.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Rielo_drio_la_celestia_verso_nord.JPG","by":"Abxbay","lic":"CC BY-SA 3.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Venezia_Rielo_drio_la_Celestia_20090228.jpg/960px-Venezia_Rielo_drio_la_Celestia_20090228.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Venezia_Rielo_drio_la_Celestia_20090228.jpg","by":"Unofeld781","lic":"CC BY-SA 3.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2b/Venezia_%2821356099269%29.jpg/960px-Venezia_%2821356099269%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Venezia_(21356099269).jpg","by":"Alex Alishevskikh","lic":"CC BY-SA 2.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Rielo_drio_la_celestia_verso_ovest.JPG/960px-Rielo_drio_la_celestia_verso_ovest.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Rielo_drio_la_celestia_verso_ovest.JPG","by":"Abxbay","lic":"CC BY-SA 3.0"}],"desc":"Вдоль узкого канала Rielo drio la Celestia тянется высокая кирпичная стена с зубцами — внешняя ограда Арсенала, государственной верфи Венеции. Ограда длиной около 3,2 км скрывала верфь от посторонних глаз; в начале XVI века там работали около 16 000 человек, почти по кораблю в день. Здесь нет ни толп, ни сувенирных лавок: узкая набережная, лодки у свай, бельё на верёвках, в конце канала — открытая вода лагуны. Идти ради стены и тишины, а не ради входа: рассчитывать попасть внутрь Арсенала не стоит. Рядом колокольня Сан-Франческо делла Винья.","photoPage":"https://it.wikipedia.org/wiki/Arsenale_di_Venezia","photoNear":0},{"id":42,"name":"Rosa Salva · кофе и сладкое","lat":45.43892,"lng":12.34175,"cluster":"Кастелло · дворы и Арсенал","cats":["food"],"indoor":1,"price":"План: €8–14","addr":"Rosa Salva, Campo Santi Giovanni e Paolo, Venezia, Italy","why":"Небольшая сладкая пауза возле Santi Giovanni e Paolo. Нужна точка на Campo SS. Giovanni e Paolo. Плановая сумма на двоих зависит от напитков и десертов; это не подтверждённое предложение.","time":"Обычный график точки 08:00–20:00.","caveat":"У стойки и за столиком условия могут отличаться. Сначала меню, особенно если хотите горячий шоколад и десерт.","pin":"","links":["https://rosasalva.it/it/locali-rosa-salva","https://www.timeout.com/venice/restaurants/rosa-salva","https://www.dissapore.com/locali/pasticceria-rosa-salva-a-venezia-recensione/"],"acc":"object","gq":"Rosa Salva Campo Santi Giovanni e Paolo","status":"ok","checked":"31.10 (сайты, TripAdvisor, OSM)","photo":null,"days":{"1":{"s":"open","t":"08:00–20:00 (сайт: ежедневно)"},"2":{"s":"open","t":"08:00–20:00"}},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Castello%2C_30100_Venezia%2C_Italy_-_panoramio_%28402%29.jpg/960px-Castello%2C_30100_Venezia%2C_Italy_-_panoramio_%28402%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Castello,_30100_Venezia,_Italy_-_panoramio_(402).jpg","by":"Lothar John","lic":"CC BY-SA 3.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Castello%2C_30100_Venezia%2C_Italy_-_panoramio_%28240%29.jpg/960px-Castello%2C_30100_Venezia%2C_Italy_-_panoramio_%28240%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Castello,_30100_Venezia,_Italy_-_panoramio_(240).jpg","by":"Lothar John","lic":"CC BY-SA 3.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Castello%2C_30100_Venezia%2C_Italy_-_panoramio_%28161%29.jpg/960px-Castello%2C_30100_Venezia%2C_Italy_-_panoramio_%28161%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Castello,_30100_Venezia,_Italy_-_panoramio_(161).jpg","by":"Lothar John","lic":"CC BY-SA 3.0"}],"desc":"Семейная кондитерская Rosa Salva: источники называют год основания 1870 или 1876, нынешнее поколение — шестое. Главная лавка на Calle Fiubera, а эта — на площади Campo Santi Giovanni e Paolo, у огромной базилики; Dissapore называет её очень атмосферной и советует взглянуть на само здание. Time Out хвалит капучино и торты, а в витринах — конфитюры, цукаты и сахарные бутоны роз. Столики стоят прямо на площади: возьмите кофе или горячий шоколад с выпечкой и посидите, глядя на базилику и старые дома вокруг."},{"id":43,"name":"San Pietro di Castello","lat":45.4347133,"lng":12.3590844,"cluster":"Восток · Сан-Пьетро и парки","cats":["walk"],"indoor":0,"price":"Снаружи €0","addr":"Campo San Piero de Casteo, Venezia, Italy","why":"Тихий восточный край города и место высадки со специальной DE. Гуляем по campo и берегам вокруг. Посещение самой базилики — отдельный вопрос, в бесплатную уличную точку не включено.","time":"Бесплатная DE действует только 31 октября — 2 ноября.","caveat":"","pin":"Метка обозначает площадь у церкви. Причал S. Pietro di Castello ищите по указателям; это не точка трапа.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/castello-arte-navale-e-tradizioni","https://muoversi.venezia.it/it/content/commemorazione-dei-defunti-servizi-gratuiti-e-fermata-straordinaria-di-linea-13"],"acc":"area","gq":"Basilica di San Pietro di Castello","status":"ok","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Venezia_-_San_Pietro_di_Castello.JPG/960px-Venezia_-_San_Pietro_di_Castello.JPG?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"hidden":true,"hiddenWhy":"прогулка (отбор v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Basilica_di_San_Pietro_di_Castello","photoNear":0},{"id":44,"name":"Campo Ruga и Fondamenta Sant’Anna","lat":45.433776,"lng":12.357429,"cluster":"Восток · Сан-Пьетро и парки","cats":["walk"],"indoor":0,"price":"€0","addr":"Campo Ruga, Castello, Venezia, Italy","why":"Небольшие мосты и жилые каналы без отдельного аттракциона. Хороший переход от San Pietro к Via Garibaldi: можно сворачивать в открытые общественные переулки, не заходя в частные подъезды.","time":"","caveat":"","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/castello-arte-navale-e-tradizioni"],"acc":"area","gq":"Campo Ruga Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/Campo_ruga_venezia.jpg/960px-Campo_ruga_venezia.jpg?utm_sou 1-5474-.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/The_squero_San_Trovaso_and_church_in_Venice.JPG/960px-The_squero_San_Trovaso_and_church_in_Venice.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:The_squero_San_Trovaso_and_church_in_Venice.JPG","by":"This Photo was taken by Wolfgang Moroder.  \n\nFeel free to use my photos, but ple","lic":"CC BY-SA 3.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Venezia_-_Dorsoduro_-_Squero_di_San_Trovaso.jpg/960px-Venezia_-_Dorsoduro_-_Squero_di_San_Trovaso.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Venezia_-_Dorsoduro_-_Squero_di_San_Trovaso.jpg","by":"Jorge Franganillo","lic":"CC BY 2.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/Squero_s_trovaso_venezia.jpg/960px-Squero_s_trovaso_venezia.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Squero_s_trovaso_venezia.jpg","by":"Abxbay","lic":"CC BY-SA 4.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Luigi_Querena_Squero_di_San_Trovaso_1860.jpg/960px-Luigi_Querena_Squero_di_San_Trovaso_1860.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Luigi_Querena_Squero_di_San_Trovaso_1860.jpg","by":"Luigi Querena","lic":"Public domain"}],"desc":"Один из старейших и самых известных действующих сквери Венеции: стоит на канале Рио-Сан-Тровазо и относится к XVII веку. Сегодня здесь работают только с гондолами, раньше строили и чинили и другие лодки (пуппарини, сандоли). Деревянные навесы похожи на горный дом — для Венеции необычно; это связывают с мастерством мастеров и с тем, что многие из них родом из Кадоре. Смотрите с противоположной набережной, на фоне — церковь Сан-Тровазо. Картина Луиджи Кверены 1860 года показывает этот же сквери в праздник Реденторе.","photoPage":"https://it.wikipedia.org/wiki/Squero_di_San_Trovaso","photoNear":0},{"id":52,"name":"Osteria Al Squero","lat":45.4301,"lng":12.32616,"cluster":"Дорсодуро · верфь и набережная","cats":["food"],"indoor":1,"price":"cicchetti €2,50 · spritz €3,50 → ≈ €11–13 на двоих","addr":"Osteria Al Squero, Dorsoduro 943, Venezia, Italy","why":"Чиккетти рядом с видом на верфь — по желанию вместо полноценного обеда. Ориентир суммы на двоих, не фиксированный сет. Маленькие закуски могут незаметно набрать ресторанный чек.","time":"Часы на конкретный день сверить; понедельник заявлялся 10:00–21:00.","caveat":"Не рассчитывать на долгую посадку. При очереди есть пицца у Santa Margherita или другие места по текущему меню.","pin":"","links":["https://www.alsquero.it/"],"acc":"object","gq":"Osteria Al Squero Venezia","status":"warn","checked":"31.10 (сайты, TripAdvisor, OSM)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Venezia_-_Dorsoduro_-_Squero_di_San_Trovaso.jpg/960px-Venezia_-_Dorsoduro_-_Squero_di_San_Trovaso.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"closed","t":"Вс закрыто (сайт)"},"2":{"s":"open","t":"10:00–20:30"}},"hidden":true,"hiddenWhy":"еда — вторично (отбор v4, 01.11)","photoPage":"https://commons.wikimedia.org/wiki/File:Venezia_-_Dorsoduro_-_Squero_di_San_Trovaso.jpg","photoNear":1},{"id":53,"name":"Ponte dell’Accademia","lat":45.43166,"lng":12.32891,"cluster":"Дорсодуро · верфь и набережная","cats":["photo"],"indoor":0,"price":"€0","addr":"Ponte dell’Accademia, Venezia, Italy","why":"Вид по Гранд-каналу в сторону Salute и переход в район San Marco. Фототочка на обычном пешеходном мосту. Не требует музейного билета и не зависит от работы галереи.","time":"","caveat":"","pin":"","links":["https://www.veneziaunica.it/it/cosa-
