ией. Первый, железный, открыли в 1854 году (инженер Альфред Невилл), но венецианцам он не нравился — слишком индустриальный. В 1932–33 Эудженио Миоцци за 37 дней поставил деревянный, задуманный временным; нынешний, стальной каркас в деревянной обшивке, — 1984–86, а после реставрации его заново открыли 28.08.2018. С середины моста смотрите на восток: купол Санта-Мария-делла-Салюте и ряд палаццо у воды, по каналу идут вапоретто. Свет лучше к вечеру.","photoPage":"https://it.wikipedia.org/wiki/Ponte_dell%27Accademia","photoNear":0},{"id":54,"name":"Gallerie dell’Accademia","lat":45.43137,"lng":12.32809,"cluster":"Дорсодуро · верфь и набережная","cats":["art","friend"],"indoor":1,"price":"€0 только 1 ноября","addr":"Gallerie dell’Accademia, Dorsoduro 1050, Venezia, Italy","why":"Классическая живопись, когда хочется искусства или укрыться от дождя. 1 ноября 2026 прямо указано бесплатным днём. Брони на бесплатный вход нет; вход по очереди. Не обязательно обходить музей целиком. **Друг тоже прислал эту ссылку.**","time":"1 ноября 09:00–19:00 · касса до 18:00 · вход бесплатный (День всех святых + первое воскресенье). 2 ноября (пн) — закрыто.","caveat":"Не переносить бесплатность на 2–3 ноября. В остальные дни обычный билет €15 с человека; режим понедельника отдельно не подтверждён.","pin":"","links":["https://www.gallerieaccademia.it/visita/orari-e-biglietti/"],"acc":"object","gq":"Gallerie dell'Accademia","status":"warn","checked":"31.10 (официальный сайт)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Accademia_%28Venice%29.jpg/960px-Accademia_%28Venice%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"free","t":"Бесплатно · 09:00–19:00, касса до 18:00, без брони"},"2":{"s":"open","t":"Пн 2.11 внеочередное открытие, обычный билет (сайт музея)"}},"friendLabel":"без подписи","layer":"visited","photoPage":"https://it.wikipedia.org/wiki/Gallerie_dell%27Accademia","photoNear":0},{"id":55,"name":"Zattere","lat":45.429507,"lng":12.324308,"cluster":"Дорсодуро · верфь и набережная","cats":["photo","water"],"indoor":0,"price":"€0","addr":"Fondamenta Zattere ai Gesuati, Venezia, Italy","why":"Длинная набережная у большой воды: простор, лодки и фотографии. Можно идти к Punta della Dogana или, наоборот, к тихому западному краю. Выбор зависит от того, где хотите закончить прогулку.","time":"","caveat":"При сильном ветре это открытый участок. Не нужно проходить всю набережную ради галочки.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city"],"acc":"area","gq":"Zattere Venezia","status":"free","checked":null,"photo":"https://upload.wikimedia.org/wikipedia/commons/a/a0/Huck_and_jim_on_raft.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","days":{},"hidden":true,"hiddenWhy":"прогулка (были в вс) (отбор v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Zattera","photoNear":0},{"id":56,"name":"Santa Maria della Salute · снаружи","lat":45.43057,"lng":12.33472,"cluster":"Дорсодуро · верфь и набережная","cats":["photo"],"indoor":0,"price":"Снаружи €0","addr":"Basilica di Santa Maria della Salute, Venezia, Italy","why":"Посмотреть купол и фасад со стороны набережной и узких улочек. Бесплатная карточка относится к внешнему виду. Ризница, выставки и отдельные внутренние пространства не включены.","time":"","caveat":"","pin":"","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city","https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/dorsoduro-sestiere-d-arte"],"acc":"object","gq":"Basilica di Santa Maria della Salute","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Venice_city_scenes_-_on_the_Grand_Canal_-_Polizia%21_%2811002248065%29.jpg/960px-Venice_city_scenes_-_on_the_Grand_Canal_-_Polizia%21_%2811002248065%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"hidden":true,"hiddenWhy":"стандартное (отбор v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Basilica_di_Santa_Maria_della_Salute","photoNear":0},{"id":57,"name":"Punta della Dogana · мыс","lat":45.43095,"lng":12.33709,"cluster":"Дорсодуро · верфь и набережная","cats":["photo","water"],"indoor":0,"price":"Набережная €0","addr":"Punta della Dogana, Venezia, Italy","why":"Открытый вид на воду между San Marco и Giudecca. Здесь имеется в виду внешняя набережная, не платная художественная выставка внутри здания. Можно закончить прогулку короткой переправой Dogana, если она работает.","time":"","caveat":"У воды нет ощущения тёплого закрытого дворика; в непогоду не задерживаться. На противоположный берег не пройти по прямой.","pin":"","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/dorsoduro-sestiere-d-arte"],"acc":"object","gq":"Punta della Dogana","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Venezia-punta_della_dogana.jpg/960px-Venezia-punta_della_dogana.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"hidden":true,"hiddenWhy":"стандартное (отбор v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Punta_della_Dogana","photoNear":0},{"id":58,"name":"Angelo Raffaele → San Nicolò dei Mendicoli","lat":45.4325,"lng":12.3159,"cluster":"Дорсодуро · верфь и набережная","cats":["walk"],"indoor":0,"price":"Улица €0","addr":"Chiesa di San Nicolò dei Mendicoli, Venezia, Italy","why":"Спокойный западный Дорсодуро: старые дома и каналы вне главного потока. Связка рекомендована местной фотографом для неспешной прогулки. Внутрь церкви заходить только при открытом доступе.","time":"","caveat":"Это продолжение на запад от Zattere, не короткая остановка у Dogana. Усталость — повод сократить петлю. Это НЕ храм с мощами Николая: нужный храм находится на Лидо.","pin":"","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city"],"acc":"object","gq":"Chiesa di San Nicolò dei Mendicoli","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Chiesa_di_San_Nicol%C3%B2_dei_Mendicoli_-_Venezia.jpg/960px-Chiesa_di_San_Nicol%C3%B2_dei_Mendicoli_-_Venezia.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"hidden":true,"hiddenWhy":"прогулка (отбор v4, 01.11)","photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Nicol%C3%B2_dei_Mendicoli","photoNear":0},{"id":59,"name":"Santa Marta","lat":45.4343,"lng":12.3134,"cluster":"Дорсодуро · верфь и набережная","cats":["walk","hidden"],"indoor":0,"price":"€0","addr":"Campo Santa Marta, Venezia, Italy","why":"Жилой и бывший портовый край вместо ещё одной парадной площади. Можно совместить с San Nicolò и постепенно вернуться к Piazzale Roma. Закрытые портовые и служебные территории не входят в маршрут.","time":"","caveat":"","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city"],"acc":"area","gq":"Campo Santa Marta Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Chiesa_di_Santa_Marta_-_Venezia.jpg/960px-Chiesa_di_Santa_Marta_-_Venezia.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{},"hidden":true,"hiddenWhy":"прогулка (отбор v4, 01.11)","photoPage":"https://commons.wikimedia.org/wiki/File:Chiesa_di_Santa_Marta_-_Venezia.jpg","photoNear":0},{"id":60,"name":"San Michele · островное кладбище","lat":45.446979999999996,"lng":12.346300000000001,"cluster":"Сан-Микеле · только на лодке","cats":["walk","nature"],"indoor":0,"price":"Вход €0","addr":"Cimitero di San Michele, Venezia, Italy","why":"Кипарисы, кирпичные стены и короткая прогулка между двумя поездками на лодке. Не главная цель поездки и не заброшка. 1–2 ноября здесь поминальные дни: спокойно гулять, не мешать семьям, без постановочных фото на могилах.","time":"2.11: 07:30–17:00, последний вход за 30 мин · месса 10:00","caveat":"Пешего мостика в город нет. Заранее сверяйте обратную DE; 3 ноября бесплатная акция уже закончилась.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.gruppoveritas.it/sites/default/files/documenti/comuni_profilati/brochure_cimitero_san_michele.pdf","https://actv.avmspa.it/it/content/commemorazione-dei-defunti-servizi-gratuiti-e-fermata-straordinari"],"acc":"area","gq":"Cimitero di San Michele Venezia","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/San_Michele_cemetery_island%2C_Venice.jpg/960px-San_Michele_cemetery_island%2C_Venice.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"open","t":"07:30–16:30 (до 17:00 не подтверждено) · DE бесплатно"},"2":{"s":"free","t":"07:30–17:00 · месса 10:00 · бесплатная лодка DE"},"31":{"s":"open","t":"07:30–17:00 · бесплатная лодка DE"},"3":{"s":"warn","t":"Бесплатных лодок уже нет"}},"desc":"Остров-кладбище Венеции с 1807 года: кирпичная стена, кипарисы и церковь San Michele in Isola (1469) — первая ренессансная церковь города. 2 ноября — День поминовения: в 10:00 патриаршая месса, семьи несут цветы, ходят бесплатные лодки DE. Знаменитые могилы — на некатолических участках: протестантский recinto XV Evangelico — Иосиф Бродский и Эзра Паунд; православный recinto XIV Greco — Игорь Стравинский и Сергей Дягилев (на его могиле балетные туфли). Схема участков — буклет Veritas у входа. Вести себя как на кладбище: тихо, без постановочных фото.","tip":"По схеме Veritas: Паунд — №1, Бродский — №3, Дягилев — №4, Стравинский — №5. От входа к участкам XIV–XV — налево вглубь, ≈10 мин.","photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/Venice%2C_Italy_-_panoramio_ вс 1.11 после мессы, около 12:15.** От Lido S.M.E. ~30 мин пешком. Телефон прихода подтверждён тремя источниками.","caveat":"**Не обязательно — по пути.** Лидо — отдельный остров: заезжать удобно, только если едете бесплатной DE к San Michele (она идёт дальше на Лидо через San Pietro). Перед поездкой позвонить: «Vorrei venerare le reliquie di San Nicola. È possibile avvicinarsi al reliquiario?» Прикосновение не обещано.","pin":"","links":["https://mapcarta.com/W140950703","https://en.wikipedia.org/wiki/San_Nicol%C3%B2_al_Lido"],"acc":"object","gq":"Chiesa di San Nicolò al Lido","status":"warn","checked":"31.10 (orarimesse.it, dindondan, stnicholascenter.org, отзывы)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Venezia_-_Chiesa_di_S.Nicol%C3%B2.JPG/960px-Venezia_-_Chiesa_di_S.Nicol%C3%B2.JPG?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"open","t":"Месса 11:15 → после ~12:15 надёжнее всего"},"2":{"s":"warn","t":"Мессы нет; часы: 10:30–17:00 или 15:00–17:00 — позвонить"},"3":{"s":"warn","t":"часы не подтверждены"}},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/L%27%C3%A9glise_et_le_pont_de_San_Nicolo_%28Lido_de_Venise%29_%2810137997536%29.jpg/960px-L%27%C3%A9glise_et_le_pont_de_San_Nicolo_%28Lido_de_Venise%29_%2810137997536%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:L%27%C3%A9glise_et_le_pont_de_San_Nicolo_(Lido_de_Venise)_(10137997536).jpg","by":"Jean-Pierre Dalbéra from Paris, France","lic":"CC BY 2.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Church_of_San_Nicolo_al_Lido_-_Venice%2C_Italy_-_panoramio.jpg/960px-Church_of_San_Nicolo_al_Lido_-_Venice%2C_Italy_-_panoramio.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Church_of_San_Nicolo_al_Lido_-_Venice,_Italy_-_panoramio.jpg","by":"Sergey Ashmarin","lic":"CC BY-SA 3.0"},{"u":"https://upload.wikimedia.org/wikipedia/commons/7/7a/Lido_di_Venezia_Chiesa_di_San_Nicol%C3%B2_-_panoramio.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled","page":"https://commons.wikimedia.org/wiki/File:Lido_di_Venezia_Chiesa_di_San_Nicol%C3%B2_-_panoramio.jpg","by":"maury3001","lic":"CC BY 3.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/San_Nicol%C3%B2_%28Venice%29.jpg/960px-San_Nicol%C3%B2_%28Venice%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:San_Nicol%C3%B2_(Venice).jpg","by":"Didier Descouens","lic":"CC BY-SA 4.0"}],"desc":"Древняя церковь на краю острова Лидо: монастырь основан в XI веке, а 9 мая 1000 года отсюда ушёл флот дожа Пьетро Орсеоло II — об этом напоминает церемония «Обручение с морем» (Sposalizio del Mare). В 1100 году сюда привезли реликвии святого Николая из Миры; Венеция и Бари спорят, чьи они, но проверки 1953 и 1992 годов показали, что фрагменты из обоих городов принадлежат одному человеку. Снаружи — незаконченный фасад с гробницей дожа Доменико Контарини наверху и барочная колокольня 1626–1629 годов.","photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Nicol%C3%B2_%28Venezia%2C_Lido%29","photoNear":0},{"id":64,"name":"Lido S.M.E. E · бесплатная DE","lat":45.41737,"lng":12.36751,"cluster":"Лидо · мощи святого Николая","cats":["water"],"indoor":0,"price":"€0 на DE 31.10–02.11","addr":"Lido Santa Maria Elisabetta E, Venezia, Italy","why":"Причал бесплатного рейса к Сан-Микеле через San Pietro и Celestia. Отсюда можно идти к храму на Лидо. DE с Cimitero A приходит на Lido S.M.E. через San Pietro di Castello. Из Cimitero A: 10:40, 11:40, 12:40, 14:40, 15:40, 16:40. Время прибытия на Лидо в объявлении не указано. Обычные линии не бесплатны.","time":"Из Lido S.M.E. E: 10:10, 11:10, 12:10, 14:10, 15:10, 16:10. Только 31 октября – 2 ноября 2026","caveat":"Э arket-leader-gondolina-becomes-italys-leading-venetian-footwear-brand/2025100684258"],"gq":"Gondolina Shoes Venezia","checked":"31.10 (OSM, сайт бренда, FashionUnited)","photoPage":"https://gondolinaofficial.com/","days":{"1":{"s":"warn","t":"часы не нашли — смотреть Google Maps · праздник"},"2":{"s":"warn","t":"часы не нашли — смотреть Google Maps"},"3":{"s":"warn","t":"часы не нашли — смотреть Google Maps"}},"desc":"Фурлане — бархатные туфли-тапочки, которые родились в сельском Фриули в XIX веке и стали «обувью гондольеров»: их носили, чтобы защитить ноги от дерева гондолы, и продавали, в числе прочего, на мосту Риальто. Подошвы сначала были тканевые, потом из переработанной велосипедной шины — Gondolina этот приём сохраняет (бархат с озера Комо, подошва из старых покрышек). Для Марии — вещь с историей, а не безликий сувенир: смотреть бархат и модели Мэри-Джейн. Шьют во Фриули, в Венеции шоурум у Риальто."},{"cluster":"🐱 Хочу сюда","cats":["shop","maria"],"indoor":1,"acc":"object","status":"ok","photo":null,"pin":"Адрес с сайта jbgloves.com: JB Guanti srl, San Marco 4821; точка — по номеру дома (OSM).","caveat":"На скриншоте написано «JB Gaunt» — это JB Guanti (по описанию и адресу). Не путать с другим перчаточным магазином — Caridei.","id":141,"name":"JB Guanti · перчатки","emo":"🧤","lat":45.4366635,"lng":12.3359791,"addr":"San Marco 4821 (между Риальто и Campo San Luca)","price":"Кожаные перчатки, made in Italy; цены не опубликованы","mariaLabel":"JB Gaunt — Every colour and kind of glove under the sun","why":"Перчаточный магазин: кожаные перчатки всех цветов, в том числе в горошек с бантиком, как на скриншоте. 5 мин от Риальто.","time":"Часы на 1–3.11 не нашли. Телефон магазина: +39 041 522 8633.","links":["https://www.jbgloves.com/","tel:+390415228633","https://indagare.com/shop/jb-guanti"],"gq":"JB Guanti San Marco 4821 Venezia","checked":"31.10 (сайт jbgloves.com, номер дома в OSM)","days":{"1":{"s":"warn","t":"часы не нашли — смотреть Google Maps · праздник i). Вещь из вашего скриншота — бархатный мешочек с вышитыми розами, €16. Адрес неоднозначен: справочник называет San Marco 702 (Мерчерия) и San Marco 5177, а номера 4958 там нет, поэтому метка на карте — ориентир, а не гарантия. Зайдите в ближайший магазин и покажите скриншот."},{"cluster":"🐱 Хочу сюда","cats":["shop","maria"],"indoor":1,"acc":"object","status":"ok","photo":null,"pin":"OSM: «Manufactus», Calle al Ponte de la Guerra.","caveat":"Номера дома нет, точка — по OSM (shop=stationery). Сначала проверить в Google Maps, что магазин на месте.","id":143,"name":"Manufactus · блокноты","emo":"📓","lat":45.4366195,"lng":12.3400087,"addr":"Castello, Calle al Ponte de la Guerra (5 мин от площади Сан-Марко)","price":"Кожаные блокноты и ежедневники ручной работы; цены не опубликованы","mariaLabel":"Manufactus (For next time)","why":"Блокноты и ежедневники в коже ручной работы. Автор скриншота сама не успела зайти: «в следующий раз».","time":"Часы не нашли.","links":["https://www.openstreetmap.org/node/12805956605"],"gq":"Manufactus Venezia Castello","checked":"31.10 (только OSM)","days":{"1":{"s":"warn","t":"часы не нашли — смотреть Google Maps · праздник"},"2":{"s":"warn","t":"часы не нашли — смотреть Google Maps"},"3":{"s":"warn","t":"часы не нашли — смотреть Google Maps"}},"photos":[{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Calle_al_Ponte_de_la_Guerra_-_panneau_de_rue_%28janvier_2023%29.JPG/960px-Calle_al_Ponte_de_la_Guerra_-_panneau_de_rue_%28janvier_2023%29.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Calle_al_Ponte_de_la_Guerra_-_panneau_de_rue_(janvier_2023).JPG","by":"Benoît Prieur","lic":"CC0"}],"desc":"Магазин блокнотов и ежедневников в коже ручной работы — по скриншоту; его автор сама не успела зайти («в следующий раз»). Сайта, часов и записи об этом названии мы не нашли: точка поставлена по OSM (канцтовары) на Calle al Ponte de la Guerra, дома под номер  тактильные вещи ручной работы по старым методам, а не сувениры «на поток»."},{"cluster":"🐱 Хочу сюда","cats":["shop","maria"],"indoor":1,"acc":"object","status":"ok","photo":null,"pin":"OSM: «Paolo Olbi», Dorsoduro 3253, Fondamenta del Tagiapiera.","caveat":"С 2024 мастерская могла сменить вывеску (Homo Faber: «Palazzo Pisani-Revedin»). Перед походом проверить часы в Google Maps.","id":145,"name":"Paolo Olbi · переплётная мастерская","emo":"📚","lat":45.4346458,"lng":12.3258617,"addr":"Dorsoduro 3253, Calle Foscari / Fondamenta del Tagiapiera (у Ca’ Foscari)","price":"Переплёты, блокноты, печать на старых станках","mariaLabel":"Olbi Paolo (For next time)","why":"Старый венецианский переплётчик: блокноты и книги ручной работы, мраморная бумага. Рядом с San Pantalon и Santa Margherita, это по маршруту пн 2.11.","time":"Источники расходятся: Venezia Autentica — 10:30–12:40 и 15:30–19:30; OSM — ежедневно 15:30–19:30; Homo Faber (2022) — вт–вс 15:30–19:30 (то есть в пн закрыто). Надёжнее идти после 15:30. Телефон: 041 523 7655.","links":["https://veneziaautentica.com/paolo-olbi-bookbinding-venice/","https://www.homofaber.com/en/discover/paolo-olbi-bookbinding-italy","https://www.openstreetmap.org/node/9441778204","tel:+390415237655","https://veneziaautentica.com/?p=28467"],"gq":"Paolo Olbi Dorsoduro 3253 Venezia","checked":"31.10 (OSM, Venezia Autentica, Homo Faber)","days":{"1":{"s":"warn","t":"15:30–19:30? праздник — не подтверждено"},"2":{"s":"warn","t":"пн: по одним данным 10:30–12:40 и 15:30–19:30, по другим закрыто"},"3":{"s":"warn","t":"утро 10:30–12:40 — не подтверждено"}},"desc":"Мастерская Паоло Ольби в Дорсодуро — из тех, что хранят венецианскую традицию ручного переплёта. Он работает с бумагой больше 50 лет: блокноты, книги, фотоальбомы и ежедневники ручного переплёта; у него учились десятки переплётчиков. Из нового — миниатюрные обложки для книг из мраморных плиток. Для Марии это штучные старые ремёсла, которых в Берлине в таком виде нет: смотрите на переплёты и мраморную бумагу, а не на сувениры. Сначала сверьте часы: источники расходятся."},{"cluster":"🐱 Хочу сюда","indoor":1,"acc":"object","status":"ok","photo":null,"pin":"Calle del Paradiso 5746, Castello (OSM «Ai Barbacani»).","caveat":"Столики у воды — бронировать заранее. По понедельникам может быть закрыт.","id":146,"name":"Ai Barbacani · ужин у канала","emo":"🍝","cats":["food","maria"],"lat":45.437476,"lng":12.339968,"addr":"Castello 5746, Calle del Paradiso (у Santa Maria Formosa)","price":"Категория €€ (italia.it); точных цен не нашли","mariaLabel":"Ai Barbacani — Super romantic canal-side dining","why":"Ресторан со столиками прямо у канала — «ради обстановки», на свидание. Морской ризотто, сепия по-венециански. 10 мин от Риальто.","time":"italia.it: ежедневно 11:00–23:00. Cityzeum (06.2026): **по понедельникам закрыто**. Тел. 041 521 0234 — лучше позвонить и взять столик у воды.","links":["https://www.italia.it/en/veneto/venezia/where-to-eat/ristorante-ai-barbacani","https://www.cityzeum.com/ai-barbacani","tel:+390415210234","https://www.openstreetmap.org/node/2392043772","https://venicexplorer.com/the-city/navigate-venice/restaurants/ristorante-ai-barbacani"],"gq":"Ristorante Ai Barbacani Venezia","checked":"31.10 (italia.it, Cityzeum, OSM)","days":{"31":{"s":"open","t":"до 23:00 (italia.it)"},"1":{"s":"open","t":"11:00–23:00 (italia.it)"},"2":{"s":"warn","t":"пн: по одним данным закрыт"},"3":{"s":"open","t":"с 11:00"}},"desc":"Ресторан на тихой Calle del Paradiso в Кастелло: окна смотрят на небольшой канал, по которому проплывают гондолы, — по описанию, «оазис» вдали от толп у Риальто и Сан-Марко. Внутри балки и мягкий свет. В меню морепродукты: ризотто с морепродуктами, сепия по-венециански (seppie alla veneziana), спагетти с вонголе. Подходит для неспешного вечера у воды; столик у окна или у канала просите при брони, а день закрытия (по одному источнику — понедельник) уточните по телефону."},{"cluster":"🐱 Хочу сюда","indoor":1,"acc":"object","status":"o kimedia.org/wikipedia/commons/thumb/1/14/Ingresso_all%27hotel.JPG/960px-Ingresso_all%27hotel.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Ingresso_all%27hotel.JPG","by":"Sara Sodano","lic":"CC BY-SA 3.0"},{"u":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/Veduta_serale_dell%27hotel.JPG/960px-Veduta_serale_dell%27hotel.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","page":"https://commons.wikimedia.org/wiki/File:Veduta_serale_dell%27hotel.JPG","by":"Sara Sodano","lic":"CC BY-SA 3.0"}],"desc":"Рыбный ресторан внутри Baglioni Hotel Luna — отеля в старом палаццо, который называют старейшим в Венеции; по описаниям, его истоки уходят в XII век, когда здание служило пристанищем тамплиеров. Сам Santo Mare новый: открыт в 2025 году, делался вместе с Reitano Food, гость выбирает улов дня, а кухня его готовит. Пускают и тех, кто не живёт в отеле. До площади Сан-Марко пара минут пешком; у входа со стороны воды стоят красно-жёлтые швартовые столбы."},{"cluster":"🐱 Хочу сюда","indoor":1,"acc":"area","status":"ok","photo":null,"pin":"Calle Frezzaria 1701 (Indagare). Точка — середина улицы.","caveat":"Номер дома на карте не отмечен — точка стоит посередине Frezzaria, искать вывеску № 1701. Сайта нет, что открыт в 2026 — не подтверждено.","id":149,"name":"Paropamiso · старинные украшения","emo":"📿","cats":["shop","maria"],"lat":45.434,"lng":12.3357,"addr":"San Marco 1701, Calle Frezzaria (2 мин от площади Сан-Марко)","price":"Антикварные бусины и этнические украшения Азии и Африки; цен нет","mariaLabel":"found the most beautiful antique jewelry store called Paropamiso","why":"Лавка старинных украшений: стена серебряных подвесок, бусы, муранские бусины 1920–30-х.","time":"Часы не нашли. Тел. +39 041 522 7120.","links":["https://indagare.com/shop/paropamiso","tel:+390415227120","https://roderickconwaymorris.com/Articles/141.html"],"gq":"Paropamiso Frezzaria 1701 Venezia","checked":"31.10 (Indagare; на карте только улица)","days":{"1":{"s":"warn","t":"часы не нашли — смотреть Google Maps · праздник"},"2":{"s":"warn","t":"часы не нашли — смотреть Google Maps"},"3":{"s":"warn","t":"часы не нашли — смотреть Google Maps"}},"desc":"Лавка бусин за площадью Сан-Марко, на Calle Frezzaria. По статье International Herald Tribune 2002 года — «один из настоящих кладов города»: владелец Микеле Пачелло десятилетиями ездил по путям, которыми веками шли венецианские бусины в Африку, Азию и на Дальний Восток. Бусины там, по той же статье, все старинные, готовых украшений огромный выбор; в карточке — ещё стена серебряных подвесок и муранские бусины 1920–30-х. На заказ нанижут колье, браслет или серьги из любых бусин; цена в статье — от €1 за бусину (2002 год). Вывеска № 1701; открыта ли в 2026 — не подтверждено."},{"cluster":"🐱 Хочу сюда","indoor":1,"acc":"object","status":"ok","photo":null,"pin":"Strada Nova у Campo Santa Fosca (OSM «Speziera all’Ercole d’Oro», № 2234a).","caveat":"Это магазин, а не музей: зайти посмотреть интерьер можно, пока открыт.","id":150,"name":"Spezieria all’Ercole d’Oro · старая аптека","emo":"🧴","cats":["shop","maria"],"lat":45.442628,"lng":12.332209,"addr":"Cannaregio 2233, Strada Nova, Campo Santa Fosca","price":"Духи и косметика The Merchant of Venice; смотреть можно бесплатно","mariaLabel":"spezieria all’ercole d’oro","why":"Аптека XVII века с резными шкафами и майоликой, сейчас — парфюмерный магазин The Merchant of Venice. По пути от Rialto к Ca’ d’Oro и Misericordia.","time":"Часы не нашли (на сайте бренда список магазинов без часов). Тел. +39 041 720600.","links":["https://www.lonelyplanet.com/points-of-interest/la-spezieria-allercole-doro/1333802","https://www.themerchantofvenice.com/","tel:+39041720600","https://www.openstreetmap.org/node/1681386242","https://imagesofvenice.com/the-ercole-doro-pharmacy/"],"gq":"Spezieria all'Ercole d'Oro Venezia","checked":"31.10 (OSM, Lonely Planet, брошюра бренда 2019)","days":{"1":{"s":"warn","t":"часы не нашли — смотреть Google Maps · праздник"},"2":{"s":"warn","t":"часы не нашли — смотреть Google Maps"},"3":{"s":"warn","t":"часы не нашли — смотреть Google Maps"}},"desc":"Сохранившаяся венецианская аптека-spezieria XVII–XVIII веков. Сюда заходили поговорить образованные патриции, духовенство и учёные; здесь готовили необычные лекарства и снадобья, часть составов была лицензирована Республикой, а в «комнате ядов» хранили редкие травы и пряности, часто с Востока. Внутри — расписной потолок, ореховая мебель с рельефами (резьбу приписывают Francesco Pianto, ученику Брустоло), ящики с аптекарскими надписями и керамические банки из Бассано. Последняя реставрация убрала тёмный налёт и вернула тёплый тон ореха. Сегодня здесь парфюмерный магазин The Merchant of Venice."},{"cluster":"🐱 Хочу сюда","indoor":1,"acc":"object","status":"ok","photo":"https://fondazionedriesvannoten.org/media/site/2a08fa4ee8-1772651679/og.jpg","pin":"Palazzo Pisani Moretta, San Polo 2766.","caveat":"Не идти: в ноябре 2026 закрыто.","id":151,"name":"Fondazione Dries Van Noten · сейчас закрыта","emo":"👗","cats":["art","maria"],"lat":45.436037,"lng":12.329273,"addr":"San Polo 2766, Palazzo Pisani Moretta (Calle Corner)","price":"—","mariaLabel":"really recommend visiting Fondazione Dries Van Noten","why":"Фонд модельера Dries Van Noten в палаццо на Гранд-канале.","time":"**Закрыто.** Первая выставка шла 25.04–04.10.2026; сайт фонда (31.10): «presentation is now closed», новое место Studio San Polo откроется в начале 2027.","links":["https://www.fondazionedriesvannoten.org/","https://www.openstreetmap.org/way/314484756"],"gq":"Palazzo Pisani Moretta Venezia","checked":"31.10 (сайт фонда)","photoPage":"https://www.fondazionedriesvannoten.org/","days":{"31":{"s":"closed","t":"закрыто до 2027"},"1":{"s":"closed","t":"закрыто до 2027"},"2":{"s":"closed","t":"закрыто до 2027"},"3":{"s":"closed","t":"закрыто до 2027"}},"hidden":true,"hiddenWhy":"закрыто (v4, 01.11)"},{"id":300,"name":"Palazzo Pisani · концерт Консерватории","lat":45.43236,"lng":12.3305,"cats":["old","hidden"],"indoor":1,"price":"Вход €0 (до заполнения зала)","addr":"Conservatorio Benedetto Marcello, Palazzo Pisani, San Marco 2810","desc":"Консерватория Бенедетто Марчелло живёт в Palazzo Pisani — одном из самых больших частных дворцов Венеции (XVII–XVIII вв.), куда обычно не попасть. В пн 2.11 в 18:00 — бесплатный концерт-лекция «Itinerario musicale canoviano: Venezia antica e nuova»: музыка эпохи Кановы в зале дворца. Вход свободный до заполнения зала — прийти к 17:40. Это и музыка, и законный способ увидеть интерьер палаццо изнутри.","time":"Пн 2.11 18:00 · вход свободный до заполнения","days":{"2":{"s":"free","t":"18:00 концерт · прийти к 17:40"},"3":{"s":"closed","t":"концерта нет"}},"tip":"Сядьте ближе к середине зала — лекция по-итальянски, музыка без перевода.","links":["https://www.conservatoriovenezia.eu/blog/eventi/concerti/itinerario-musicale-canoviano/"],"checked":"Codex C1, проверено 01.11.2026","cluster":"Дорсодуро · верфь и набережная"},{"id":301,"name":"Altana · Splendid Venice","lat":45.43594,"lng":12.33756,"cats":["view","hidden"],"indoor":0,"price":"Только напиток, цены не опубликованы","addr":"Splendid Venice, Mercerie, San Marco 760","desc":"Настоящая венецианская альтана — деревянная терраса на крыше, на каких венецианки когда-то сушили бельё и высветляли волосы на солнце. Эта — на крыше отеля Splendid у Mercerie, между Риальто и Сан-Марко; сайт отеля прямо пишет, что она открыта и для гостей с улицы. Вечером — огни крыш, купола Сан-Марко и колокольни вокруг. Ноябрь — ветрено и прохладно: одеться теплее.","time":"Ежедневно 18:00–21:30 (сайт Starhotels); в плохую погоду могут закрыть","days":{"2":{"s":"warn","t":"18:00–21:30 · погода может закрыть"},"3":{"s":"closed","t":"с 18:00 — вы уже уедете"}},"roof":{"how":"Вход в отель с Mercerie, на ресепшене сказать «Altana» — поднимут на лифте. Брони на сайте не требуют.","hours":"18:00–21:30", "text":"Выезд до 10:00 с вещами. Спокойное утро в центре Местре (Piazza Ferretto) → **Barzi 14:10 от Mestre FS, остановка C4 → аэропорт 14:40** (запасной 15:40 → 16:10). Вылет 17:40.","ids":[3]},"1b":{"title":"По желанию · через Лидо: Николай после мессы 11:15","text":"⚠️ Бора: на воде холодно, порывы до 45–48 км/ч, и уйдёт полдня — лучше в пн (DE бесплатна до 2.11). RePulse рано (открывается ≈07:00) → ~09:15 трамвай T1 от Mestre Centro (в праздник ≈ каждые 15 мин) → Piazzale Roma, причал D → бесплатная DE 09:49 → San Michele → Cimitero, причал A **10:40** → Lido S.M.E. → ~30 мин пешком → San Nicolò: месса 11:15, **поклониться ≈12:15** → обратно DE с Lido S.M.E. **14:10** (или платный вапоретто) → San Pietro di Castello → бесплатные Palazzo Grimani (до 18:00) / Museo Archeologico (вход до 16:00) — под крышей, если дождь → Murano illumina (последний день) → **16:00 концерт San Salvador** → Риальто, ужин.","ids":[2,5,9,60,61,64,63,43,38,130,32,26,23,27]},"2b":{"title":"По желанию · день на воде: San Michele + Лидо (по пути — св. Николай)","text":"Бесплатные лодки DE в последний день. Piazzale Roma, причал D → San Michele (тихая прогулка) → причал A → San Pietro di Castello → Лидо. **По пути, если захочется:** ~25 мин пешком к San Nicolò (окно 15:00–16:30, лучше сначала позвонить). Обратно DE с Lido S.M.E. 16:10 или платный вапоретто ~€9,50/чел. Вечер: Via Garibaldi, Misericordia, джелато.","ids":[9,60,61,64,63,43,44,45,46,39,37,42,16,108,110]},"1_prev":{"text":"**Праздник, днём возможны ливни.** Утро — барахолка RePulse в Местре → трамвай T1 от Mestre Centro → Piazzale Roma. Дорсодуро: Santa Margherita (пицца Al Volo или паста в Bakarò — от друга), Ponte dei Pugni, верфь San Trovaso, бесплатная Accademia (если дождь) → Corner Pub (бар от друга, спритц ≈€3) → Zattere → Punta della Dogana → traghetto Dogana → Сан-Марко: Murano illumina (последний день), Bovolo → 16:00 концерт в San Salvador (в 2–5 мин — 🐱 Gondolina, JB Guanti, Fabris, если открыты в праздник; 🐱 Sempione — столики над водой, открыт до 23:00) → Риальто вечером, ужин Do Spade.","ids":[2,5,48,49,50,51,54,55,57,35,31,32,30,26,23,27,106,105],"title":"Барахолка + Дорсодуро + Сан-Марко"}};
const PLAN = {"1":{"title":"План на вс 1.11","start":1,"intro":"**Погода (сверено 1.11 в 09:35):** днём дождя не ждут (0–3% по часам; региональный прогноз допускал местами слабый). Солнце около 12:00 и 16–17, в остальное время переменная облачность. Бора, северо-восточный ветер 16–23 км/ч, порывы до 47 км/ч в 14:00: при +13…+14° ощущается +8…+10° — **шапки и шарфы**. Закат 16:58. На Zattere солнце и затишье, на мысу Dogana и на воде дует.\n**Только сегодня:** бесплатные Accademia и Palazzo Grimani, последний день Murano illumina, бесплатный концерт в 16:00.","steps":[{"t":"07:15","what":"Подъём, завтрак дома","ids":[],"dur":"","price":"","tip":"Взять воду (в городе питьевые фонтанчики бесплатно) и обе банковские карты — в транспорте каждый платит своей.","links":[]},{"t":"08:10","what":"Выход → пешком к барахолке","ids":[],"dur":"20 мин, 1,6 км","price":"","tip":"","links":[]},{"t":"08:30","what":"RePulse — барахолка, раз в месяц","ids":[2],"dur":"35 мин","price":"вход бесплатно","tip":"Дата 1.11 есть в календаре города; часы — по прошлому году (07:00–20:00). Скучно — сразу на трамвай.","links":[]},{"t":"09:10","what":"Трамвай T1 → Piazzale Roma","ids":[5],"dur":"≈20 мин","price":"€1,50 с человека","tip":"Ходит примерно каждые 15 мин. Карту приложить **на входе и на выходе** из трамвая — каждый своей; при проверке показать ту же карту.","links":[["🚋 T1 в Google Maps","https://www.google.com/maps/dir/?api=1&travelmode=transit&origin=45.4934714,12.2460979&destination=45.43794,12.31877"]],"to":9},{"t":"09:40","what":"Scuola Grande di San Rocco — залы Тинторетто","ids":[11],"dur":"45 мин","price":"€12 с человека","tip":"Главная платная вещь дня. Потолок удобно смотреть в зеркала, которые дают в зале.","links":[["Сайт","https://www.scuolagrandesanrocco.org/"]]},{"t":"10:30","what":"Campo Santa Margherita → Ponte dei Pugni → верфь гондол San Trovaso","ids":[48,50,51],"dur":"по пути, 25 мин","price":"бесплатно","tip":"Верфь видно с набережной напротив, внутрь не пускают. От верфи до Accademia 5 мин.","links":[]},{"t":"11:00","what":"Gallerie dell’Accademia — бесплатно только сегодня","ids":[54],"dur":"1,5 ч","price":"бесплатно","tip":"**Перенесли с вечера на утро** (перепроверка Codex): сколько длится концерт, не опубликовано, а касса закрывается в 18:00, и уже в 18:30 начинают выводить. Утром без риска. Бесплатный день — возможна очередь. Главное: Джорджоне, Тициан, цикл святой Урсулы Карпаччо. Уже прошли мимо — тогда после концерта, но встать в очередь до 17:30.","links":[]},{"t":"12:35","what":"Zattere на солнце + Corner Pub (советовал друг) — обед","ids":[55,106],"dur":"45 мин","price":"спритц ≈€3, сэндвич ≈€4,5","tip":"Солнце около полудня и затишье от ветра — лучшее место для перерыва.","links":[]},{"t":"13:20","what":"Базилика Salute (снаружи) → мыс Punta della Dogana","ids":[56,57],"dur":"25 мин","price":"бесплатно","tip":"На мысу сильный ветер, к 14:00 порывы до 47 км/ч: 5 минут на фото — и дальше.","links":[]},{"t":"13:45","what":"Гондола-traghetto через Гранд-канал","ids":[35],"dur":"5 мин","price":"€2 с человека","tip":"Ходит 09:00–18:00. Настоящая гондола за €2 — так ездят местные.","links":[]},{"t":"13:55","what":"Murano illumina il mondo — последний день","ids":[32],"dur":"15 мин","price":"бесплатно","tip":"Под аркадами Procuratie Vecchie на площади Сан-Марко: 12 люстр от разных художников. Во сколько сегодня разбирают, не опубликовано — смотреть днём.","links":[]},{"t":"14:15","what":"Palazzo Grimani — бесплатно только сегодня","ids":[143,38],"dur":"1 ч","price":"бесплатно","tip":"По пути 🐱 Manufactus, если открыт. Внутри — зал с античными статуями (Трибуна), расписанные комнаты и **выставка Amoako Boafo** (до 22.11). Вход до 18:00, туалет бесплатный.","links":[]},{"t":"15:20","what":"Перекус в Farini San Lio (советовал друг) — по пути","ids":[108],"dur":"15 мин","price":"кусок пиццы ≈€4–5","tip":"По воскресеньям открыто 07:30–22:00 (сайт Farini). Отсюда до San Salvador 5 мин.","links":[]},{"t":"15:40","what":"San Salvador — прийти заранее и сесть","ids":[26],"dur":"","price":"","tip":"","links":[]},{"t":"16:00","what":"Бесплатный концерт хора и органа","ids":[],"dur":"≈1 ч","price":"бесплатно","tip":"Сколько длится, не опубликовано. Accademia уже позади — можно дослушать спокойно.","links":[]},{"t":"17:00","what":"🐱 Gondolina · JB Guanti · Fabris — рядом с концертом","ids":[140,141,142,30],"dur":"по 10 мин","price":"","tip":"Работают ли в праздник, неизвестно. Закрыто — идём дальше. Gondolina — 2 мин, Campo San Bartolomeo. Bovolo: последний вход 17:00, подъём €9 (льготный €7 — до 26 лет и 65+) — скорее всего уже не успеть.","links":[]},{"t":"18:00","what":"Мост Риальто вечером","ids":[23],"dur":"15 мин","price":"бесплатно","tip":"До ужина свободный час. Можно дойти до моста Академии (≈20 мин) — Гранд-канал вечером; оттуда до Do Spade ≈25 мин.","links":[]},{"t":"19:15","what":"Ужин — Cantina Do Spade","ids":[27],"dur":"","price":"≈€41–45 на двоих","tip":"**Позвонить и забронировать**, если ещё нет. Мест нет — 🐱 Sempione, столики над водой (до 23:00).","links":[["📞 Do Spade +39 041 521 0583","tel:+390415210583"],["📞 Sempione +39 041 522 6022","tel:+390415226022"]]},{"t":"21:00","what":"Домой: пешком до Piazzale Roma → T1 → Местре","ids":[9],"dur":"≈50 мин","price":"€1,50 с человека","tip":"Карту приложить **на входе и на выходе** из трамвая — каждый своей; при проверке показать ту же карту.","links":[["🚋 Домой в Google Maps","https://www.google.com/maps/dir/?api=1&travelmode=transit&origin=45.43794,12.31877&destination=45.4941373,12.2618901"]]}],"outro":"💶 **≈€105 на двоих** (без San Rocco ≈€80) · 🚶 **≈13 км** вместе с Местре.\nЛидо, кладбище San Michele и св. Николай — **в понедельник**: бесплатная лодка DE ходит до 2.11, и будет на 2° теплее.","tpl":"1","late":"**Опаздываете — что держать:** Accademia — **до 12:30** (иначе после концерта: в очередь до 17:30, касса до 18:00) → Palazzo Grimani — **до 15:20** (вход до 18:00) → концерт San Salvador **16:00**, прийти к 15:40. Выкидывать первыми: Santa Margherita, мыс Dogana, Bovolo, магазины 🐱."},"2":{"title":"План на пн 2.11","start":1,"intro":"**Погода (снимок 1.11):** сухо весь день, утром +12° (ощущается +9°), днём до +15°, ветер слабый. Закат **16:57**, синий час 17:05–17:29.\n**Только сегодня:** бесплатные лодки DE до кладбища (последний день), месса Патриарха 10:00, бесплатный концерт в Palazzo Pisani в 18:00.\n**Крыши сегодня:** башня с часами (14:00, бронь), Bovolo на закате, альтана Splendid вечером. Запасные — Skyline на Джудекке (бронь, €18–24), Loggione, Terrazza Danieli — на карте в «🏙 Крыши и виды».","outro":"💶 **≈€190 на двоих** (транспорт €6, башня €30, Bovolo €18, альтана ≈€30, обед ≈€10, ужин ≈€70–80) · без башни и альтаны ≈€130.\nЗавтра (вт 3.11): выезд из квартиры до 10:00, автобус Barzi от Mestre FS в 14:10 — план на вторник отдельно.","steps":[{"t":"07:30","what":"Подъём, завтрак дома","ids":[],"dur":"","price":"","tip":"Тёплое: утром +12°, ощущается +9°. Обе банковские карты — в транспорте каждый платит своей.","links":[]},{"t":"08:30","what":"Пешком к трамваю T1","ids":[5],"dur":"≈17 мин","price":"","tip":"","links":[]},{"t":"08:50","what":"Трамвай T1 → Piazzale Roma","ids":[5],"dur":"≈20 мин","price":"€1,50 с человека","tip":"Карту приложить **на входе и на выходе** — каждый своей.","links":[["🚋 T1 в Google Maps","https://www.google.com/maps/dir/?api=1&travelmode=transit&origin=45.4934714,12.2460979&destination=45.43794,12.31877"]],"to":9},{"t":"09:29","what":"🛶 Бесплатная лодка DE → кладбище San Michele (последний день)","ids":[9],"dur":"≈25 мин","price":"бесплатно","tip":"Причал **D**, рейсы :09, :29, :49. Плывёт мимо Ferrovia и Guglie, под мостом **Tre Archi** — снять его с воды. Успели на 09:09 — тем лучше.","links":[],"to":60},{"t":"10:00","what":"San Michele: месса Патриарха и могилы","ids":[60],"dur":"≈1 ч 15 мин","price":"бесплатно","tip":"Месса — по желанию, можно постоять сзади. Могилы — на некатолических участках: **XV Evangelico** — Бродский и Паунд, **XIV Greco** — Стравинский и Дягилев. Схема Veritas у входа. Тихо, без постановочных фото — сегодня день поминовения.","links":[]},{"t":"11:15","what":"🛶 DE с кладбища → Fondamente Nove","ids":[60],"dur":"5 мин","price":"бесплатно","tip":"Причал **B**, рейсы :15, :35, :55.\n**Ветка «св. Николай»:** вместо этого — DE с причала **A** в 11:40 на Лидо (бесплатно), от Lido S.M.E. до San Nicolò ≈30 мин пешком. Внутрь церкви, по сайту Лидо, пускают только на службе — 2.11 служба не подтверждена. Обратно DE 14:10 Лидо → кладбище → Fondamente Nove, всё бесплатно; к 15:00 вы в городе — дальше с шага 15:05.","links":[],"to":62},{"t":"11:25","what":"Campo Santi Giovanni e Paolo · кофе у Rosa Salva","ids":[42],"dur":"25 мин","price":"кофе у стойки ≈€1,5","tip":"Старая семейная кондитерская на площади. Рядом мраморный фасад Scuola Grande di San Marco — сейчас вход в городскую больницу.","links":[]},{"t":"11:55","what":"Palazzo Soranzo Van Axel → Santa Maria dei Miracoli","ids":[19,20],"dur":"40 мин","price":"бесплатно","tip":"Готический дворец, куда обычно не пускают (скрин Марии): двор, лестница, залы — смотреть сам дворец. Потом мраморная «шкатулка» Miracoli снаружи и старые книги в Libreria Miracoli.","links":[]},{"t":"12:40","what":"Обед: пицца у Farini San Lio (советовал друг)","ids":[108],"dur":"25 мин","price":"кусок ≈€4–5","tip":"","links":[]},{"t":"13:10","what":"🐱 Gondolina · JB Guanti · Fabris (если вчера были закрыты) + Attombri","ids":[140,141,142,311],"dur":"по 10 мин","price":"","tip":"Все у Риальто, 2–5 мин друг от друга. Attombri — старинный венецианский бисер в проволоке, под аркадами у моста. Часы не нашли — закрыто, идём дальше.","links":[]},{"t":"14:00","what":"🏙 Torre dell’Orologio — внутри часов и наверх к «маврам»","ids":[304],"dur":"≈1 ч","price":"€15 (льготный €11)","tip":"**Только по брони** на сайте MUVE — тур по-английски 14:00 (или 11:00). Сбор у кассы Museo Correr за 5 мин. Билет пускает и в Correr.","links":[]},{"t":"15:05","what":"💍 Украшения для Марии: старинные и венецианские","ids":[313,149,316,315,310,312],"dur":"≈1 ч 20 мин","price":"","tip":"Круг: **Nardi** (броши «моретто», смотреть) → **Paropamiso** (старинные, её скрин) → **Codognato** и **Eleuteri** (её скрины, дорого, часы не подтверждены) → через мост Академии к **Marisa Convento** — венецианский бисер, открыто до 17:30, во вт закрыто → обратно к **Cipolato** у Bovolo.\nНе брать «муранское» без мастера и марки — 🧭 Хитрости.","links":[]},{"t":"16:25","what":"🏙 Scala Contarini del Bovolo — закат с лоджии","ids":[30],"dur":"30 мин","price":"€9 (льготный €7)","tip":"Закат **16:57**. Последний вход, вероятно, 17:00 — прийти к 16:25. Вид не «над городом», а внутрь крыш: трубы, альтаны, купола.","links":[]},{"t":"17:05","what":"📸 Синий час на мосту Академии","ids":[53],"dur":"20 мин","price":"бесплатно","tip":"Синий час 17:05–17:29: Гранд-канал и купол Salute в огнях. Отсюда 5 мин до консерватории.","links":[]},{"t":"17:35","what":"🎻 Palazzo Pisani — бесплатный концерт Консерватории в 18:00","ids":[300],"dur":"≈1–1,5 ч","price":"бесплатно","tip":"Вход до заполнения зала — прийти к 17:40. Заодно — интерьер дворца, куда иначе не попасть.","links":[]},{"t":"19:15","what":"🏙 Альтана Splendid — крыша с огнями","ids":[301],"dur":"45 мин","price":"напиток, цены не опубликованы","tip":"Вход с Mercerie, на ресепшене сказать «Altana». Открыта 18:00–21:30, для гостей с улицы тоже. Спросить цену до заказа. Ветрено — одеться.","links":[]},{"t":"20:15","what":"🐱 Ужин — Santo Mare, спагетти с вонголе","ids":[148],"dur":"","price":"≈€60–80 на двоих","tip":"Кухня 19:00–22:15. Нет мест — 🐱 Sempione, столики над водой (до 23:00).","links":[]},{"t":"21:45","what":"Домой: пешком до Piazzale Roma → T1 → Местре","ids":[9],"dur":"≈55 мин","price":"€1,50 с человека","tip":"Карту приложить **на входе и на выходе** — каждый своей.","links":[["🚋 Домой в Google Maps","https://www.google.com/maps/dir/?api=1&travelmode=transit&origin=45.43794,12.31877&destination=45.4941373,12.2618901"]] function routeKey(){return PLAN[day]&&ROUTE[day]?day:null}

  const st=g.k==='walk'?{color:past?'#9aa3ad':next?'#1e88e5':'#1f3a5f',weight:next?6:4,opacity:past?.55:.85}:{color:past?'#9aa3ad':g.k==='tram'?'#7b1fa2':'#0288d1',weight:4,opacity:.85,dashArray:g.k==='tram'?'10 8':'3 8'};

 let n=0;PLAN[k].steps.forEach((s,i)=>{const ps=(s.ids||[]).map(id=>PLACES.find(p=>p.id===id)).filter(Boolean);if(!ps.length)return;n++;
  const st=live&&i<cur?'past':live&&i===cur?'now':live&&i===cur+1?'next':'';

const TRICKS = {"intro":"Только проверенное: у каждого пункта — источник и дата. Транспорт — правда о контроле и законная экономия.","sections":[{"h":"🚌 Транспорт: правда и законная экономия","items":[{"t":"**Пн 2.11 — весь день за €3 с человека:** T1 или автобус Местре → Piazzale Roma €1,50, бесплатный DE на кладбище и обратно, дальше пешком, домой снова €1,50. Обычный вапоретто — €9,50 на 75 мин, сутки — €25.","src":"https://actv.avmspa.it/it/content/urbano-venezia-0","date":"проверено 01.11.2026"},{"t":"**Касание картой:** при каждой посадке и пересадке. В трамвае и автобусе — ещё и на выходе; на вапоретто выход не нужен. Весь день — одним и тем же устройством: пластиковая карта и она же в телефоне — разные «карты», дневной потолок €25 не сложится.","src":"https://actv.avmspa.it/en/content/emv-conditions-use-manual","date":"официальные правила, проверено 01.11.2026"},{"t":"**Одной картой — до 5 человек:** отдельное касание за каждого на одном валидаторе в течение 60 с, и ехать вместе. Проверяют то устройство, которым касались.","src":"https://actv.avmspa.it/en/content/emv-conditions-use-manual","date":"проверено 01.11.2026"},{"t":"**Как реально проверяют:** частоту проверок ACTV не публикует. Свежие рассказы — контролёр на борту ближе к концу рейса (r/Venezia, 07.06.2026) или минут через 20 (комментарий 19.09). Открывшийся турникет и скриншот оплаты — не доказательство: показывают карту.","src":"https://www.reddit.com/r/Venezia/comments/1tz7mj3/paid_for_my_vaporetto_ticket_gate_opened_still/","date":"2026-06-07"},{"t":"**Штраф ACTV по официальному калькулятору:** оплата в 5 дней — €50 + €5 сбор + сам билет (на воде ≈€64,50); с 6-го по 60-й день — €100 + €15 + билет; позже — до €300 + €15 + билет.","src":"https://actv.avmspa.it/it/content/calcolo-delle-sanzioni-0","date":"проверено 01.11.2026"},{"t":"**Venezia Daily Pass €25** включает региональные поезда Местре ↔ Santa Lucia; дневной потолок €25 при оплате картой — поезда не включает.","src":"https://www.veneziaunica.it/en/buy-tickets/public-trasport-in-venice","date":"проверено 01.11.2026"},{"t":"**Гондола за €2:** traghetto через Гранд-канал — €2 с человека, это переправа, не прогулка. Обычная гондола по муниципальному тарифу — €90 за 30 мин днём и €110 за 35 мин вечером, за всю лодку.","src":"https://www.comune.venezia.it/it/node/16768","date":"проверено 01.11.2026"},{"t":"**Поезд во вторник:** места на региональных не бронируют. Электронный билет включается сам ко времени поезда, бумажный — прокомпостировать до посадки. Без билета — проезд + €30 штрафа при оплате сразу.","src":"https://www.trenitalia.com/it/regionale/viaggiare-con-il-regionale.html","date":"проверено 01.11.2026"},{"t":"**С 3.11 работы на станции Mestre:** отдельные региональные поезда могут сдвинуться или отмениться — утром сверить свой поезд и платформу в приложении Trenitalia. Забастовок на 3.11 не объявлено.","src":"https://scioperiitalia.it/giorni-sicuri","date":"календарь на 01.11.2026"}]},{"h":"🍷 Еда и счёт: как не переплатить","items":[{"t":"**До заказа:** сравнить цену у стойки и за столиком, спросить про coperto и servizio, сколько стоит «блюдо шефа» и рыба за 100 г. Coperto законен, если указан в меню.","src":"https://www.ilpiccolo.it/nordest/venezia-ristoranti-prezzi-come-difendersi-trucchi-turisti-ftu6ib1m","date":"2026-10-18"},{"t":"**«Приветственный бокал»** в октябре 2026 пресса описывала в счетах: если принесли то, что не заказывали, — спросить, платное ли, до того как пить.","src":"https://www.ilpiccolo.it/nordest/venezia-ristoranti-prezzi-come-difendersi-trucchi-turisti-ftu6ib1m","date":"2026-10-18"},{"t":"**Как местные:** ombra (бокал вина) и cicchetti у стойки бакаро — стоя, это дешевле, чем за столом.","src":"https://www.cantinaschiavi.com/it/contatti.html","date":"проверено 01.11.2026"}]},{"h":"💍 Украшения и стекло: ловушки","items":[{"t":"**«Муранское» из Китая:** по оценке консорциума Promovetro, около 70% стекла, которое продают как муранское, — подделка.","src":"https://www.thelocal.it/20200911/in-photos-italian-lassmakers-warn-against-counterfeits-as-they-mark-venice-glass-week/","date":"2020-09-11"},{"t":"**Марка Vetro Artistico Murano** (регион Венето, с 1994): наклейка с кодом производителя и сертификат. Нет наклейки — не обязательно подделка: спросить, чья мастерская и откуда стекло. Наклейки тоже подделывают.","src":"https://www.regione.veneto.it/web/attivita-produttive/dalla-a-alla-z-dettaglio?articleId=108741","date":"официальное правило, проверено 01.11.2026"},{"t":"**Признаки подделки:** слишком дёшево, идеально одинаковые бусины, «Made in China» на внутренней упаковке. Честный продавец сам покажет, где муранское, а где нет.","src":"https://www.yourmurano.com/en/is-there-fake-murano-glass-in-venice","date":"2025"},{"t":"**«Бесплатное такси» на Мурано** от гида или отеля везёт в шоурум фабрики с давлением купить. Ехать вапоретто.","src":"https://en.wikivoyage.org/wiki/Venice/Murano","date":"прочитано 01.11.2026"},{"t":"**Брать у мастеров с именем:** Marisa Convento (бисер, пн до 17:30), Attombri, Giorgio Nason — на карте в «🕰 Старое и винтаж».","src":"https://www.homofaber.com/en/artisans/marisa-convento-jewellery-making-italy","date":"проверено 01.11.2026"}]},{"h":"🏙 Крыши: что не работает в ноябре","items":[{"t":"**Колокольня San Giorgio Maggiore закрыта** на работы (базилика открыта) — старым путеводителям про лифт не верить.","src":"https://www.abbaziasangiorgio.it/visite-guidate/","date":"проверено 01.11.2026"},{"t":"**Крыша Ca’ Sagredo** — только май–октябрь.","src":"https://www.casagredohotel.com/dining-at-lalcova/rooftop-terrace/","date":"проверено 01.11.2026"},{"t":"**Терраса Fondaco dei Tedeschi** обычно закрыта: мэрия открывала её разово 26.10.2026, на 2–3.11 открытий нет.","src":"https://live.comune.venezia.it/it/2026/10/apertura-straordinaria-al-pubblico-del-fondaco-dei-tedeschi","date":"2026-10-21"},{"t":"**Что работает:** башня с часами (тур с брони), Bovolo до заката, альтана Splendid с 18:00, Skyline на Джудекке (бронь), Terrazza Danieli (ресторан, бронь).","src":"Codex C1, проверено 01.11.2026","date":"01.11.2026"}]}]};
// tricks tab: verified local tips, transport truth, traps; the old to-do list stays at the bottom
function todo(){const T=TRICKS||{};sheet(`<h2>🧭 Хитрости</h2>${T.intro?`<div class="sub">${md(T.intro)}</div>`:''}${(T.sections||[]).map(s=>`<div class="trk"><h3>${esc(s.h)}</h3>${s.items.map(it=>`<div class="tri">${md(it.t)}${it.src?` <a class="trs" href="${esc(it.src)}" target="_blank" rel="noopener">источник${it.date?' · '+esc(it.date):''}</a>`:''}</div>`).join('')}</div>`).join('')}<h3 style="margin-top:14px">📋 Забронировать и сделать</h3><div class="sub">Галочки сохраняются в телефоне.</div>${TODO.map((t,k)=>`<div class="task"><label><input type="checkbox" ${done.has(t.key)?'checked':''} onchange="tick('${t.key}',this.checked)"><span><b>${md(t.what)}</b>${t.when?` · <small>${md(t.when)}</small>`:''}<br><small>${md(t.how)}</small>${(t.links||[]).map(l=>`<br><a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</span></label></div>`).join('')}`)}
function tick(k,v){v?done.add(k):done.delete(k);LS.set('done',[...done])}
function wxHours(d){if(!wx||!wx.hourly)return [];const iso={'31':'2026-10-31','1':'2026-11-01','2':'2026-11-02','3':'2026-11-03'}[d];return wx.hourly.time.map((t,i)=>({t,i})).filter(x=>x.t.startsWith(iso)&&+x.t.slice(11,13)>=8&&+x.t.slice(11,13)<=21).map(x=>({h:x.t.slice(11,13),c:Math.round(wx.hourly.temperature_2m[x.i]),f:Math.round(wx.hourly.apparent_temperature[x.i]),p:wx.hourly.precipitation_probability[x.i],mm:wx.hourly.precipitation[x.i],w:Math.round(wx.hourly.wind_speed_10m[x.i]),k:wx.hourly.weather_code[x.i]}))}
const WI=c=>c<=1?'☀️':c<=3?'⛅':c<=48?'🌫':c<=67?'🌧':c<=77?'🌨':c<=82?'🌦':'⛈';
// rain chance and icon from daytime hours only (08–21; for today — from now on): the daily max counts night rain and scared us with 83% on a dry Sunday
function dayRain(d,x){const h=wxHours(d),n=romeNow();let hh=n.key===d?h.filter(y=>+y.h>=Math.floor(n.min/60)):h;if(!hh.length)hh=n.key===d?h.slice(-1):h;if(!hh.length)return {p:x.p,k:x.k};return {p:Math.max(...hh.map(y=>y.p)),k:Math.max(...hh.map(y=>y.k))}}
function wxDay(d){if(!wx||!wx.daily)return null;const iso={'31':'2026-10-31','1':'2026-11-01','2':'2026-11-02','3':'2026-11-03'}[d],i=wx.daily.time.indexOf(iso);if(i<0)return null;return {max:Math.round(wx.daily.temperature_2m_max[i]),min:Math.round(wx.daily.temperature_2m_min[i]),p:wx.daily.precipitation_probability_max[i],k:wx.daily.weather_code[i],ss:wx.daily.sunset[i].slice(11),sr:wx.daily.sunrise[i].slice(11)}}
function weather(){sheet(`<h2>🌦 Погода в Венеции</h2><div class="sub">Open-Meteo, обновлено ${esc(wx&&wx._at||'—')}. Ветер у воды ощущается холоднее.</div>${DAYS.map(([d,n])=>{const x=wxDay(d);if(!x)return '';const r=dayRain(d,x);return `<div class="blk"><b>${n}</b> ${WI(r.k)} ${x.min}…${x.max}° · днём дождь до ${r.p}% · закат ${x.ss}<div class="hours">${wxHours(d).map(h=>`<div class="h ${h.p>=50?'rain':''}">${h.h}:00<br>${WI(h.k)}<br>${h.c}°<br>${h.p}%</div>`).join('')}</div></div>`}).join('')}<div class="btns"><a class="btn alt" href="https://www.comune.venezia.it/it/content/centro-previsioni-e-segnalazioni-maree" target="_blank" rel="noopener">🌊 Прилив (acqua alta)</a></div>`)}
function topWx(){const x=wxDay(day),r=x?dayRain(day,x):null;$('#wx').textContent=x?`${WI(r.k)}${x.max}° ☔${r.p}%`:'погода…';
 const b=$('#banner');if(x&&r.p>=50){b.style.display='block';b.innerHTML=`☔ ${DAYS.find(d=>d[0]===day)[1]}: днём возможен дождь (до ${r.p}%). <a href="#" onclick="filt=new Set(['indoor']);chips();draw();return false">Показать места под крышей</a>`}else b.style.display='none'}
async function loadWx(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.437&longitude=12.334&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=Europe%2FRome&start_date=2026-10-31&end_date=2026-11-03');if(r.ok){wx=await r.json();wx._at=new Date().toLocaleString('ru-RU',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});LS.set('wx',wx)}}catch(e){wx=LS.get('wx',WX0)}topWx()}
function daysBar(){$('#days').innerHTML=DAYS.map(([d,n])=>`<button class="day ${d===day?'on':''}" onclick="day='${d}';daysBar();topWx();chips();draw();if(sel)openPlace(sel)">${n}</button>`).join('')}
const CHIPS=[['view','🏙 Крыши и виды'],['shot','📸 Ракурсы'],['old','🕰 Старое и винтаж'],['hidden','🗝 Тайное'],['local','🧭 Как местные'],['maria','🐱 Хочу сюда'],['friend','💬 От друга'],['open','✅ Открыто'],['indoor','🏠 Под крышей'],['free0','€0'],['fav','⭐ Мой день'],['food'],['art'],['photo'],['water'],['market'],['shop'],['nature'],['walk'],['saint'],['grocery'],['transport'],['visited','✓ Были'],['logistics','🚌 Логистика']];
function chips(){$('#chips').innerHTML=(routeKey()?`<button class="chip route ${routeOn?'on':''}" onclick="toggleRoute()">🗺 Маршрут дня</button>`:'')+CHIPS.filter(c=>LAYERS.includes(c[0])?PLACES.some(p=>!p.hidden&&p.layer===c[0]):['open','indoor','free0','fav'].includes(c[0])||PLACES.some(p=>!p.hidden&&!p.layer&&p.cats.includes(c[0]))).map(([k,l])=>`<button class="chip ${filt.has(k)?'on':''} ${k==='friend'||k==='maria'?k:''} ${LAYERS.includes(k)?'lay':''}" onclick="filt.has('${k}')?filt.delete('${k}'):filt.add('${k}');chips();draw()">${l||CATS[k][0]+' '+CATS[k][1]}</button>`).join('')}
[['#bPlan',planView],['#bNear',near],['#bDay',myDay],['#bEv',events],['#bTodo',todo],['#bWx',weather]].forEach(([s,f])=>$(s).onclick=()=>{backTo=null;f()});
if(WX0&&!WX0._at)WX0._at='снимок '+BUILT;
// route sent by the Telegram assistant: index.html#r=12,45,7&from=lat,lng (the part after # never reaches the server)
let botRoute=null;const botLayer=L.layerGroup().addTo(map);
function parseHash(){const q=new URLSearchParams(location.hash.slice(1));const r=(q.get('r')||'').split(',').map(Number).filter(n=>PLACES.some(p=>p.id===n));if(!r.length)return null;const f=(q.get('from')||'').split(',').map(Number);return {ids:r,from:f.length===2&&f.every(x=>isFinite(x)&&x!==0)?{lat:f[0],lng:f[1]}:null}}
async function drawBot(){botLayer.clearLayers();const bb=$('#botbar');if(!botRoute){bb.style.display='none';return}
 const ps=botRoute.ids.map(i=>PLACES.find(p=>p.id===i)),pts=(botRoute.from?[botRoute.from]:[]).concat(ps);
 bb.style.display='block';bb.innerHTML=`🤖 Маршрут от Claude · ${ps.length} точ. · <a href="#" onclick="botList();return false">список</a> · <a href="#" onclick="clearBot();return false">✕ убрать</a>`;
 const line=L.polyline(pts.map(p=>[p.lat,p.lng]),{color:'#6a1b9a',weight:4,opacity:.8,dashArray:'6 6'}).addTo(botLayer);
 ps.forEach((p,i)=>L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:`<div class="rn bot" style="width:30px;height:30px">${i+1}</div>`}),zIndexOffset:5000}).on('click',()=>openPlace(p.id)).addTo(botLayer).bindTooltip(esc(p.name.split(' · ')[0]),{permanent:true,direction:'right',offset:[15,0],className:'rlbl'}));
 if(map.setBearing)map.setBearing(0);map.fitBounds(pts.map(p=>[p.lat,p.lng]),{paddingTopLeft:[20,150],paddingBottomRight:[60,80],maxZoom:17});
 try{const c=pts.map(p=>p.lng.toFixed(6)+','+p.lat.toFixed(6)).join(';');const r=await fetch('https://routing.openstreetmap.de/routed-foot/route/v1/driving/'+c+'?overview=full&geometries=geojson');const j=await r.json();if(j.code==='Ok'&&botRoute){line.setLatLngs(j.routes[0].geometry.coordinates.map(x=>[x[1],x[0]]));line.setStyle({dashArray:null})}}catch(e){}}
function botList(){if(!botRoute)return;const ps=botRoute.ids.map(i=>PLACES.find(p=>p.id===i));sheet(`<h2>🤖 Маршрут от Claude</h2>${listHtml(ps,botRoute.from)}`)}
function clearBot(){botRoute=null;history.replaceState(null,'',location.pathname+location.search);drawBot();chips();draw()}
window.addEventListener('hashchange',()=>{botRoute=parseHash();chips();draw();drawBot()});
botRoute=parseHash();
daysBar();chips();draw();topWx();loadWx();if(botRoute)drawBot();else if(routeActive())fitRoute();
// live dot starts by itself when location was already allowed; GPS pauses while the page is hidden (battery)
try{navigator.permissions.query({name:'geolocation'}).then(r=>{if(r.state==='granted')startWatch(false)},()=>{})}catch(e){}
let resumeWatch=false;
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;resumeWatch=true}}else if(resumeWatch){resumeWatch=false;startWatch(false)}});
</script>
