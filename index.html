<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#fff;--fg:#1b1f24;--mut:#6a7380;--line:#e3e6ea;--acc:#1f3a5f;--ok:#2e7d32;--warn:#b26a00;--bad:#c62828;--free:#1565c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}
#map{position:fixed;inset:0;z-index:1}
#top{position:fixed;left:0;right:0;top:0;z-index:500;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:linear-gradient(#fffffff2,#ffffffd9);box-shadow:0 1px 6px #0002}
#row1{display:flex;gap:6px;align-items:center}
#days{display:flex;gap:4px;flex:1;overflow-x:auto}
.day{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 9px;font-size:13px;white-space:nowrap}
.day.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#wx{font-size:12.5px;color:var(--fg);padding:5px 8px;border-radius:14px;background:#eef3f8;white-space:nowrap}
#chips{display:flex;gap:5px;overflow-x:auto;margin-top:6px;padding-bottom:2px;scrollbar-width:none}
#chips::-webkit-scrollbar,#days::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 10px;font-size:13px;white-space:nowrap}
.chip.on{background:#ffe9b3;border-color:#e0b44c}
#banner{display:none;margin-top:6px;font-size:13px;background:#fff4e0;border:1px solid #f0c27a;border-radius:10px;padding:6px 8px}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:500;display:flex;gap:6px;justify-content:space-around;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:#fffffff2;box-shadow:0 -1px 6px #0002}
#dock button{flex:1;border:0;background:#f1f4f7;border-radius:12px;padding:8px 2px;font-size:12.5px;color:var(--fg)}
#dock button b{display:block;font-size:18px;font-weight:400}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:700;max-height:78dvh;overflow-y:auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 18px #0003;transform:translateY(105%);transition:transform .22s;padding:6px 14px calc(env(safe-area-inset-bottom) + 14px);-webkit-overflow-scrolling:touch}
#sheet.open{transform:none}
#grab{width:40px;height:5px;border-radius:3px;background:#ccd;margin:4px auto 8px}
#x{position:sticky;top:0;float:right;border:0;background:#eef1f4;border-radius:50%;width:32px;height:32px;font-size:17px}
h2{font-size:19px;margin:2px 40px 2px 0}
.sub{color:var(--mut);font-size:13px;margin-bottom:6px}
.badge{display:inline-block;font-size:12.5px;border-radius:8px;padding:2px 7px;margin:2px 4px 2px 0;background:#eef1f4}
.s-open{background:#e6f4e7;color:var(--ok)}.s-free{background:#e3eefc;color:var(--free)}.s-only{background:#f3e5f5;color:#7b1fa2}
.s-warn{background:#fff3e0;color:var(--warn)}.s-closed{background:#fde8e8;color:var(--bad)}
.blk{margin:8px 0}.blk small{color:var(--mut)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.btn{flex:1 1 30%;text-align:center;text-decoration:none;color:#fff;background:var(--acc);border:0;border-radius:10px;padding:10px 6px;font-size:14px}
.btn.alt{background:#eef1f4;color:var(--fg)}
.btn.star{background:#fff4d6;color:#7a5600}
.src a{color:var(--mut);font-size:12px;word-break:break-all}
.photo{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin:4px 0}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.li .e{font-size:20px;width:26px;text-align:center}
.li .m{flex:1}.li .d{color:var(--mut);font-size:12.5px;white-space:nowrap}
.task{padding:9px 0;border-bottom:1px solid var(--line)}
.task label{display:flex;gap:8px;align-items:flex-start}
.task input{width:20px;height:20px;margin-top:1px}
.task a{color:var(--acc)}
.hours{display:flex;gap:4px;overflow-x:auto;padding:4px 0}
.h{min-width:44px;text-align:center;font-size:12px;background:#f3f6f9;border-radius:8px;padding:4px 2px}
.h.rain{background:#dceaf9}
.pm{display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px #0006;font-size:15px}
.pm.closed{filter:grayscale(1);opacity:.55}
.pm.me{background:#1e88e5;width:16px!important;height:16px!important;border:3px solid #fff}
.leaflet-tooltip.lbl{background:#fffe;border:0;box-shadow:0 1px 3px #0004;font-size:11.5px;padding:1px 5px}
</style>
</head>

<script>
const PLACES = [{"id":1,"name":"Дом","lat":45.4941373,"lng":12.2618901,"cluster":"Местре · дом и рынок","cats":["home"],"indoor":0,"price":"Оплачено","addr":"Via Bissuola, Mestre","why":"Квартира. Заезд после 15:00, выезд 3.11 до 10:00. Это материк: до Piazzale Roma автобус 24/24H ~16 мин езды.","time":"","caveat":"","pin":"","links":[],"acc":"object","gq":null,"status":"home","checked":null,"photo":null,"days":{}},{"id":2,"name":"RePulse · барахолка","lat":45.4952467,"lng":12.243922,"cluster":"Местре · дом и рынок","cats":["market"],"indoor":0,"price":"Вход €0","addr":"Via San Girolamo, Mestre, Venezia, Italy","why":"Покопаться в винтаже и вещах для дома — без отдельной поездки за город. Ряды заявлены на Via San Girolamo и Via Caneve. Квартира и рынок находятся в Местре; после рынка можно пройти к трамваю Mestre Centro. Качество и размер конкретного выпуска заранее не гарантированы.","time":"Только 1 ноября 2026 · часы этого выпуска не подтверждены.","caveat":"08:00–19:00 в найденной карточке относятся к 4 октября. Эти часы не перенесены на ноябрь.","pin":"Метка — ориентир на Via San Girolamo; ряды рынка занимают улицы San Girolamo / Caneve, это не отдельное здание.","links":["https://live.comune.venezia.it/index.php/it/2026/10/le-citta-festa-gli-appuntamenti-dal-30-ottobre-al-5-novembre","https://www.comune.venezia.it/content/repulse-4"],"acc":"area","gq":"RePulse Via San Girolamo Mestre","status":"warn","checked":null,"photo":null,"days":{"1":{"s":"only","t":"Только сегодня · часы выпуска не подтверждены"},"2":{"s":"closed","t":"Рынка нет"},"3":{"s":"closed","t":"Рынка нет"},"31":{"s":"closed","t":"Рынка нет"}}},{"id":3,"name":"Piazza Ferretto","lat":45.49379,"lng":12.24138,"cluster":"Местре · дом и рынок","cats":["walk","food"],"indoor":0,"price":"€0","addr":"Piazza Erminio Ferretto, Mestre, Venezia, Italy","why":"Пешеходный центр Местре для короткой прогулки, еды и местной жизни. Удобнее совместить с рынком или бытовыми покупками, чем специально возвращаться сюда посреди прогулки по островной Венеции.","time":"","caveat":"","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/terraferma"],"acc":"area","gq":"Piazza Erminio Ferretto Mestre","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Piazza_ferretto_a_mestre.jpg/960px-Piazza_ferretto_a_mestre.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Piazza_Erminio_Ferretto"},{"id":4,"name":"Bissuola Esiodo · автобус к Венеции","lat":45.4935,"lng":12.2641,"cluster":"Местре · дом и рынок","cats":["transport"],"indoor":0,"price":"€3 / двоих","addr":"Bissuola Esiodo, Mestre, Venezia, Italy","why":"Автобусы 24 / 24H к Piazzale Roma; именно поездка обычно занимает около 16 минут. Выбирайте направление Venezia / Piazzale Roma, а не Tosatto или Rielta. На разных сторонах улицы одинаковое название остановки. От двери до исторического центра дольше: подход и ожидание добавляются.","time":"Воскресенье и праздник: рейсы реже; проверить отправление перед выходом.","caveat":"Старые 09:12 / 09:17 из переписки не являются вашим расписанием. Выход из квартиры — 09:30, следующий рейс смотрите по ссылке.","pin":"Метка — район пересечения Via Bissuola / Via Esiodo; точную сторону остановки в направлении Venezia сверяйте по указателям.","links":["https://andreafrison.com/app/mini-venice/en/lines/bus/24/","https://andreafrison.com/app/mini-venice/en/lines/bus/24h/","https://actv.avmspa.it/it/content/urbano-venezia-0"],"acc":"approx","gq":"Bissuola Esiodo bus stop Mestre","status":"warn","checked":null,"photo":null,"days":{}},{"id":5,"name":"Mestre Centro · трамвай T1","lat":45.4934714,"lng":12.2460979,"cluster":"Местре · дом и рынок","cats":["transport"],"indoor":0,"price":"€3 / двоих","addr":"Mestre Centro Piazzale Cialdini Venezia Italy","why":"Точка пересадки после рынка и прогулки по центру Местре. На табло нужен T1 в сторону Venezia / Piazzale Roma. Городской билет €1,50 с человека, без водных линий. Время ближайшего трамвая проверяется в навигации.","time":"","caveat":"","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://actv.avmspa.it/it/content/urbano-venezia-0"],"acc":"area","gq":"Mestre Centro tram stop","status":"free","checked":null,"photo":null,"days":{}},{"id":6,"name":"Parco Alfredo Albanese / Bissuola","lat":45.49915,"lng":12.26248,"cluster":"Местре · дом и рынок","cats":["nature"],"indoor":0,"price":"€0","addr":"Parco Alfredo Albanese, Mestre, Venezia, Italy","why":"Зелень и короткая прогулка рядом с квартирой. Это парк у дома, а не отдельная главная достопримечательность. Подходит, когда не хочется ехать на остров сразу после завтрака.","time":"","caveat":"Ориентируйтесь на открытые входы и таблички парка; не рассчитывайте на ночной доступ.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/giardini-parchi-oasi-naturali/parco-alfredo-albanese"],"acc":"area","gq":"Parco Alfredo Albanese Mestre","status":"free","checked":null,"photo":null,"days":{}},{"id":7,"name":"Parco San Giuliano","lat":45.4743271,"lng":12.2760376,"cluster":"Местре · дом и рынок","cats":["nature"],"indoor":0,"price":"Прогулка €0","addr":"Parco San Giuliano, Mestre, Venezia, Italy","why":"Большой парк у лагуны; вариант для открытого пространства и велопрогулки. Это отдельный материковый выход. На ветер и дождь место менее удачное. Велопрокат и парковочные зоны проверяются в RideMovi; конкретную цену приложения здесь не обещаем.","time":"","caveat":"Не соединяйте пешком с островными районами ради экономии: дорога через мост — не короткая прогулка. Прокат не включён в бесплатные занятия.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/giardini-parchi-oasi-naturali/parco-san-giuliano"],"acc":"area","gq":"Parco San Giuliano Mestre","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Parco_san_giuliano.JPG/960px-Parco_san_giuliano.JPG?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Parco_San_Giuliano"},{"id":8,"name":"Forte Marghera","lat":45.47511,"lng":12.26196,"cluster":"Местре · дом и рынок","cats":["hidden"],"indoor":0,"price":"Доступ уточнить","addr":"Forte Marghera, Mestre, Venezia, Italy","why":"Старые военные корпуса, вода и зелень — резерв под интерес к промышленным местам. Интересна территория бывшего форта. Это не разрешение ходить в закрытые здания. Летние бары и события не переносим на ноябрь.","time":"Доступ территории и отдельных корпусов на ваши даты не подтверждён.","caveat":"Не ехать специально без свежей проверки. Часть объектов может быть закрыта или на ремонте.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.spottedbylocals.com/venice/forte-marghera/"],"acc":"area","gq":"Forte Marghera","status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/71/Forte-marghera.jpg/960px-Forte-marghera.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"warn","t":"Доступ не подтверждён"},"2":{"s":"warn","t":"Доступ не подтверждён"}},"photoPage":"https://it.wikipedia.org/wiki/Forte_Marghera"},{"id":9,"name":"Piazzale Roma · главный узел","lat":45.43794,"lng":12.31877,"cluster":"Запад · вход в Венецию","cats":["transport"],"indoor":0,"price":"Площадь €0","addr":"Piazzale Roma, Venezia, Italy","why":"Здесь заканчивается автобус из Местре, начинаются пешие прогулки и лодки. Автобусная площадка и причалы — разные зоны. Для бесплатной DE нужен водный причал D; для л _Bridge_at_night2.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Ponte_di_Rialto"},{"id":24,"name":"Арка у Aquila Nera","lat":45.4374,"lng":12.3374,"cluster":"Риальто и Мираколи","cats":["hidden","photo"],"indoor":0,"price":"Уличный осмотр €0","addr":"Calle dell’Aquila Nera, San Marco, Venezia, Italy","why":"Тот самый кадр из вашего ролика: арка, вода и фасад напротив. Ориентир — переулок у Trattoria Aquila Nera рядом с Риальто. Карта ведёт к улице, не к гарантированному точному месту съёмки. Сверьте арку по вашему кадру.","time":"","caveat":"Геометка Instagram возле San Giovanni Evangelista неверна для этого ориентира. Помост используется лодками; не мешать посадке и не заходить в закрытые зоны.","pin":"Метка показывает переулок Calle dell’Aquila Nera. Точный помост из ролика не геодезически подтверждён: ищите арочный выход к воде, а не ресторанный стол.","links":["https://vie.openalfa.it/vie/calle-dell-aquila-nera-san-marco-venezia-murano-burano-venezia"],"acc":"approx","gq":null,"status":"free","checked":null,"photo":null,"days":{}},{"id":25,"name":"Palazzo Bembo","lat":45.4370389,"lng":12.3350667,"cluster":"Риальто и Мираколи","cats":["art","free"],"indoor":1,"price":"Вход €0","addr":"Palazzo Bembo, Riva del Carbon 4793, Venezia, Italy","why":"Японские инсталляции, JoJo и окна на Гранд-канал. Personal Structures — отдельная бесплатная выставка, а не платные Giardini / Arsenale. Можно выбрать несколько залов вместо полного обхода.","time":"10:00–18:00 · вторник закрыто · до 22 ноября.","caveat":"1–2 ноября подходят; 3 ноября закрыто. Проверяйте вход в выставку, а не в отель с похожим названием.","pin":"","links":["https://mangaart.jp/exhibitions/ps2026-venice","https://brand.b-ownd.com/en/venice2026/"],"acc":"object","gq":"Palazzo Bembo Venezia","status":"ok","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Palais_Bembo.jpg/960px-Palais_Bembo.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"3":{"s":"closed","t":"Вт закрыто"},"1":{"s":"free","t":"10:00–18:00 · бесплатно"},"2":{"s":"free","t":"10:00–18:00 · бесплатно"}},"photoPage":"https://it.wikipedia.org/wiki/Palazzo_Bembo"},{"id":26,"name":"San Salvador · хор и орган","lat":45.43669,"lng":12.33654,"cluster":"Риальто и Мираколи","cats":["art","free"],"indoor":1,"price":"€0","addr":"Chiesa di San Salvador, San Marco 4835, Venezia, Italy","why":"Спокойная живая музыка, если захочется сменить улицы на церковную акустику. Концерт Guillou Consort, орган Alessandro Perin. Это духовная музыка, не вечернее шоу. Можно оставить необязательным.","time":"1 ноября 2026 · начало 16:00.","caveat":"Количество мест и окончание программы не указаны. В церковь приходят слушать, а не на короткий фотозаход посреди исполнения.","pin":"","links":["https://www.guillouconsort.it/event/concerto-a-san-salvador-venezia/"],"acc":"object","gq":"Chiesa di San Salvador Venezia","status":"ok","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/San_Salvador_Venezia_Notte.jpg/960px-San_Salvador_Venezia_Notte.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"only","t":"Концерт 16:00 · бесплатно"}},"photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Salvador"},{"id":27,"name":"Cantina Do Spade","lat":45.43918,"lng":12.33339,"cluster":"Риальто и Мираколи","cats":["food"],"indoor":1,"price":"План: €40–50","addr":"Cantina Do Spade, Calle Do Spade 859, Venezia, Italy","why":"Кандидат на один нормальный итальянский приём пищи вдвоём. В меню: bigoli €16, паста с чернилами каракатицы €17. Две пасты €33, напитки, вода и возможный coperto отдельно. Общая сумма — план, не фиксированный сет.","time":"Ежедневно 10:00–15:00 и 18:00–22:00.","caveat":"Сначала меню и доплаты, затем заказ. Возможна очередь; не оставлять единственным вариантом еды.","pin":"","links":["https://cantinadospade.com/menu/","https://www.tripadvisor.com/Restaurant_Review-g187870-d1034679-Reviews-Cantina_Do_Spade-Venice_Veneto.html"],"acc":"object","gq":"Cantina Do Spade Venezia","status":"ok","checked":null,"photo":null,"days":{"1":{"s":"open","t":"10:00–15:00, 18:00–22:00"},"2":{"s":"open","t":"10:00–15:00, 18:00–22:00"}}},{"id":28,"name":"Traghetto Santa Sofia","lat":45.440431,"lng":12.334764,"cluster":"Риальто и Мираколи","cats":["water"],"indoor":0,"price":"€4 / двоих","addr":"Traghetto Santa Sofia, Venezia, Italy","why":"Короткая гондольная переправа: Cannaregio ↔ рынок Риальто. Это пересечение Гранд-канала, не экскурсия. Нужны €2 с человека; мелкие наличные удобнее. Как стоять или садиться — подскажет гребец.","time":"Вс / праздники 09:00–18:00 · пн–пт 08:30–19:00.","caveat":"Базовый график опубликован городом, не обещание конкретной лодки. При остановке работы переходите через Риальто.","pin":"Метка — ориентир возле Foscari Palace / Campo Santa Sofia. Ищите указатель Traghetto на кромке канала; это не остановка вапоретто Ca’ d’Oro.","links":["https://www.comune.venezia.it/it/content/traghetti-parada"],"acc":"approx","gq":"Traghetto Santa Sofia Venezia","status":"ok","checked":null,"photo":null,"days":{"1":{"s":"open","t":"09:00–18:00 · €2/чел"},"2":{"s":"open","t":"08:30–19:00 · €2/чел"}}},{"id":29,"name":"Рынок Риальто · не барахолка","lat":45.43959,"lng":12.33458,"cluster":"Риальто и Мираколи","cats":["market","food"],"indoor":0,"price":"Осмотр €0","addr":"Mercato di Rialto, Venezia, Italy","why":"Продовольственные ряды: интересны, только когда действительно торгуют. Не заменяет RePulse. Рыбная часть не работает в воскресенье и понедельник. Во вторник возможна утром, но это уже ваш день вылета.","time":"Рыба: вт–сб утром · 1 и 2 ноября рыбные ряды закрыты.","caveat":"В понедельник могут работать овощные продавцы; праздничный состав торговли не подтверждён.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.cntraveler.com/shops/venice/mercato-di-rialto"],"acc":"area","gq":"Mercato di Rialto","status":"warn","checked":null,"photo":null,"days":{"1":{"s":"closed","t":"Рыбные ряды закрыты"},"2":{"s":"warn","t":"Рыбы нет, овощи — может быть"},"3":{"s":"open","t":"Утром рынок работает"}}},{"id":30,"name":"Scala Contarini del Bovolo","lat":45.43481,"lng":12.33455,"cluster":"Сан-Марко · виды и крипта","cats":["hidden","photo"],"indoor":0,"price":"Снаружи €0","addr":"Scala Contarini del Bovolo, San Marco 4297, Venezia, Italy","why":"Спиральная лестница в маленьком дворе — найти, посмотреть снизу и сфотографироваться. В базовом варианте — осмотр снаружи, без подъёма. Платный подъём выбирайте на месте по актуальной цене и очереди.","time":"","caveat":"Расписания подъёма в сторонних источниках расходятся. Доступ в двор может ограничиваться воротами; подъём не включён в бесплатный осмотр.","pin":"","links":["https://www.spottedbylocals.com/venice/scala-contarini-del-bovolo/"],"acc":"object","gq":"Scala Contarini del Bovolo","status":"warn","checked":null,"photo":null,"days":{}},{"id":31,"name":"Piazza San Marco","lat":45.43426,"lng":12.33851,"cluster":"Сан-Марко · виды и крипта","cats":["photo"],"indoor":0,"price":"Площадь €0","addr":"Piazza San Marco, Venezia, Italy","why":"Увидеть главный ансамбль города снаружи и пройти к большой воде. В этом путеводителе — площадь и фасады, без билетов в собор, дворец и колокольню. В дорогие кафе не обязательно заходить ради вида.","time":"","caveat":"При высокой воде низкие участки могут быть недоступны. Бесплатная площадь не означает бесплатный вход во все здания.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.comune.venezia.it/it/content/murano-illumina-il-mondo-1"],"acc":"area","gq":"Piazza San Marco","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Piazza_San_Marco_%28Venice%29_at_night-msu-2021-6449-.jpg/960px-Piazza_San_Marco_%28Venice%29_at_night-msu-2021-6449-.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Piazza_San_Marco"},{"id":32,"name":"Murano illumina il mondo","lat":45.4344,"lng":12.337989,"cluster":"Сан-Марко · виды и крипта","cats":["art","free"],"indoor":0,"price":"Уличный просмотр €0","addr":"Procuratie Vecchie, Piazza San Marco, Venezia, Italy","why":"Двенадцать авторских световых работ из муранского стекла под аркадами. Смотреть под аркадами Procuratie Vecchie. Это не поездка на остров Мурано и не платный мастер-класс.","time":"Выставка заканчивается 1 ноября 2026.","caveat":"Время окончания и демонтажа в последний день не опубликовано. Не переносить на 2 ноября.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.comune.venezia.it/it/content/murano-illumina-il-mondo-1"],"acc":"area","gq":"Procuratie Vecchie Venezia","status":"ok","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Venezia_piazza_s.Marco.JPG/960px-Venezia_piazza_s.Marco.JPG?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"only","t":"Последний день выставки"},"2":{"s":"closed","t":"Выставка закончилась"},"3":{"s":"closed","t":"Выставка закончилась"}},"photoPage":"https://it.wikipedia.org/wiki/Procuratie"},{"id":33,"name":"Ponte della Paglia и Riva degli Schiavoni","lat":45.43365,"lng":12.341,"cluster":"Сан-Марко · виды и крипта","cats":["photo","water"],"indoor":0,"price":"€0","addr":"Ponte della Paglia, Venezia, Italy","why":"Мост Вздохов снаружи, лодки и длинный открытый вид на лагуну. Можно продолжить по набережной в сторону Marinaressa. Для фотографий остановиться там, где не перекрываете поток людей.","time":"","caveat":"","pin":"","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/castello-arte-navale-e-tradizioni"],"acc":"object","gq":"Ponte della Paglia Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/Venice%2C_Riva_degli_Schiavoni_2005.jpg/960px-Venice%2C_Riva_degli_Schiavoni_2005.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Ponte_della_Paglia"},{"id":34,"name":"San Zaccaria · крипта","lat":45.43471,"lng":12.3436,"cluster":"Сан-Марко · виды и крипта","cats":["hidden"],"indoor":1,"price":"Около €7 / двоих","addr":"Chiesa di San Zaccaria, Venezia, Italy","why":"Небольшое подземное помещение с колоннами и отражениями в воде. В отзывах билет в часовни и крипту — €3,50 с человека. Это маленькое пространство, не лабиринт тоннелей. Цена не является подтверждённым прайсом на день визита.","time":"По Tripadvisor: вс 16:00–18:00 · пн 10:00–12:00 и 16:00–18:00.","caveat":"До оплаты спросить, можно ли спуститься: при воде доступ бывает только до лестницы. Во время служб осмотр может быть ограничен.","pin":"","links":["https://www.tripadvisor.com/Attraction_Review-g187870-d243057-Reviews-Chiesa_di_San_Zaccaria-Venice_Veneto.html"],"acc":"object","gq":"Chiesa di San Zaccaria Venezia","status":"ok","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/69/Chiesa_di_San_Zaccaria_Venezia.jpg/960px-Chiesa_di_San_Zaccaria_Venezia.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"warn","t":"16:00–18:00 (по отзывам)"},"2":{"s":"warn","t":"10:00–12:00, 16:00–18:00 (по отзывам)"}},"photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Zaccaria"},{"id":35,"name":"Traghetto Dogana · берег San Marco","lat":45.4328,"lng":12.337,"cluster":"Сан-Марко · виды и крипта","cats":["water"],"indoor":0,"price":"€4 / двоих","addr":"Traghetto Dogana Vallaresso, Venezia, Italy","why":"Из района Vallaresso переправиться к Punta della Dogana. Связывает Сан-Марко с Дорсодуро по воде. В Google Maps выбирайте именно гондольную переправу; обычная остановка вапоретто рядом — другая услуга.","time":"Базовый график 09:00–18:00.","caveat":"Если переправа не работает, пеший обход идёт через мост Академии, а не вдоль воды напрямую.","pin":"Метка обозначает Calle Vallaresso. Пройдите к её выходу на воду и ищите Traghetto Dogana. Не путать с платной туристической гондолой.","links":["https://www.comune.venezia.it/it/content/traghetti-parada"],"acc":"approx","gq":"Traghetto Dogana Venezia","status":"ok","checked":null,"photo":null,"days":{"1":{"s":"open","t":"≈09:00–18:00 · €2/чел"},"2":{"s":"open","t":"≈09:00–18:00 · €2/чел"}}},{"id":36,"name":"Ponte dei Conzafelzi · Palazzo Tetta","lat":45.43835,"lng":12.34216,"cluster":"Кастелло · дворы и Арсенал","cats":["photo"],"indoor":0,"price":"€0","addr":"Ponte dei Conzafelzi, Venezia, Italy","why":"Дворец на развилке каналов: удобный короткий фотозаход. Для вида нужен мост, а не поиск входа во дворец. Внутреннее посещение здесь не запланировано.","time":"","caveat":"","pin":"","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/castello-arte-navale-e-tradizioni"],"acc":"object","gq":"Ponte dei Conzafelzi Venezia","status":"free","checked":null,"photo":null,"days":{}},{"id":37,"name":"Libreria Acqua Alta","lat":45.43806,"lng":12.34227,"cluster":"Кастелло · дворы и Арсенал","cats":["market","hidden"],"indoor":1,"price":"Вход €0","addr":"Libreria Acqua Alta, Calle Lunga Santa Maria Formosa 5176B, Venezia, Italy","why":"Книги в лодках, необычный интерьер и дворик из роликов. Это действующий магазин. Покупка необязательна; фотографии не должны мешать продавцам и покупателям.","time":"Сторонний ориентир 09:00–19:10; наружные зоны закрываются раньше.","caveat":"Точные праздничные часы и доступ во двор не подтверждены. При длинной очереди достаточно пройти дальше — рядом Tetta и Grimani.","pin":"","links":["https://www.localexperiences.online/en/venice/secret-places/","https://www.libreriacqualta.it/en/contacts/"],"acc":"object","gq":"Libreria Acqua Alta Venezia","status":"warn","checked":null,"photo":null,"days":{"1":{"s":"warn","t":"≈09:00–19:10, праздник не подтверждён"},"2":{"s":"open","t":"≈09:00–19:10"}}},{"id":38,"name":"Museo di Palazzo Grimani","lat":45.43685678044424,"lng":12.34204262495041,"cluster":"Кастелло · дворы и Арсенал","cats":["art"],"indoor":1,"price":"€0 только 1 ноября","addr":"Museo di Palazzo Grimani, Castello 4858, Venezia, Italy","why":"Исторические залы и Tribuna с античными скульптурами. Государственный музей у Santa Maria Formosa. 1 ноября — первое воскресенье месяца, бесплатный вход по программе Domenica al Museo.","time":"Вт–вс 10:00–19:00 · последний вход 18:00 · пн закрыто.","caveat":"Не путать с Palazzo Vendramin Grimani. 2 ноября закрыт; 3 ноября обычный платный день. На бесплатный вход возможна очередь.","pin":"","links":["https://museogrimani.cultura.gov.it/","https://www.museivenezia.it/musei-gratis-venezia/"],"acc":"object","gq":"Museo di Palazzo Grimani","status":"ok","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Palazzo_Grimani%2C_Venice_%2830483051173%29.jpg/960px-Palazzo_Grimani%2C_Venice_%2830483051173%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"free","t":"Бесплатно · 10:00–19:00, вход до 18:00"},"2":{"s":"closed","t":"Пн закрыто"},"3":{"s":"open","t":"10:00–19:00 · платно"}},"photoPage":"https://it.wikipedia.org/wiki/Palazzo_Grimani_di_Santa_Maria_Formosa"},{"id":39,"name":"Corte Nova · синий проход","lat":45.437,"lng":12.346381,"cluster":"Кастелло · дворы и Арсенал","cats":["hidden"],"indoor":0,"price":"€0","addr":"Sotoportego de Corte Nova, Calle Zorzi, Castello, Venezia, Italy","why":"Найти проход-часовню с сине-золотым потолком и красным камнем. Нужен sotoportego между Calle Zorzi и Corte Nova в Castello, у Santa Giustina. Местная легенда связывает красный камень с остановившейся чумой; это легенда, не исторический факт.","time":"","caveat":"Не выбирать одноимённую Corte Nova в Cannaregio. Если навигатор показывает другой район, сверить название Calle Zorzi.","pin":"","links":["https://www.conoscerevenezia.it/?p=49667"],"acc":"approx","gq":null,"status":"warn","checked":null,"photo":null,"days":{}},{"id":40,"name":"San Francesco della Vigna · дворы","lat":45.43822,"lng":12.34808,"cluster":"Кастелло · дворы и Арсенал","cats":["hidden"],"indoor":0,"price":"При открытом доступе €0","addr":"Chiesa di San Francesco della Vigna, Venezia, Italy","why":"Тихие аркады, старые стены и спокойная пауза среди города. Местная фотограф описывает монастырские дворы как место, куда приходит отдыхать с мужем. Для нас это необязательный короткий заход.","time":"Доступ во дворы на конкретные часы не подтверждён.","caveat":"Не путать со специальными платными посещениями виноградника. Закрытые двери и служебные зоны не обходить.","pin":"","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city"],"acc":"object","gq":"Chiesa di San Francesco della Vigna","status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Facade_of_San_Francesco_della_Vigna_%28Venice%29.jpg/960px-Facade_of_San_Francesco_della_Vigna_%28Venice%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Francesco_della_Vigna"},{"id":41,"name":"Celestia · наружная стена Арсенала","lat":45.4378991,"lng":12.3496928,"cluster":"Кастелло · дворы и Арсенал","cats":["hidden","water"],"indoor":0,"price":"Общественный маршрут €0","addr":"Campo de la Celestia, Venezia, Italy","why":"Кирпичные стены верфи, узкая дорожка и открытая лагуна. Осматривать общественную наружную часть. Это промышленная атмосфера без обещания зайти в закрытые корпуса или платную Биеннале.","time":"","caveat":"На воде бывает ветрено; отдельные проходы могут перекрывать. Не планируйте свободный доступ во внутренний Арсенал.","pin":"Метка обозначает Campo de la Celestia. К наружной дорожке у стены Арсенала пройдите в сторону лагуны; внутренние корпуса не открыты свободно.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/castello-arte-navale-e-tradizioni"],"acc":"area","gq":"Campo de la Celestia Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Campo_de_l%27Arsenal.jpg/960px-Campo_de_l%27Arsenal.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Arsenale_di_Venezia"},{"id":42,"name":"Rosa Salva · кофе и сладкое","lat":45.43892,"lng":12.34175,"cluster":"Кастелло · дворы и Арсенал","cats":["food"],"indoor":1,"price":"План: €8–14","addr":"Rosa Salva, Campo Santi Giovanni e Paolo, Venezia, Italy","why":"Небольшая сладкая пауза возле Santi Giovanni e Paolo. Нужна точка на Campo SS. Giovanni e Paolo. Плановая сумма на двоих зависит от напитков и десертов; это не подтверждённое предложение.","time":"Обычный график точки 08:00–20:00.","caveat":"У стойки и за столиком условия могут отличаться. Сначала меню, особенно если хотите горячий шоколад и десерт.","pin":"","links":["https://rosasalva.it/it/locali-rosa-salva"],"acc":"object","gq":"Rosa Salva Campo Santi Giovanni e Paolo","status":"ok","checked":null,"photo":null,"days":{"1":{"s":"warn","t":"обычно 08:00–20:00"},"2":{"s":"open","t":"обычно 08:00–20:00"}}},{"id":43,"name":"San Pietro di Castello","lat":45.4347133,"lng":12.3590844,"cluster":"Восток · Сан-Пьетро и парки","cats":["walk"],"indoor":0,"price":"Снаружи €0","addr":"Campo San Piero de Casteo, Venezia, Italy","why":"Тихий восточный край города и место высадки со специальной DE. Гуляем по campo и берегам вокруг. Посещение самой базилики — отдельный вопрос, в бесплатную уличную точку не включено.","time":"Бесплатная DE действует только 31 октября — 2 ноября.","caveat":"","pin":"Метка обозначает площадь у церкви. Причал S. Pietro di Castello ищите по указателям; это не точка трапа.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezi ia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/VENEZIA_Sestiere_di_Castello%2C_Via_Garibaldi.jpg/960px-VENEZIA_Sestiere_di_Castello%2C_Via_Garibaldi.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Via_Garibaldi_%28Venezia%29"},{"id":46,"name":"Giardini della Marinaressa","lat":45.4314603,"lng":12.3525968,"cluster":"Восток · Сан-Пьетро и парки","cats":["art","free","nature"],"indoor":0,"price":"Вход €0","addr":"Giardini della Marinaressa, Venezia, Italy","why":"Скульптуры под открытым небом прямо у лагуны. Бесплатная часть Personal Structures. Не путать с платными Giardini della Biennale, которые находятся дальше на восток.","time":"Выставочный ориентир 10:00–18:00 · до 22 ноября.","caveat":"После закрытия вход в сад может быть недоступен. Ветер и дождь делают этот пункт менее приятным.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.clp1968.it/mostra/personal-structures-confluences/"],"acc":"area","gq":"Giardini della Marinaressa","status":"ok","checked":null,"photo":null,"days":{"1":{"s":"free","t":"10:00–18:00 · бесплатно"},"2":{"s":"free","t":"10:00–18:00 · бесплатно"}}},{"id":47,"name":"Sant’Elena · Parco delle Rimembranze","lat":45.42591,"lng":12.36116,"cluster":"Восток · Сан-Пьетро и парки","cats":["nature"],"indoor":0,"price":"€0","addr":"Parco delle Rimembranze, Sant’Elena, Venezia, Italy","why":"Сосны, скамейки и открытая вода для спокойной паузы вдвоём. Дополнительная петля дальше на восток от Via Garibaldi. Оставьте время и силы на возвращение; это не соседний двор с Риальто.","time":"Зимний ориентир парка 08:00–18:30.","caveat":"В плохую погоду лучше пропустить длинную открытую набережную. Отдельные проходы могут закрываться.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/giardini-parchi-oasi-naturali/pineta-di-sant-elena"],"acc":"area","gq":"Parco delle Rimembranze Sant Elena Venezia","status":"ok","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Isola_di_sant%27elena_venezia.jpg/960px-Isola_di_sant%27elena_venezia.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"open","t":"08:00–18:30"},"2":{"s":"open","t":"08:00–18:30"}},"photoPage":"https://it.wikipedia.org/wiki/Sant%27Elena_%28Venezia%29"},{"id":48,"name":"Campo Santa Margherita","lat":45.43433,"lng":12.32375,"cluster":"Дорсодуро · верфь и набережная","cats":["walk","food"],"indoor":0,"price":"€0","addr":"Campo Santa Margherita, Venezia, Italy","why":"Площадь для перерыва, повседневной жизни и недорогой еды рядом. Это удобный узел между San Pantalon и San Barnaba, а не ещё одна обязательная фотоплощадь.","time":"","caveat":"","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/dorsoduro-sestiere-d-arte"],"acc":"area","gq":"Campo Santa Margherita","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Campo_Santa_Margherita_%28Venice%29.jpg/960px-Campo_Santa_Margherita_%28Venice%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Campo_Santa_Margherita"},{"id":49,"name":"Pizza Al Volo","lat":45.43426,"lng":12.3234,"cluster":"Дорсодуро · верфь и набережная","cats":["food"],"indoor":0,"price":"План: €10–16","addr":"Pizza Al Volo, Campo Santa Margherita 2944A, Venezia, Italy","why":"Пицца навынос: быстрый способ поесть без ресторанного чека. Сумма — план на двоих, зависит от заказа. Смотрите цены на витрине; полноценной посадки для отдыха не обещаем.","time":"По Tripadvisor ежедневно 11:00–02:00.","caveat":"Праздничные изменения возможны. Еду не стоит устраивать на ступенях памятников; найдите разрешённое место для перерыва.","pin":"","links":["https://www.tripadvisor.com/Restaurant_Review-g187870-d1466936-Reviews-Pizza_Al_Volo-Venice_Veneto.html"],"acc":"object","gq":"Pizza Al Volo Venezia","status":"ok","checked":null,"photo":null,"days":{"1":{"s":"open","t":"11:00–02:00 (Tripadvisor)"},"2":{"s":"open","t":"11:00–02:00"}}},{"id":50,"name":"Ponte dei Pugni и San Barnaba","lat":45.43316,"lng":12.32435,"cluster":"Дорсодуро · верфь и набережная","cats":["walk"],"indoor":0,"price":"€0","addr":"Ponte dei Pugni, Venezia, Italy","why":"Небольшой мост, канал и короткий переход между уютными площадями. По пути к San Trovaso. Любые работающие лавки и лодки рядом — бонус, а не обещанная программа.","time":"","caveat":"","pin":"","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/dorsoduro-sestiere-d-arte"],"acc":"object","gq":"Ponte dei Pugni Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Ponte_dei_pugni_%28Venice%29.jpg/960px-Ponte_dei_pugni_%28Venice%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Ponte_dei_Pugni"},{"id":51,"name":"Squero di San Trovaso · снаружи","lat":45.43034,"lng":12.32586,"cluster":"Дорсодуро · верфь и набережная","cats":["water","hidden"],"indoor":0,"price":"Вид с берега €0","addr":"Squero di San Trovaso, Venezia, Italy","why":"Посмотреть на деревянные постройки и гондолы действующей верфи. Нужен вид с противоположной общественной набережной. Это не бесплатная экскурсия внутрь мастерской.","time":"","caveat":"Работу мастеров в праздник не гарантируем. Не заходить в рабочий двор и не мешать людям.","pin":"Координаты обозначают саму верфь. Смотреть нужно с общедоступной противоположной набережной Fondamenta Nani, не заходить на рабочую территорию.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/dorsoduro-sestiere-d-arte"],"acc":"object","gq":"Squero di San Trovaso","status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Squero_di_San_Trovaso_%28Venice%29-msu-2021-5474-.jpg/960px-Squero_di_San_Trovaso_%28Venice%29-msu-2021-5474-.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Squero_di_San_Trovaso"},{"id":52,"name":"Osteria Al Squero","lat":45.4301,"lng":12.32616,"cluster":"Дорсодуро · верфь и набережная","cats":["food"],"indoor":1,"price":"План: €15–25","addr":"Osteria Al Squero, Dorsoduro 943, Venezia, Italy","why":"Чиккетти рядом с видом на верфь — по желанию вместо полноценного обеда. Ориентир суммы на двоих, не фиксированный сет. Маленькие закуски могут незаметно набрать ресторанный чек.","time":"Часы на конкретный день сверить; понедельник заявлялся 10:00–21:00.","caveat":"Не рассчитывать на долгую посадку. При очереди есть пицца у Santa Margherita или другие места по текущему меню.","pin":"","links":["https://www.alsquero.it/"],"acc":"object","gq":"Osteria Al Squero Venezia","status":"warn","checked":null,"photo":null,"days":{}},{"id":53,"name":"Ponte dell’Accademia","lat":45.43166,"lng":12.32891,"cluster":"Дорсодуро · верфь и набережная","cats":["photo"],"indoor":0,"price":"€0","addr":"Ponte dell’Accademia, Venezia, Italy","why":"Вид по Гранд-каналу в сторону Salute и переход в район San Marco. Фототочка на обычном пешеходном мосту. Не требует музейного билета и не зависит от работы галереи.","time":"","caveat":"","pin":"","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/dorsoduro-sestiere-d-arte"],"acc":"object","gq":"Ponte dell'Accademia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Accademia_bridge_in_Venice_%28South_East_exposure%29.jpg/960px-Accademia_bridge_in_Venice_%28South_East_exposure%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{}, орика; в непогоду не задерживаться. На противоположный берег не пройти по прямой.","pin":"","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/dorsoduro-sestiere-d-arte"],"acc":"object","gq":"Punta della Dogana","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Venezia-punta_della_dogana.jpg/960px-Venezia-punta_della_dogana.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Punta_della_Dogana"},{"id":58,"name":"Angelo Raffaele → San Nicolò dei Mendicoli","lat":45.4325,"lng":12.3159,"cluster":"Дорсодуро · верфь и набережная","cats":["walk"],"indoor":0,"price":"Улица €0","addr":"Chiesa di San Nicolò dei Mendicoli, Venezia, Italy","why":"Спокойный западный Дорсодуро: старые дома и каналы вне главного потока. Связка рекомендована местной фотографом для неспешной прогулки. Внутрь церкви заходить только при открытом доступе.","time":"","caveat":"Это продолжение на запад от Zattere, не короткая остановка у Dogana. Усталость — повод сократить петлю. Это НЕ храм с мощами Николая: нужный храм находится на Лидо.","pin":"","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city"],"acc":"object","gq":"Chiesa di San Nicolò dei Mendicoli","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Chiesa_di_San_Nicol%C3%B2_dei_Mendicoli_-_Venezia.jpg/960px-Chiesa_di_San_Nicol%C3%B2_dei_Mendicoli_-_Venezia.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Nicol%C3%B2_dei_Mendicoli"},{"id":59,"name":"Santa Marta","lat":45.4343,"lng":12.3134,"cluster":"Дорсодуро · верфь и набережная","cats":["walk","hidden"],"indoor":0,"price":"€0","addr":"Campo Santa Marta, Venezia, Italy","why":"Жилой и бывший портовый край вместо ещё одной парадной площади. Можно совместить с San Nicolò и постепенно вернуться к Piazzale Roma. Закрытые портовые и служебные территории не входят в маршрут.","time":"","caveat":"","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city"],"acc":"area","gq":"Campo Santa Marta Venezia","status":"free","checked":null,"photo":null,"days":{}},{"id":60,"name":"San Michele · островное кладбище","lat":45.446979999999996,"lng":12.346300000000001,"cluster":"Сан-Микеле · только на лодке","cats":["walk","nature"],"indoor":0,"price":"Вход €0","addr":"Cimitero di San Michele, Venezia, Italy","why":"Кипарисы, кирпичные стены и короткая прогулка между двумя поездками на лодке. Не главная цель поездки и не заброшка. 1–2 ноября здесь поминальные дни: спокойно гулять, не мешать семьям, без постановочных фото на могилах.","time":"30 октября — 2 ноября: 07:30–17:00.","caveat":"Пешего мостика в город нет. Заранее сверяйте обратную DE; 3 ноября бесплатная акция уже закончилась.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://veneto.piazzainfesta.it/en/venezia/allerseelen-2026-98791","https://muoversi.venezia.it/it/content/commemorazione-dei-defunti-servizi-gratuiti-e-fermata-straordinaria-di-linea-13"],"acc":"area","gq":"Cimitero di San Michele Venezia","status":"ok","checked":null,"photo":null,"days":{"1":{"s":"open","t":"07:30–17:00 · бесплатная лодка DE"},"2":{"s":"open","t":"07:30–17:00 · бесплатная лодка DE"},"31":{"s":"open","t":"07:30–17:00 · бесплатная лодка DE"},"3":{"s":"warn","t":"Бесплатных лодок уже нет"}}},{"id":61,"name":"Cimitero A · посадка DE в Кастелло","lat":45.44685,"lng":12.34704,"cluster":"Сан-Микеле · только на лодке","cats":["water"],"indoor":0,"price":"€0 в даты акции","addr":"Cimitero vaporetto stop, San Michele, Venezia, Italy","why":"С острова продолжить к San Pietro di Castello, а не возвращаться тем же путём. На месте нужен причал A и рейс DE в сторону San Pietro / Lido. Карта показывает узел Cimitero, букву сверять на указателе.","time":"31.10–02.11: 10:40, 11:40, 12:40, 14:40, 15:40, 16:40.","caveat":"В расписании нет рейса в 13:40. Обычная линия 13 не объявлена бесплатной.","pin":"На карте показан остров, а не точная дверь причала A: координаты причала отдельно не подтверждены. После высадки ориентируйтесь по буквам A/B и табло. Google Maps открывается поиском Cimitero vaporetto stop.","links":["https://muoversi.venezia.it/it/content/commemorazione-dei-defunti-servizi-gratuiti-e-fermata-straordinaria-di-linea-13"],"acc":"approx","gq":null,"status":"ok","checked":null,"photo":null,"days":{"1":{"s":"free","t":"DE: 10:40 11:40 12:40 14:40 15:40 16:40"},"2":{"s":"free","t":"DE: 10:40 11:40 12:40 14:40 15:40 16:40"},"31":{"s":"free","t":"DE: 10:40 11:40 12:40 14:40 15:40 16:40"},"3":{"s":"closed","t":"Акция закончилась"}}},{"id":62,"name":"Fondamente Nove B · короткая DE","lat":45.44317,"lng":12.34066,"cluster":"Сан-Микеле · только на лодке","cats":["water"],"indoor":0,"price":"€0 в даты акции","addr":"Fondamente Nove vaporetto stop, Venezia, Italy","why":"Самая короткая связка город ↔ Сан-Микеле, когда не нужен длинный маршрут. Сам причал находится в городе, в северном Каннареджо. Здесь он вынесен в группу острова, чтобы видеть связь по воде.","time":"31.10–02.11: из F.te Nove B 09:05–17:05, каждые 20 минут.","caveat":"Обратно Cimitero B: 09:15–17:15, каждые 20 минут. Проверять табло и именно обозначение DE.","pin":"","links":["https://muoversi.venezia.it/it/content/commemorazione-dei-defunti-servizi-gratuiti-e-fermata-straordinaria-di-linea-13"],"acc":"object","gq":"Fondamente Nove vaporetto","status":"ok","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Fondamenta_Nuove_-_panoramio.jpg/960px-Fondamenta_Nuove_-_panoramio.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"free","t":"DE каждые 20 мин 09:05–17:05"},"2":{"s":"fre   const show=ok=>{const arr=[...cand].sort((a,b)=>walkM(me,a)-walkM(me,b)).slice(0,25);sheet(`<h2>📍 Рядом с тобой</h2><div class="sub">${ok?'Метры — настоящий путь пешком по улицам и мостам.':'Считаю путь по улицам… пока ≈ прямая ×1,4 («~»).'} Закрытое в выбранный день — помечено. Лодочные точки — нужна лодка.</div>${listHtml(arr,me)}`)};
  show(false);loadLive(cand).then(ok=>{if(ok)show(true)})},
  e=>sheet(`<h2>Не получилось</h2><div class="sub">${esc(e.message)}. Настройки → Safari → Геопозиция → «Спрашивать».</div>`),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
function myDay(){const arr=PLACES.filter(p=>fav.has(p.id));
 if(!arr.length){sheet('<h2>⭐ Мой день</h2><div class="sub">Пока пусто. Открой точку и нажми «☆ В мой день» — здесь соберётся порядок обхода, км и что закрыто.</div>'+tplHtml());return}
 // nearest-neighbour from me or Piazzale Roma
 let cur=me||PLACES.find(p=>p.id===9),left=[...arr],ord=[],km=0;while(left.length){left.sort((a,b)=>walkM(cur,a)-walkM(cur,b));const n=left.shift();km+=walkM(cur,n);ord.push(n);cur=n}
 const closed=ord.filter(p=>(dayInfo(p)||{}).s==='closed');
 sheet(`<h2>⭐ Мой день · ${DAYS.find(d=>d[0]===day)[1]}</h2><div class="sub">Порядок от ${me?'тебя':'Piazzale Roma'} по ближайшему: ~${(km/1000).toFixed(1)} км пешком (цель ~10, максимум 15). ${closed.length?'<b style="color:#c62828">Закрыто в этот день: '+closed.map(p=>esc(p.name)).join(', ')+'</b>':''}</div>${listHtml(ord,null)}<div class="btns"><a class="btn" target="_blank" rel="noopener" href="${routeUrl(ord)}">Весь маршрут в Google Maps</a><button class="btn alt" onclick="fav.clear();LS.set('fav',[]);draw();myDay()">Очистить</button></div>`+tplHtml())}
function routeUrl(ord){const pts=ord.slice(0,10);if(!pts.length)return '#';const d=pts[pts.length-1],w=pts.slice(0,-1).map(p=>p.lat+','+p.lng).join('|');return 'https://www.google.com/maps/dir/?api=1&travelmode=walking&destination='+d.lat+','+d.lng+(w?'&waypoints='+encodeURIComponent(w):'')}
const TPL = {"31":{"text":"Прилёт 17:45 в Тревизо → ATVO → Местре → дом. По пути — продукты на завтрак. Вечер спокойный.","ids":[1]},"1":{"text":"**Праздник, днём возможны ливни.** Утро — барахолка RePulse в Местре → трамвай T1 от Mestre Centro → Piazzale Roma. Дорсодуро: Santa Margherita (пицца Al Volo или паста в Bakarò — от друга), Ponte dei Pugni, верфь San Trovaso, бесплатная Accademia (если дождь) → Corner Pub (бар от друга, спритц ≈€3) → Zattere → Punta della Dogana → traghetto Dogana → Сан-Марко: Murano illumina (последний день), Bovolo → 16:00 концерт в San Salvador → Риальто вечером, ужин Do Spade.","ids":[2,5,48,49,50,51,54,55,57,35,31,32,30,26,23,27,106,105]},"2":{"text":"**Сухо.** День святого Николая и лодок: автобус → Piazzale Roma, причал D → бесплатная DE → San Michele (тихая прогулка) → Cimitero A 10:40/11:40 → Lido S.M.E. → пешком ~2 км к San Nicolò → обратно DE с Lido S.M.E. 12:10/14:10/15:10 (последняя 16:10) → San Pietro di Castello → Via Garibaldi (обед) → Marinaressa → Corte Nova → Libreria Acqua Alta → Rosa Salva / пицца Farini (от друга) → вечер на Misericordia + джелато Bacaro del Gelato (от друга).","ids":[9,60,61,64,63,43,44,45,46,39,37,42,16,108,110]},"3":{"text":"Выезд до 10:00 с вещами. Спокойное утро в центре Местре (Piazza Ferretto) → ATVO около 14:45 в аэропорт.","ids":[3]}};
function tplHtml(){const t=TPL[day];if(!t)return '';return `<div class="blk"><small>Подсказка на этот день (не обязательно)</small><br>${md(t.text)}<div class="btns"><button class="btn alt" onclick="useTpl()">Взять эти точки в мой день</button></div></div>`}
function useTpl(){(TPL[day].ids||[]).forEach(i=>fav.add(i));LS.set('fav',[...fav]);draw();myDay()}
function events(){sheet(`<h2>📅 Что привязано к датам</h2>${EVENTS.map(e=>`<div class="li" ${e.id?`onclick="openPlace(${e.id})"`:''}><div class="e">${e.e}</div><div class="m"><b>${esc(e.when)}</b> — ${md(e.what)}${e.note?`<br><small>${md(e.note)}</small>`:''}</div></div>`).join('')}`)}
function todo(){sheet(`<h2>📋 Забронировать и сделать</h2><div class="sub">Галочки сохраняются в телефоне.</div>${TODO.map((t,k)=>`<div class="task"><label><input type="checkbox" ${done.has(t.key)?'checked':''} onchange="tick('${t.key}',this.checked)"><span><b>${md(t.what)}</b>${t.when?` · <small>${md(t.when)}</small>`:''}<br><small>${md(t.how)}</small>${(t.links||[]).map(l=>`<br><a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</span></label></div>`).join('')}`)}
function tick(k,v){v?done.add(k):done.delete(k);LS.set('done',[...done])}
function wxHours(d){if(!wx||!wx.hourly)return [];const iso={'31':'2026-10-31','1':'2026-11-01','2':'2026-11-02','3':'2026-11-03'}[d];return wx.hourly.time.map((t,i)=>({t,i})).filter(x=>x.t.startsWith(iso)&&+x.t.slice(11,13)>=8&&+x.t.slice(11,13)<=21).map(x=>({h:x.t.slice(11,13),c:Math.round(wx.hourly.temperature_2m[x.i]),f:Math.round(wx.hourly.apparent_temperature[x.i]),p:wx.hourly.precipitation_probability[x.i],mm:wx.hourly.precipitation[x.i],w:Math.round(wx.hourly.wind_speed_10m[x.i]),k:wx.hourly.weather_code[x.i]}))}
const WI=c=>c<=1?'☀️':c<=3?'⛅':c<=48?'🌫':c<=67?'🌧':c<=77?'🌨':c<=82?'🌦':'⛈';
function wxDay(d){if(!wx||!wx.daily)return null;const iso={'31':'2026-10-31','1':'2026-11-01','2':'2026-11-02','3':'2026-11-03'}[d],i=wx.daily.time.indexOf(iso);if(i<0)return null;return {max:Math.round(wx.daily.temperature_2m_max[i]),min:Math.round(wx.daily.temperature_2m_min[i]),p:wx.daily.precipitation_probability_max[i],k:wx.daily.weather_code[i],ss:wx.daily.sunset[i].slice(11),sr:wx.daily.sunrise[i].slice(11)}}
function weather(){sheet(`<h2>🌦 Погода в Венеции</h2><div class="sub">Open-Meteo, обновлено ${esc(wx&&wx._at||'—')}. Ветер у воды ощущается холоднее.</div>${DAYS.map(([d,n])=>{const x=wxDay(d);if(!x)return '';return `<div class="blk"><b>${n}</b> ${WI(x.k)} ${x.min}…${x.max}° · дождь до ${x.p}% · закат ${x.ss}<div class="hours">${wxHours(d).map(h=>`<div class="h ${h.p>=50?'rain':''}">${h.h}:00<br>${WI(h.k)}<br>${h.c}°<br>${h.p}%</div>`).join('')}</div></div>`}).join('')}<div class="btns"><a class="btn alt" href="https://www.comune.venezia.it/it/content/centro-previsioni-e-segnalazioni-maree" target="_blank" rel="noopener">🌊 Прилив (acqua alta)</a></div>`)}
function topWx(){const x=wxDay(day);$('#wx').textContent=x?`${WI(x.k)}${x.max}° ☔${x.p}%`:'погода…';
 const b=$('#banner');if(x&&x.p>=50){b.style.display='block';b.innerHTML=`☔ ${DAYS.find(d=>d[0]===day)[1]}: возможен дождь (до ${x.p}%). <a href="#" onclick="filt=new Set(['indoor']);chips();draw();return false">Показать места под крышей</a>`}else b.style.display='none'}
async function loadWx(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.437&longitude=12.334&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=Europe%2FRome&start_date=2026-10-31&end_date=2026-11-03');if(r.ok){wx=await r.json();wx._at=new Date().toLocaleString('ru-RU',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});LS.set('wx',wx)}}catch(e){wx=LS.get('wx',WX0)}topWx()}
