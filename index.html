<style>
:root{--bg:#fff;--fg:#1b1f24;--mut:#6a7380;--line:#e3e6ea;--acc:#1f3a5f;--ok:#2e7d32;--warn:#b26a00;--bad:#c62828;--free:#1565c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;margin:0;height:100%;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}
#map{position:fixed;inset:0;z-index:1}
#top{position:fixed;left:0;right:0;top:0;z-index:500;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:linear-gradient(#fffffff2,#ffffffd9);box-shadow:0 1px 6px #0002}
#row1{display:flex;gap:6px;align-items:center}
#days{display:flex;gap:4px;flex:1;overflow-x:auto}
.day{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 9px;font-size:13px;white-space:nowrap}
.day.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#wx{font-size:12.5px;color:var(--fg);padding:5px 8px;border-radius:14px;background:#eef3f8;white-space:nowrap}
#chips{display:flex;gap:5px;overflow-x:auto;margin-top:6px;padding-bottom:2px;scrollbar-width:none}
#chips::-webkit-scrollbar,#days::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 10px;font-size:13px;white-space:nowrap}
.chip.on{background:#ffe9b3;border-color:#e0b44c}
#banner{display:none;margin-top:6px;font-size:13px;background:#fff4e0;border:1px solid #f0c27a;border-radius:10px;padding:6px 8px}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:500;display:flex;gap:6px;justify-content:space-around;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:#fffffff2;box-shadow:0 -1px 6px #0002}
#dock button{flex:1;border:0;background:#f1f4f7;border-radius:12px;padding:8px 2px;font-size:12.5px;color:var(--fg)}
#dock button b{display:block;font-size:18px;font-weight:400}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:700;max-height:78dvh;overflow-y:auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 18px #0003;transform:translateY(105%);transition:transform .22s;padding:6px 14px calc(env(safe-area-inset-bottom) + 14px);-webkit-overflow-scrolling:touch}
#sheet.open{transform:none}
#sheet{overscroll-behavior:contain;touch-action:pan-y}
#top,#dock{touch-action:none}
#days,#chips{touch-action:pan-x;overscroll-behavior:contain}
#grab{width:40px;height:5px;border-radius:3px;background:#ccd;margin:4px auto 8px}
#x{position:sticky;top:0;float:right;border:0;background:#eef1f4;border-radius:50%;width:32px;height:32px;font-size:17px}
h2{font-size:19px;margin:2px 40px 2px 0}
.sub{color:var(--mut);font-size:13px;margin-bottom:6px}
.badge{display:inline-block;font-size:12.5px;border-radius:8px;padding:2px 7px;margin:2px 4px 2px 0;background:#eef1f4}
.s-open{background:#e6f4e7;color:var(--ok)}.s-free{background:#e3eefc;color:var(--free)}.s-only{background:#f3e5f5;color:#7b1fa2}
.s-warn{background:#fff3e0;color:var(--warn)}.s-closed{background:#fde8e8;color:var(--bad)}
.blk{margin:8px 0}.blk small{color:var(--mut)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.btn{flex:1 1 30%;text-align:center;text-decoration:none;color:#fff;background:var(--acc);border:0;border-radius:10px;padding:10px 6px;font-size:14px}
.btn.alt{background:#eef1f4;color:var(--fg)}
.btn.star{background:#fff4d6;color:#7a5600}
.src a{color:var(--mut);font-size:12px;word-break:break-all}
.photo{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin:4px 0}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.li .e{font-size:20px;width:26px;text-align:center}
.li .m{flex:1}.li .d{color:var(--mut);font-size:12.5px;white-space:nowrap}
.task{padding:9px 0;border-bottom:1px solid var(--line)}
.task label{display:flex;gap:8px;align-items:flex-start}
.task input{width:20px;height:20px;margin-top:1px}
.task a{color:var(--acc)}
.hours{display:flex;gap:4px;overflow-x:auto;padding:4px 0}
.h{min-width:44px;text-align:center;font-size:12px;background:#f3f6f9;border-radius:8px;padding:4px 2px}
.h.rain{background:#dceaf9}
.hours{touch-action:pan-x;overscroll-behavior:contain}
.pm{display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px #0006;font-size:15px}
.pm.fr{border:3px solid #ffc400;box-shadow:0 0 0 2px #fff,0 1px 6px #0008;position:relative}
.frb{position:absolute;top:-9px;right:-11px;font-size:13px;background:#ffc400;border-radius:50%;width:19px;height:19px;line-height:19px;text-align:center;border:1.5px solid #fff}
.frcard{background:#fff6d6;border:1px solid #ffd54f;border-radius:10px;padding:6px 9px;margin:4px 0 6px;font-size:14px}
.chip.friend{background:#fff6d6;border-color:#ffc400}
.pm.ma{border:3px solid #ff5fa2;box-shadow:0 0 0 2px #fff,0 1px 6px #0008;position:relative}
.mab{position:absolute;top:-9px;left:-11px;font-size:13px;background:#ffd1e6;border-radius:50%;width:19px;height:19px;line-height:19px;text-align:center;border:1.5px solid #fff}
.macard{background:#ffeef6;border:1px solid #ff9cc8;border-radius:10px;padding:6px 9px;margin:4px 0 6px;font-size:14px}
.chip.maria{background:#ffeef6;border-color:#ff5fa2}
.pm.closed{filter:grayscale(1);opacity:.55}
.pm.me{background:#1e88e5;width:16px!important;height:16px!important;border:3px solid #fff}
.leaflet-tooltip.lbl{background:#fffe;border:0;box-shadow:0 1px 3px #0004;font-size:11.5px;padding:1px 5px}
</style>

const PLACES = [{"id":1,"name":"Дом","lat":45.4941373,"lng":12.2618901,"cluster":"Местре · дом и рынок","cats":["home"],"indoor":0,"price":"Оплачено","addr":"Via Bissuola, Mestre","why":"Квартира. Заезд после 15:00, выезд 3.11 до 10:00. Это материк: до Piazzale Roma автобус 24/24H ~16 мин езды.","time":"","caveat":"","pin":"","links":[],"acc":"object","gq":null,"status":"home","checked":null,"photo":null,"days":{}},{"id":2,"name":"RePulse · барахолка","lat":45.4952467,"lng":12.243922,"cluster":"Местре · дом и рынок","cats":["market"],"indoor":0,"price":"Вход €0","addr":"Via San Girolamo, Mestre, Venezia, Italy","why":"Винтаж и модернариато: продать / купить / обменять (есть зона обмена baratto), музыка и dj. Не антиквариат высокого класса — именно покопаться. Рядом с домом: после рынка — трамвай T1 от Mestre Centro в Венецию.","time":"1 ноября 2026 — одна из 8 дат сезона (подтверждено календарём Comune). Часы на 2026 не опубликованы; в 2025 было 07:00–20:00. Via Caneve и Via San Girolamo, центр Местре.","caveat":"08:00–19:00 в найденной карточке относятся к 4 октября. Эти часы не перенесены на ноябрь.","pin":"Метка — ориентир на Via San Girolamo; ряды рынка занимают улицы San Girolamo / Caneve, это не отдельное здание.","links":["https://live.comune.venezia.it/index.php/it/2026/10/le-citta-festa-gli-appuntamenti-dal-30-ottobre-al-5-novembre","https://www.comune.venezia.it/content/repulse-4"],"acc":"area","gq":"RePulse Via San Girolamo Mestre","status":"warn","checked":"31.10 (live.comune.venezia.it, анонс сезона 2026)","photo":null,"days":{"1":{"s":"only","t":"Сегодня · выпуск подтверждён; часы 2025: 07:00–20:00"},"2":{"s":"closed","t":"Рынка нет"},"3":{"s":"closed","t":"Рынка нет"},"31":{"s":"closed","t":"Рынка нет"}}},{"id":3,"name":"Piazza Ferretto","lat":45.49379,"lng":12.24138,"cluster":"Местре · дом и рынок","cats":["walk","food"],"indoor":0,"price":"€0","addr":"Piazza Erminio Ferretto, Mestre, Venezia, Italy","why":"Пешеходный центр Местре для короткой прогулки, еды и местной жизни. Удобнее совместить с рынком или бытовыми покупками, чем специально возвращаться сюда посреди прогулки по островной Венеции.","time":"","caveat":"","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/terraferma"],"acc":"area","gq":"Piazza Erminio Ferretto Mestre","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Piazza_ferretto_a_mestre.jpg/960px-Piazza_ferretto_a_mestre.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Piazza_Erminio_Ferretto","photoNear":0},{"id":4,"name":"Bissuola Esiodo · автобус к Венеции","lat":45.4935,"lng":12.2641,"cluster":"Местре · дом и рынок","cats":["transport"],"indoor":0,"price":"€1,50/чел · карта tap&go","addr":"Bissuola Esiodo, Mestre, Venezia, Italy","why":"Автобусы 24 / 24H к Piazzale Roma; именно поездка обычно занимает около 16 минут. Выбирайте направление Venezia / Piazzale Roma, а не Tosatto или Rielta. На разных сторонах улицы одинаковое название остановки. От двери до исторического центра дольше: подход и ожидание добавляются.","time":"Воскресенье и праздник: рейсы реже; проверить отправление перед выходом.","caveat":"Старые 09:12 / 09:17 из переписки не являются вашим расписанием. Выход из квартиры — 09:30, следующий рейс смотрите по ссылке.","pin":"Метка — район пересечения Via Bissuola / Via Esiodo; точную сторону остановки в направлении Venezia сверяйте по указателям.","links":["https://andreafrison.com/app/mini-venice/en/lines/bus/24/","https://andreafrison.com/app/mini-venice/en/lines/bus/24h/","https://actv.avmspa.it/it/content/urbano-venezia-0"],"acc":"approx","gq":"Bissuola Esiodo bus stop Mestre","status":"warn","checked":"31.10 (ACTV/ATVO)","photo":null,"days":{"1":{"s":"warn","t":"Вс: раз в час — 09:12, 10:12, 11:12, 12:12…"},"2":{"s":"open","t":"24H каждые 20 мин: :17 :37 :57"},"3":{"s":"open","t":"24H каждые 20 мин"}}},{"id":5,"name":"Mestre Centro · трамвай T1","lat":45.4934714,"lng":12.2460979,"cluster":"Местре · дом и рынок","cats":["transport"],"indoor":0,"price":"€1,50/чел · карта tap&go","addr":"Mestre Centro Piazzale Cialdini Venezia Italy","why":"Точка пересадки после рынка и прогулки по центру Местре. На табло нужен T1 в сторону Venezia / Piazzale Roma. Городской билет €1,50 с человека, без водных линий. Время ближайшего трамвая проверяется в навигации.","time":"","caveat":"","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://actv.avmspa.it/it/content/urbano-venezia-0"],"acc":"area","gq":"Mestre Centro tram stop","status":"free","checked":"31.10 (ACTV/ATVO)","photo":"https://upload.wikimedia.org/wikipedia/commons/f/fe/Mestre_tram.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled","days":{"1":{"s":"open","t":"T1 ≈ каждые 15 мин"},"2":{"s":"open","t":"T1 ≈ каждые 10 мин"}},"photoPage":"https://commons.wikimedia.org/wiki/File:Mestre_tram.png","photoNear":0},{"id":6,"name":"Parco Alfredo Albanese / Bissuola","lat":45.49915,"lng":12.26248,"cluster":"Местре · дом и рынок","cats":["nature"],"indoor":0,"price":"€0","addr":"Parco Alfredo Albanese, Mestre, Venezia, Italy","why":"Зелень и короткая прогулка рядом с квартирой. Это парк у дома, а не отдельная главная достопримечательность. Подходит, когда не хочется ехать на остров сразу после завтрака.","time":"","caveat":"Ориентируйтесь на открытые входы и таблички парка; не рассчитывайте на ночной доступ.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/giardini-parchi-oasi-naturali/parco-alfredo-albanese"],"acc":"area","gq":"Parco Alfredo Albanese Mestre","status":"free","checked":null,"photo":null,"days":{}},{"id":7,"name":"Parco San Giuliano","lat":45.4743271,"lng":12.2760376,"cluster":"Местре · дом и рынок","cats":["nature"],"indoor":0,"price":"Прогулка €0","addr":"Parco San Giuliano, Mestre, Venezia, Italy","why":"Большой парк у лагуны; вариант для открытого пространства и велопрогулки. Это отдельный материковый выход. На ветер и дождь место менее удачное. Велопрокат и парковочные зоны проверяются в RideMovi; конкретную цену приложения здесь не обещаем.","time":"","caveat":"Не соединяйте пешком с островными районами ради экономии: дорога через мост — не короткая прогулка. Прокат не включён в бесплатные занятия.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/giardini-parchi-oasi-naturali/parco-san-giuliano"],"acc":"area","gq":"Parco San Giuliano Mestre","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Parco_san_giuliano.JPG/960px-Parco_san_giuliano.JPG?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Parco_San_Giuliano","photoNear":0},{"id":8,"name":"Forte Marghera","lat":45.47511,"lng":12.26196,"cluster":"Местре · дом и рынок","cats":["hidden"],"indoor":0,"price":"Доступ уточнить","addr":"Forte Marghera, Mestre, Venezia, Italy","why":"Старые военные корпуса, вода и зелень — резерв под интерес к промышленным местам. Интересна территория бывшего форта. Это не разрешение ходить в закрытые здания. Летние бары и события не переносим на ноябрь.","time":"Доступ территории и отдельных корпусов на ваши даты не подтверждён.","caveat":"Не ехать специально без свежей проверки. Часть объектов может быть закрыта или на ремонте.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.spottedbylocals.com/venice/forte-marghera/"],"acc":"area","gq":"Forte Marghera","status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wi la Nera рядом с Риальто. Карта ведёт к улице, не к гарантированному точному месту съёмки. Сверьте арку по вашему кадру.","time":"","caveat":"Геометка Instagram возле San Giovanni Evangelista неверна для этого ориентира. Помост используется лодками; не мешать посадке и не заходить в закрытые зоны.","pin":"Метка показывает переулок Calle dell’Aquila Nera. Точный помост из ролика не геодезически подтверждён: ищите арочный выход к воде, а не ресторанный стол.","links":["https://vie.openalfa.it/vie/calle-dell-aquila-nera-san-marco-venezia-murano-burano-venezia"],"acc":"approx","gq":null,"status":"free","checked":null,"photo":null,"days":{}},{"id":25,"name":"Palazzo Bembo","lat":45.4370389,"lng":12.3350667,"cluster":"Риальто и Мираколи","cats":["art","free"],"indoor":1,"price":"Вход €0","addr":"Palazzo Bembo, Riva del Carbon 4793, Venezia, Italy","why":"Японские инсталляции, JoJo и окна на Гранд-канал. Personal Structures — отдельная бесплатная выставка, а не платные Giardini / Arsenale. Можно выбрать несколько залов вместо полного обхода.","time":"10:00–18:00 · вторник закрыто · до 22 ноября.","caveat":"1–2 ноября подходят; 3 ноября закрыто. Проверяйте вход в выставку, а не в отель с похожим названием.","pin":"","links":["https://mangaart.jp/exhibitions/ps2026-venice","https://brand.b-ownd.com/en/venice2026/"],"acc":"object","gq":"Palazzo Bembo Venezia","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Palais_Bembo.jpg/960px-Palais_Bembo.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"3":{"s":"closed","t":"Вт закрыто"},"1":{"s":"free","t":"10:00–18:00 · вход свободный"},"2":{"s":"free","t":"10:00–18:00 · вход свободный"}},"photoPage":"https://it.wikipedia.org/wiki/Palazzo_Bembo","photoNear":0},{"id":26,"name":"San Salvador · хор и орган","lat":45.43669,"lng":12.33654,"cluster":"Риальто и Мираколи","cats":["art","free"],"indoor":1,"price":"€0","addr":"Chiesa di San Salvado о когда действительно торгуют. Не заменяет RePulse. Рыбная часть не работает в воскресенье и понедельник. Во вторник возможна утром, но это уже ваш день вылета.","time":"Рыба: вт–сб утром · 1 и 2 ноября рыбные ряды закрыты.","caveat":"В понедельник могут работать овощные продавцы; праздничный состав торговли не подтверждён.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.cntraveler.com/shops/venice/mercato-di-rialto"],"acc":"area","gq":"Mercato di Rialto","status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Pescaria_Rialto_Venice.jpg/960px-Pescaria_Rialto_Venice.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"closed","t":"Рыбные ряды закрыты"},"2":{"s":"warn","t":"Рыбы нет, овощи — может быть"},"3":{"s":"open","t":"Утром рынок работает"}},"photoPage":"https://commons.wikimedia.org/wiki/File:Pescaria_Rialto_Venice.jpg","photoNear":0},{"id":30,"name":"Scala Contarini del Bovolo","lat":45.43481,"lng":12.33455,"cluster":"Сан-Марко · виды и крипта","cats":["hidden","photo"],"indoor":0,"price":"Снаружи €0 · подъём €7/чел до 13.11 (€14 на двоих)","addr":"Scala Contarini del Bovolo, San Marco 4297, Venezia, Italy","why":"Спиральная лестница в маленьком дворе — найти, посмотреть снизу и сфотографироваться. В базовом варианте — осмотр снаружи, без подъёма. Платный подъём выбирайте на месте по актуальной цене и очереди.","time":"","caveat":"Расписания подъёма в сторонних источниках расходятся. Доступ в двор может ограничиваться воротами; подъём не включён в бесплатный осмотр.","pin":"","links":["https://www.spottedbylocals.com/venice/scala-contarini-del-bovolo/"],"acc":"object","gq":"Scala Contarini del Bovolo","status":"warn","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Scala_Contarini_del_Bovolo_%28Venice%29.jpg/960px-Scala_Contarini_del_Bovolo_%28 ть на 2 ноября.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://www.comune.venezia.it/it/content/murano-illumina-il-mondo-1"],"acc":"area","gq":"Procuratie Vecchie Venezia","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Venezia_piazza_s.Marco.JPG/960px-Venezia_piazza_s.Marco.JPG?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"only","t":"Последний день · смотреть с аркады в любое время"},"2":{"s":"closed","t":"Выставка закончилась"},"3":{"s":"closed","t":"Выставка закончилась"}},"photoPage":"https://it.wikipedia.org/wiki/Procuratie","photoNear":0},{"id":33,"name":"Ponte della Paglia и Riva degli Schiavoni","lat":45.43365,"lng":12.341,"cluster":"Сан-Марко · виды и крипта","cats":["photo","water"],"indoor":0,"price":"€0","addr":"Ponte della Paglia, Venezia, Italy","why":"Мост Вздохов снаружи, лодки и длинный открытый вид на лагуну. Можно продолжить по набережной в сторону Marinaressa. Для фотографий остановиться там, где не перекрываете поток людей.","time":"","caveat":"","pin":"","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/castello-arte-navale-e-tradizioni"],"acc":"object","gq":"Ponte della Paglia Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/Venice%2C_Riva_degli_Schiavoni_2005.jpg/960px-Venice%2C_Riva_degli_Schiavoni_2005.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Ponte_della_Paglia","photoNear":0},{"id":34,"name":"San Zaccaria · крипта","lat":45.43471,"lng":12.3436,"cluster":"Сан-Марко · виды и крипта","cats":["hidden"],"indoor":1,"price":"Церковь €0 · крипта €1,5–3/чел","addr":"Chiesa di San Zaccaria, Venezia, Italy","why":"Небольшое подземное помещение с колоннами и отражениями в воде. В отзывах билет в часовни и крипту — tina. Местная легенда связывает красный камень с остановившейся чумой; это легенда, не исторический факт.","time":"","caveat":"Не выбирать одноимённую Corte Nova в Cannaregio. Если навигатор показывает другой район, сверить название Calle Zorzi.","pin":"","links":["https://www.conoscerevenezia.it/?p=49667"],"acc":"approx","gq":null,"status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Sotoportego_de_la_Corte_Nova_oder_auch_Sotoportego_de_la_peste-2025-msu-6195-.jpg/960px-Sotoportego_de_la_Corte_Nova_oder_auch_Sotoportego_de_la_peste-2025-msu-6195-.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{},"photoPage":"https://commons.wikimedia.org/wiki/File:Sotoportego_de_la_Corte_Nova_oder_auch_Sotoportego_de_la_peste-2025-msu-6195-.jpg","photoNear":0},{"id":40,"name":"San Francesco della Vigna · дворы","lat":45.43822,"lng":12.34808,"cluster":"Кастелло · дворы и Арсенал","cats":["hidden"],"indoor":0,"price":"При открытом доступе €0","addr":"Chiesa di San Francesco della Vigna, Venezia, Italy","why":"Тихие аркады, старые стены и спокойная пауза среди города. Местная фотограф описывает монастырские дворы как место, куда приходит отдыхать с мужем. Для нас это необязательный короткий заход.","time":"Доступ во дворы на конкретные часы не подтверждён.","caveat":"Не путать со специальными платными посещениями виноградника. Закрытые двери и служебные зоны не обходить.","pin":"","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city"],"acc":"object","gq":"Chiesa di San Francesco della Vigna","status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Facade_of_San_Francesco_della_Vigna_%28Venice%29.jpg/960px-Facade_of_San_Francesco_della_Vigna_%28Venice%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Francesco_della_Vigna","photoNear":0},{ ороткий переход между уютными площадями. По пути к San Trovaso. Любые работающие лавки и лодки рядом — бонус, а не обещанная программа.","time":"","caveat":"","pin":"","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/dorsoduro-sestiere-d-arte"],"acc":"object","gq":"Ponte dei Pugni Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Ponte_dei_pugni_%28Venice%29.jpg/960px-Ponte_dei_pugni_%28Venice%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Ponte_dei_Pugni","photoNear":0},{"id":51,"name":"Squero di San Trovaso · снаружи","lat":45.43034,"lng":12.32586,"cluster":"Дорсодуро · верфь и набережная","cats":["water","hidden"],"indoor":0,"price":"Вид с берега €0","addr":"Squero di San Trovaso, Venezia, Italy","why":"Посмотреть на деревянные постройки и гондолы действующей верфи. Нужен вид с противоположной общественной набережной. Это не бесплатная экскурсия внутрь мастерской.","time":"","caveat":"Работу мастеров в праздник не гарантируем. Не заходить в рабочий двор и не мешать людям.","pin":"Координаты обозначают саму верфь. Смотреть нужно с общедоступной противоположной набережной Fondamenta Nani, не заходить на рабочую территорию.","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/dorsoduro-sestiere-d-arte"],"acc":"object","gq":"Squero di San Trovaso","status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Squero_di_San_Trovaso_%28Venice%29-msu-2021-5474-.jpg/960px-Squero_di_San_Trovaso_%28Venice%29-msu-2021-5474-.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Squero_di_San_Trovaso","photoNear":0},{"id":52,"name":"Osteria Al Squero","lat":45.4301,"lng":12.32616,"cluster":"Дорсодуро · верфь и набережная","cats":["food"],"indoor":1,"price":"cicchetti €2,50 · spritz €3,50 → ≈ €11–13 на двоих","addr":"Osteria Al Squero, Dorsoduro 943, Venezia, Italy","why":"Чиккетти рядом с видом на верфь — по желанию вместо полноценного обеда. Ориентир суммы на двоих, не фиксированный сет. Маленькие закуски могут незаметно набрать ресторанный чек.","time":"Часы на конкретный день сверить; понедельник заявлялся 10:00–21:00.","caveat":"Не рассчитывать на долгую посадку. При очереди есть пицца у Santa Margherita или другие места по текущему меню.","pin":"","links":["https://www.alsquero.it/"],"acc":"object","gq":"Osteria Al Squero Venezia","status":"warn","checked":"31.10 (сайты, TripAdvisor, OSM)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Venezia_-_Dorsoduro_-_Squero_di_San_Trovaso.jpg/960px-Venezia_-_Dorsoduro_-_Squero_di_San_Trovaso.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{"1":{"s":"closed","t":"Вс закрыто (сайт)"},"2":{"s":"open","t":"10:00–20:30"}},"photoPage":"https://commons.wikimedia.org/wiki/File:Venezia_-_Dorsoduro_-_Squero_di_San_Trovaso.jpg","photoNear":1},{"id":53,"name":"Ponte dell’Accademia","lat":45.43166,"lng":12.32891,"cluster":"Дорсодуро · верфь и набережная","cats":["photo"],"indoor":0,"price":"€0","addr":"Ponte dell’Accademia, Venezia, Italy","why":"Вид по Гранд-каналу в сторону Salute и переход в район San Marco. Фототочка на обычном пешеходном мосту. Не требует музейного билета и не зависит от работы галереи.","time":"","caveat":"","pin":"","links":["https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/dorsoduro-sestiere-d-arte"],"acc":"object","gq":"Ponte dell'Accademia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Accademia_bridge_in_Venice_%28South_East_exposure%29.jpg/960px-Accademia_bridge_in_Venice_%28South_East_exposure%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Ponte_dell%27Accademia","photoNear":0},{"id":54,"name":"G naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city"],"acc":"area","gq":"Zattere Venezia","status":"free","checked":null,"photo":"https://upload.wikimedia.org/wikipedia/commons/a/a0/Huck_and_jim_on_raft.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","days":{},"photoPage":"https://it.wikipedia.org/wiki/Zattera","photoNear":0},{"id":56,"name":"Santa Maria della Salute · снаружи","lat":45.43057,"lng":12.33472,"cluster":"Дорсодуро · верфь и набережная","cats":["photo"],"indoor":0,"price":"Снаружи €0","addr":"Basilica di Santa Maria della Salute, Venezia, Italy","why":"Посмотреть купол и фасад со стороны набережной и узких улочек. Бесплатная карточка относится к внешнему виду. Ризница, выставки и отдельные внутренние пространства не включены.","time":"","caveat":"","pin":"","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city","https://www.veneziaunica.it/it/cosa-fare-a-venezia/itinerari/dorsoduro-sestiere-d-arte"],"acc":"object","gq":"Basilica di Santa Maria della Salute","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Venice_city_scenes_-_on_the_Grand_Canal_-_Polizia%21_%2811002248065%29.jpg/960px-Venice_city_scenes_-_on_the_Grand_Canal_-_Polizia%21_%2811002248065%29.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{},"photoPage":"https://it.wikipedia.org/wiki/Basilica_di_Santa_Maria_della_Salute","photoNear":0},{"id":57,"name":"Punta della Dogana · мыс","lat":45.43095,"lng":12.33709,"cluster":"Дорсодуро · верфь и набережная","cats":["photo","water"],"indoor":0,"price":"Набережная €0","addr":"Punta della Dogana, Venezia, Italy","why":"Открытый вид на воду между San Marco и Giudecca. Здесь имеется в виду внешняя набережная, не платная художественная выставка внутри здания. Можно закончить прогулку короткой переправой Dogana, если она работает.","time":"","caveat":"У воды нет ощущения тёплого закрытого дворика; ò и постепенно вернуться к Piazzale Roma. Закрытые портовые и служебные территории не входят в маршрут.","time":"","caveat":"","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://naturallyepicurean.substack.com/p/a-photographers-guide-to-the-city"],"acc":"area","gq":"Campo Santa Marta Venezia","status":"free","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Chiesa_di_Santa_Marta_-_Venezia.jpg/960px-Chiesa_di_Santa_Marta_-_Venezia.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","days":{},"photoPage":"https://commons.wikimedia.org/wiki/File:Chiesa_di_Santa_Marta_-_Venezia.jpg","photoNear":0},{"id":60,"name":"San Michele · островное кладбище","lat":45.446979999999996,"lng":12.346300000000001,"cluster":"Сан-Микеле · только на лодке","cats":["walk","nature"],"indoor":0,"price":"Вход €0","addr":"Cimitero di San Michele, Venezia, Italy","why":"Кипарисы, кирпичные стены и короткая прогулка между двумя поездками на лодке. Не главная цель поездки и не заброшка. 1–2 ноября здесь поминальные дни: спокойно гулять, не мешать семьям, без постановочных фото на могилах.","time":"30 октября — 2 ноября: 07:30–17:00.","caveat":"Пешего мостика в город нет. Заранее сверяйте обратную DE; 3 ноября бесплатная акция уже закончилась.","pin":"Метка обозначает объект или участок площади/парка; фактический вход может находиться сбоку.","links":["https://veneto.piazzainfesta.it/en/venezia/allerseelen-2026-98791","https://muoversi.venezia.it/it/content/commemorazione-dei-defunti-servizi-gratuiti-e-fermata-straordinaria-di-linea-13"],"acc":"area","gq":"Cimitero di San Michele Venezia","status":"ok","checked":"31.10 (официальные сайты)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/San_Michele_cemetery_island%2C_Venice.jpg/960px-San_Michele_cemetery_island%2C_Venice.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail"," ":"Акция закончилась"}},"photoPage":"https://commons.wikimedia.org/wiki/File:SAN_MICHELE_-_vaporetto_stop.jpg","photoNear":0},{"id":62,"name":"Fondamente Nove B · короткая DE","lat":45.44317,"lng":12.34066,"cluster":"Сан-Микеле · только на лодке","cats":["water"],"indoor":0,"price":"€0 в даты акции","addr":"Fondamente Nove vaporetto stop, Venezia, Italy","why":"Самая короткая связка город ↔ Сан-Микеле, когда не нужен длинный маршрут. Сам причал находится в городе, в северном Каннареджо. Здесь он вынесен в группу острова, чтобы видеть связь по воде.","time":"31.10–02.11: из F.te Nove B 09:05–17:05, каждые 20 минут.","caveat":"Обратно Cimitero B: 09:15–17:15, каждые 20 минут. Проверять табло и именно обозначение DE.","pin":"","links":["https://muoversi.venezia.it/it/content/commemorazione-dei-defunti-servizi-gratuiti-e-fermata-straordinaria-di-linea-13"],"acc":"object","gq":"Fondamente Nove vaporetto","status":"ok","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Fondamenta_Nuove_-_panoramio.jpg/960px-Fondamenta_Nuove_-_panoramio.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"free","t":"DE каждые 20 мин 09:05–17:05"},"2":{"s":"free","t":"DE каждые 20 мин 09:05–17:05"},"31":{"s":"free","t":"DE каждые 20 мин 09:05–17:05"},"3":{"s":"closed","t":"Акция закончилась"}},"photoPage":"https://it.wikipedia.org/wiki/Fondamente_Nove","photoNear":0},{"id":63,"name":"Мощи святого Николая · San Nicolò al Lido","lat":45.42793,"lng":12.38085,"cluster":"Лидо · мощи святого Николая","cats":["saint"],"indoor":1,"price":"Доступ к святыне уточнить в приходе","addr":"Chiesa di San Nicolò al Lido, Riviera San Nicolò 26, 30126 Venezia, Italy","why":"Важная личная остановка: храм с частью мощей святого Николая на отдельном острове Лидо. Именно San Nicolò al Lido, не San Nicolò dei Mendicoli в Дорсодуро. Посетители пишут, что к реликвиям за алтарём проводили по просьбе. Это не гарантирует возможность физически прикоснуться к мощам или раке: заранее уточнить у служителя. От Lido S.M.E. к храму можно идти вдоль набережной; маршрут открыть кнопкой ниже. Мощи — небольшие фрагменты (основная часть в Бари); по источникам лежат **под главным алтарём**, за алтарём — надпись и латунная табличка о признании 1992 г.","time":"Источники расходятся: «пн–сб 10:30–17:00» (справочники) и «каждый день 15:00–17:00» (отзыв апреля 2026). Воскресная месса 11:15 (сезон 25.09–7.12). 2 ноября мессы нет. **Самое надёжное окно — 15:00–16:30 или месса в вс 11:15; сначала позвонить.** **Самый надёжный слот — вс 1.11 после мессы, около 12:15.** От Lido S.M.E. ~30 мин пешком. Телефон прихода подтверждён тремя источниками.","caveat":"**Не обязательно — по пути.** Лидо — отдельный остров: заезжать удобно, только если едете бесплатной DE к San Michele (она идёт дальше на Лидо через San Pietro). Перед поездкой позвонить: «Vorrei venerare le reliquie di San Nicola. È possibile avvicinarsi al reliquiario?» Прикосновение не обещано.","pin":"","links":["https://mapcarta.com/W140950703"],"acc":"object","gq":"Chiesa di San Nicolò al Lido","status":"warn","checked":"31.10 (orarimesse.it, dindondan, stnicholascenter.org, отзывы)","photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Venezia_-_Chiesa_di_S.Nicol%C3%B2.JPG/960px-Venezia_-_Chiesa_di_S.Nicol%C3%B2.JPG?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"open","t":"Месса 11:15 → после ~12:15 надёжнее всего"},"2":{"s":"warn","t":"Мессы нет; часы: 10:30–17:00 или 15:00–17:00 — позвонить"},"3":{"s":"warn","t":"часы не подтверждены"}},"photoPage":"https://it.wikipedia.org/wiki/Chiesa_di_San_Nicol%C3%B2_%28Venezia%2C_Lido%29","photoNear":0},{"id":64,"name":"Lido S.M.E. E · бесплатная DE","lat":45.41737,"lng":12.36751,"cluster":"Лидо · мощи святого Николая","cats":["water"],"indoor":0,"price":"€0 на DE 31.10–02.11","addr":"Lido Santa Maria Elisabetta E, Venezia, Italy","why":"Причал бесплатного рейса к Сан-Микеле через San Pietro и Celestia. Отсюда можно идти к храму на Лидо. DE с Cimitero A приходит на Lido S.M.E. через San Pietro di Castello. Из Cimitero A: 10:40, 11:40, 12:40, 14:40, 15:40, 16:40. Время прибытия на Лидо в объявлении не указано. Обычные линии не бесплатны.","time":"Из Lido S.M.E. E: 10:10, 11:10, 12:10, 14:10, 15:10, 16:10. Только 31 октября – 2 ноября 2026","caveat":"Это S.M.E., а не San Nicolò. К храму ещё идти. Последняя опубликованная бесплатная DE обратно 16:10; обычный вапоретто после неё оплачивается. Перед посадкой проверить табло и буквенный причал.","pin":"","links":["https://mapcarta.com/N4212293011"],"acc":"object","gq":"Lido Santa Maria Elisabetta vaporetto","status":"warn","checked":null,"photo":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/Lido_Aug_2020_2.jpg/960px-Lido_Aug_2020_2.jpg?utm_source=it.wikipedia.org&utm_campaign=api&utm_content=thumbnail","days":{"1":{"s":"free","t":"DE от Лидо: 10:10 11:10 12:10 14:10 15:10 16:10"},"2":{"s":"free","t":"DE от Лидо: 10:10 11:10 12:10 14:10 15:10 16:10"},"31":{"s":"free","t":"DE от Лидо: 10:10 11:10 12:10 14:10 15:10 16:10"},"3":{"s":"closed","t":"Акция закончилась"}},"photoPage":"https://it.wikipedia.org/wiki/Lido_di_Venezia","photoNear":0},{"id":65,"name":"Lido San Nicolò · другой причал","lat":45.42618,"lng":12.37849,"cluster":"Лидо · мощи святого Николая","cats":["water"],"indoor":0,"price":"Тариф и маршрут проверить","addr":"Lido San Nicolo ferry terminal, Venezia, Italy","why":"Ближе к храму, но это НЕ причал прибытия бесплатной DE из нашего плана. Ориентир, чтобы не путать два места посадки на Лидо. Для нашего бесплатного рейса использовать Lido Santa Maria Elisabetta. Поездка через San Nicolò требует отдельной проверки подходящей линии.","time":"По расписанию выбранной линии.","caveat":"Не планируйте DE от этого причала: в объявлении указан Lido S.M.E. E.","pin":"","links":["https://mapcarta.com/N27241169"],"acc":"area","gq":"Lido San Nicolò ferry","status":"ok","checked":null,"photo":nul  return L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],html:`<div class="pm ${i&&i.s==='closed'?'closed':''} ${fr?'fr':''} ${ma&&!fr?'ma':''}" style="width:${sz}px;height:${sz}px;background:${home?'#fff':c};${fav.has(p.id)?'outline:3px solid #ffb300;':''}">${e}${fr?'<span class="frb">💬</span>':''}${ma?'<span class="mab">🐱</span>':''}</div>`})}
function draw(){layer.clearLayers();PLACES.forEach(p=>{if(!visible(p))return;const m=L.marker([p.lat,p.lng],{icon:icon(p),zIndexOffset:p.cats.includes('home')?1000:star(p)?500:0}).on('click',()=>openPlace(p.id));if(map.getZoom()>=16||p.cats.includes('home')||(star(p)&&map.getZoom()>=15))m.bindTooltip((isMa(p)?'🐱 ':'')+(isF(p)?'💬 ':'')+p.name.split(' · ')[0].split(' (')[0],{permanent:true,direction:'bottom',offset:[0,12],className:'lbl'});m.addTo(layer)})}
map.on('zoomend',draw);

function sheet(html){$('#sc').innerHTML=html;$('#sheet').classList.add('open');$('#sheet').scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('open');sel=null}
$('#x').onclick=closeSheet;
let lastGesture=0;const gest=()=>{lastGesture=Date.now()};
map.on('zoomstart movestart',gest);

// iOS: block page pinch-zoom and pull-down bounce (in-app browsers close/minimise on it); map and scroll areas keep their own gestures
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
let tY=0,tX=0;document.addEventListener('touchstart',e=>{if(e.touches.length>1)gest();tY=e.touches[0].clientY;tX=e.touches[0].clientX},{passive:true});
document.addEventListener('touchmove',e=>{if(e.touches.length>1){if(!e.target.closest('#map'))e.preventDefault();gest();return}
 const s=e.target.closest('#sheet');if(s){const dy=e.touches[0].clientY-tY,dx=e.touches[0].clientX-tX;if(!e.target.closest('.hours')&&s.scrollTop<=0&&dy>0&&dy>Math.abs(dx))e.preventDefault();return}
 if(e.target.closest('#map,#days,#chips'))return;e.preventDefault()},{passive:false});

function badge(i){return i?`<span class="badge s-${i.s}">${DAYS.find(d=>d[0]===day)[1]}: ${esc(i.t)}</span>`:''}
function openPlace(id){const p=PLACES.find(x=>x.id===id);sel=id;const i=dayInfo(p);
 let h=`<h2>${p.emo?p.emo+' ':CATS[p.cats[0]]?CATS[p.cats[0]][0]+' ':''}${esc(p.name)}</h2><div class="sub">${esc(p.cluster)} · ${esc(p.addr)}</div>`;
 if(isMa(p))h+=`<div class="macard">🐱 <b>Хочу сюда</b>${p.mariaLabel?`: «${esc(p.mariaLabel)}»`:''}</div>`;
 if(isF(p))h+=`<div class="frcard">💬 <b>Советовал друг</b>${p.friendLabel&&!/без/.test(p.friendLabel)?`: «${esc(p.friendLabel)}»`:''}</div>`;
 h+=`<div><span class="badge">💶 ${esc(p.price)}</span>${badge(i)}${p.indoor?'<span class="badge">🏠 под крышей</span>':''}${me?`<span class="badge">🚶 ~${fmtT(walkM(me,p))}</span>`:''}</div>`;
 if(p.photo)h+=`<div><img class="photo" src="${esc(p.photo)}" alt="" onerror="this.parentNode.remove()">${p.photoPage?`<div class="src"><a href="${esc(p.photoPage)}" target="_blank" rel="noopener">${p.photoNear?'фото места рядом':'источник фото'}</a></div>`:''}</div>`;
 h+=`<div class="btns"><a class="btn" href="${gmaps(p)}" target="_blank" rel="noopener">Google Maps</a><a class="btn alt" href="${walk(p)}" target="_blank" rel="noopener">🚶 Пешком</a><a class="btn alt" href="${transit(p)}" target="_blank" rel="noopener">⛴ Транспорт</a><button class="btn star" onclick="toggleFav(${p.id})">${fav.has(p.id)?'★ В дне':'☆ В мой день'}</button></div>`;
 if(p.why)h+=`<div class="blk">${md(p.why)}</div>`;
 if(p.time)h+=`<div class="blk"><small>Время</small><br>${md(p.time)}</div>`;
 const other=DAYS.filter(d=>d[0]!==day&&(p.days||{})[d[0]]).map(d=>`<span class="badge s-${p.days[d[0]].s}">${d[1]}: ${esc(p.days[d[0]].t)}</span>`).join('');
 if(other)h+=`<div class="blk"><small>Другие дни</small><br>${other}</div>`;
 if(p.caveat)h+=`<div class="blk"><small>⚠️ Учесть</small><br>${md(p.caveat)}</div>`;
 if(p.pin)h+=`<div class="blk"><small>📍 Где именно</small><br>${md(p.pin)}</div>`;
 if(p.checked)h+=`<div class="blk"><small>Проверено ${esc(p.checked)}</small></div>`;
 if(p.links&&p.links.length)h+=`<div class="blk src"><small>Источники</small><br>${p.links.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/,'').slice(0,60))}</a>`).join('<br>')}</div>`;
 sheet(h);const c=map.project([p.lat,p.lng]).add([0,Math.round(window.innerHeight*0.27)]);map.panTo(map.unproject(c))}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);if(!fav.has(id)){} else {const so=LS.get('ord',null);if(so&&!so.includes(id))LS.set('ord',null)}LS.set('fav',[...fav]);draw();if(sel===id)openPlace(id)}

function listHtml(arr,from){return arr.map(p=>{const i=dayInfo(p);return `<div class="li" onclick="openPlace(${p.id})"><div class="e">${p.emo||(CATS[p.cats[0]]||['•'])[0]}</div><div class="m"><b>${isMa(p)?'🐱 ':''}${isF(p)?'💬 ':''}${esc(p.name)}</b><br><small>${esc(p.price)}</small> ${i?`<span class="badge s-${i.s}">${esc(i.t)}</span>`:''}</div><div class="d">${from?(isExact(from,p)?'':'~')+fmtD(walkM(from,p))+'<br>'+fmtT(walkM(from,p)):''}</div></div>`}).join('')}
function near(){if(!navigator.geolocation){sheet('<h2>Геолокация недоступна</h2>');return}
 sheet('<h2>📍 Ищу тебя…</h2><div class="sub">Разреши доступ к геопозиции в Safari.</div>');
 navigator.geolocation.getCurrentPosition(pos=>{me={lat:pos.coords.latitude,lng:pos.coords.longitude};
  if(meMarker)meMarker.remove();meMarker=L.marker([me.lat,me.lng],{icon:L.divIcon({className:'',html:'<div class="pm me"></div>',iconSize:[16,16]})}).addTo(map);
  liveW={};const cand=PLACES.filter(p=>!p.cats.includes('home')&&!p.cats.includes('transport')&&visible(p)).sort((a,b)=>dist(me,a)-dist(me,b)).slice(0,40);
  map.setView([me.lat,me.lng],16);
  const show=ok=>{const arr=[...cand].sort((a,b)=>walkM(me,a)-walkM(me,b)).slice(0,25);sheet(`<h2>📍 Рядом с тобой</h2><div class="sub">${ok?'Метры — настоящий путь пешком по улицам и мостам.':'Считаю путь по улицам… пока ≈ прямая ×1,4 («~»).'} Закрытое в выбранный день — помечено. Лодочные точки — нужна лодка.</div>${listHtml(arr,me)}`)};
  show(false);loadLive(cand).then(ok=>{if(ok)show(true)})},
  e=>sheet(`<h2>Не получилось</h2><div class="sub">${esc(e.message)}. Настройки → Safari → Геопозиция → «Спрашивать».</div>`),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
function myDay(){const arr=PLACES.filter(p=>fav.has(p.id));
 if(!arr.length){sheet('<h2>⭐ Мой день</h2><div class="sub">Пока пусто. Открой точку и нажми «☆ В мой день» — здесь соберётся порядок обхода, км и что закрыто.</div>'+tplHtml());return}
 // groups: Mestre (from home), Venice walk (from Piazzale Roma or me), islands (boat) — km only within walking groups
 const isM=p=>p.cluster==='Местре · дом и рынок',isI=p=>/Сан-Микеле|Лидо/.test(p.cluster)&&p.id!==62;
 const nn=(start,pts)=>{let cur=start,left=[...pts],o=[],k=0;while(left.length){left.sort((a,b)=>walkM(cur,a)-walkM(cur,b));const n=left.shift();k+=walkM(cur,n);o.push(n);cur=n}return [o,k]};
 const home=PLACES.find(p=>p.id===1),proma=PLACES.find(p=>p.id===9);
 const meInV=me&&dist(me,proma)<4000;
 const [om,km1]=nn(home,arr.filter(p=>isM(p)&&p.id!==1));
 const [ov,km2]=nn(meInV?me:proma,arr.filter(p=>!isM(p)&&!isI(p)&&p.id!==9));
 const oi=arr.filter(isI);
 let ord=[...om,...(om.length&&ov.length?[proma]:[]),...ov,...oi];let km=km1+km2;
 const so=LS.get('ord',null);
 let byT=false;if(so&&arr.every(p=>so.includes(p.id))){byT=true;ord=so.map(i=>arr.find(p=>p.id===i)).filter(Boolean);km=0;for(let i=1;i<ord.length;i++){const a=ord[i-1],b=ord[i];const ga=isM(a)?0:isI(a)?2:1,gb=isM(b)?0:isI(b)?2:1;const lido=x=>/Лидо/.test(x.cluster);if(ga===gb&&(ga!==2||(lido(a)&&lido(b))))km+=walkM(a,b)}}
 const closed=ord.filter(p=>(dayInfo(p)||{}).s==='closed');
 sheet(`<h2>⭐ Мой день · ${DAYS.find(d=>d[0]===day)[1]}</h2><div class="sub">${om.length?'Местре от дома → автобус/трамвай до Piazzale Roma → ':''}по Венеции ${byT?'в порядке подсказки':'от '+(meInV?'тебя':'Piazzale Roma')+' по ближайшему'}${oi.length?' → острова на лодке DE':''}: <b>${(km/1000).toFixed(1)} км пешком</b> (цель ~10, максимум 15${km>15000?' — <b style="color:#c62828">много, убери пару точек</b>':''}). ${closed.length?'<b style="color:#c62828">Закрыто в этот день: '+closed.map(p=>esc(p.name)).join(', ')+'</b>':''}</div>${listHtml(ord,null)}<div class="btns"><a class="btn" target="_blank" rel="noopener" href="${routeUrl(ord)}">Весь маршрут в Google Maps</a><button class="btn alt" onclick="fav.clear();LS.set('fav',[]);LS.set('ord',null);draw();myDay()">Очистить</button></div>`+tplHtml())}
function routeUrl(ord){const pts=ord.slice(0,10);if(!pts.length)return '#';const d=pts[pts.length-1],w=pts.slice(0,-1).map(p=>p.lat+','+p.lng).join('|');return 'https://www.google.com/maps/dir/?api=1&travelmode=walking&destination='+d.lat+','+d.lng+(w?'&waypoints='+encodeURIComponent(w):'')}
const TPL = {"31":{"text":"Прилёт 17:45 в Тревизо → **Barzi 18:15 (билет уже есть; дальше 19:30, 20:05)** → Mestre FS, остановка C4, ~18:45 → дом (~2,7 км, автобус или 35 мин пешком). По пути — продукты на завтрак (Pam / In’s Mercato в центре Местре).","ids":[1]},"1":{"text":"**Праздник, днём возможны ливни.** Утро — барахолка RePulse в Местре → трамвай T1 от Mestre Centro → Piazzale Roma. Дорсодуро: Santa Margherita (пицца Al Volo или паста в Bakarò — от друга), Ponte dei Pugni, верфь San Trovaso, бесплатная Accademia (если дождь) → Corner Pub (бар от друга, спритц ≈€3) → Zattere → Punta della Dogana → traghetto Dogana → Сан-Марко: Murano illumina (последний день), Bovolo → 16:00 концерт в San Salvador (в 2–5 мин — 🐱 Gondolina, JB Guanti, Fabris, если открыты в праздник; 🐱 Sempione — столики над водой, открыт до 23:00) → Риальто вечером, ужин Do Spade.","ids":[2,5,48,49,50,51,54,55,57,35,31,32,30,26,23,27,106,105],"title":"Барахолка + Дорсодуро + Сан-Марко"},"2":{"title":"Сухой день пешком + 🐱 «Хочу сюда»","text":"**Сухо, Accademia закрыта.** Piazzale Roma → Majer (кофе, от друга) → 🐱 Carteria ai Frari (бумага, до 12:00) → San Pantalon → 🐱 Paolo Olbi (переплёты; часы спорные) → Santa Margherita / Bakarò → Ponte dei Pugni → верфь San Trovaso → Corner Pub (от друга) → Zattere → Salute → Punta della Dogana → traghetto Dogana → 🐱 Paropamiso (старинные украшения) → 🐱 Manufactus (блокноты) → Bovolo → 🐱 JB Guanti (перчатки) → 🐱 Fabris (сумочки) → Palazzo Bembo (бесплатно, пн работает) → 🐱 Gondolina (туфли) → Риальто → traghetto Santa Sofia → Palazzo Soranzo Van Axel (бесплатно) → Calle Varisco → Misericordia + джелато → 🐱 Spezieria all’Ercole d’Oro (старая аптека, Strada Nova). 🐱 — «хочу сюда», все по пути (Fondazione Dries Van Noten закрыта до 2027). Ужин у воды: 🐱 Sempione (столики над каналом у Риальто) или 🐱 Ai Barbacani (по пн может быть закрыт); 🐱 Santo Mare — дорого, от ≈€51 с человека; часы магазинов в основном не нашли — глянуть в Google Maps.","ids":[9,103,144,12,145,48,105,50,51,106,55,56,57,35,149,143,30,141,142,25,140,23,28,19,21,16,110,150]},"3":{"text":"Выезд до 10:00 с вещами. Спокойное утро в центре Местре (Piazza Ferretto) → **Barzi 14:10 от Mestre FS, остановка C4 → аэропорт 14:40** (запасной 15:40 → 16:10). Вылет 17:40.","ids":[3]},"1b":{"title":"По желанию · через Лидо: Николай после мессы 11:15","text":"RePulse рано (открывается ≈07:00) → ~09:15 трамвай T1 от Mestre Centro (в праздник ≈ каждые 15 мин) → Piazzale Roma, причал D → бесплатная DE 09:49 → San Michele → Cimitero, причал A **10:40** → Lido S.M.E. → ~30 мин пешком → San Nicolò: месса 11:15, **поклониться ≈12:15** → обратно DE с Lido S.M.E. **14:10** (или платный вапоретто) → San Pietro di Castello → бесплатные Palazzo Grimani (до 18:00) / Museo Archeologico (вход до 16:00) — под крышей, если дождь → Murano illumina (последний день) → **16:00 концерт San Salvador** → Риальто, ужин.","ids":[2,5,9,60,61,64,63,43,38,130,32,26,23,27]},"2b":{"title":"По желанию · день на воде: San Michele + Лидо (по пути — св. Николай)","text":"Бесплатные лодки DE в последний день. Piazzale Roma, причал D → San Michele (тихая прогулка) → причал A → San Pietro di Castello → Лидо. **По пути, если захочется:** ~25 мин пешком к San Nicolò (окно 15:00–16:30, лучше сначала позвонить). Обратно DE с Lido S.M.E. 16:10 или платный вапоретто ~€9,50/чел. Вечер: Via Garibaldi, Misericordia, джелато.","ids":[9,60,61,64,63,43,44,45,46,39,37,42,16,108,110]}};
function tplHtml(){const ks=[day,day+'b'].filter(k=>TPL[k]);if(!ks.length)return '';return ks.map(k=>`<div class="blk"><small>${TPL[k].title||'Подсказка на этот день'} (не обязательно)</small><br>${md(TPL[k].text)}<div class="btns"><button class="btn alt" onclick="useTpl('${k}')">Взять эти точки в мой день</button></div></div>`).join('')}
function useTpl(k){fav.clear();(TPL[k||day].ids||[]).forEach(i=>fav.add(i));LS.set('ord',TPL[k||day].ids);LS.set('fav',[...fav]);draw();myDay()}
function events(){sheet(`<h2>📅 Что привязано к датам</h2>${EVENTS.map(e=>`<div class="li" ${e.id?`onclick="openPlace(${e.id})"`:''}><div class="e">${e.e}</div><div class="m"><b>${esc(e.when)}</b> — ${md(e.what)}${e.note?`<br><small>${md(e.note)}</small>`:''}</div></div>`).join('')}`)}
function todo(){sheet(`<h2>📋 Забронировать и сделать</h2><div class="sub">Галочки сохраняются в телефоне.</div>${TODO.map((t,k)=>`<div class="task"><label><input type="checkbox" ${done.has(t.key)?'checked':''} onchange="tick('${t.key}',this.checked)"><span><b>${md(t.what)}</b>${t.when?` · <small>${md(t.when)}</small>`:''}<br><small>${md(t.how)}</small>${(t.links||[]).map(l=>`<br><a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</span></label></div>`).join('')}`)}
function tick(k,v){v?done.add(k):done.delete(k);LS.set('done',[...done])}
function wxHours(d){if(!wx||!wx.hourly)return [];const iso={'31':'2026-10-31','1':'2026-11-01','2':'2026-11-02','3':'2026-11-03'}[d];return wx.hourly.time.map((t,i)=>({t,i})).filter(x=>x.t.startsWith(iso)&&+x.t.slice(11,13)>=8&&+x.t.slice(11,13)<=21).map(x=>({h:x.t.slice(11,13),c:Math.round(wx.hourly.temperature_2m[x.i]),f:Math.round(wx.hourly.apparent_temperature[x.i]),p:wx.hourly.precipitation_probability[x.i],mm:wx.hourly.precipitation[x.i],w:Math.round(wx.hourly.wind_speed_10m[x.i]),k:wx.hourly.weather_code[x.i]}))}
const WI=c=>c<=1?'☀️':c<=3?'⛅':c<=48?'🌫':c<=67?'🌧':c<=77?'🌨':c<=82?'🌦':'⛈';
function wxDay(d){if(!wx||!wx.daily)return null;const iso={'31':'2026-10-31','1':'2026-11-01','2':'2026-11-02','3':'2026-11-03'}[d],i=wx.daily.time.indexOf(iso);if(i<0)return null;return {max:Math.round(wx.daily.temperature_2m_max[i]),min:Math.round(wx.daily.temperature_2m_min[i]),p:wx.daily.precipitation_probability_max[i],k:wx.daily.weather_code[i],ss:wx.daily.sunset[i].slice(11),sr:wx.daily.sunrise[i].slice(11)}}
function weather(){sheet(`<h2>🌦 Погода в Венеции</h2><div class="sub">Open-Meteo, обновлено ${esc(wx&&wx._at||'—')}. Ветер у воды ощущается холоднее.</div>${DAYS.map(([d,n])=>{const x=wxDay(d);if(!x)return '';return `<div class="blk"><b>${n}</b> ${WI(x.k)} ${x.min}…${x.max}° · дождь до ${x.p}% · закат ${x.ss}<div class="hours">${wxHours(d).map(h=>`<div class="h ${h.p>=50?'rain':''}">${h.h}:00<br>${WI(h.k)}<br>${h.c}°<br>${h.p}%</div>`).join('')}</div></div>`}).join('')}<div class="btns"><a class="btn alt" href="https://www.comune.venezia.it/it/content/centro-previsioni-e-segnalazioni-maree" target="_blank" rel="noopener">🌊 Прилив (acqua alta)</a></div>`)}
function topWx(){const x=wxDay(day);$('#wx').textContent=x?`${WI(x.k)}${x.max}° ☔${x.p}%`:'погода…';
 const b=$('#banner');if(x&&x.p>=50){b.style.display='block';b.innerHTML=`☔ ${DAYS.find(d=>d[0]===day)[1]}: возможен дождь (до ${x.p}%). <a href="#" onclick="filt=new Set(['indoor']);chips();draw();return false">Показать места под крышей</a>`}else b.style.display='none'}
async function loadWx(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.437&longitude=12.334&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=Europe%2FRome&start_date=2026-10-31&end_date=2026-11-03');if(r.ok){wx=await r.json();wx._at=new Date().toLocaleString('ru-RU',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});LS.set('wx',wx)}}catch(e){wx=LS.get('wx',WX0)}topWx()}
function daysBar(){$('#days').innerHTML=DAYS.map(([d,n])=>`<button class="day ${d===day?'on':''}" onclick="day='${d}';daysBar();topWx();draw();if(sel)openPlace(sel)">${n}</button>`).join('')}
const CHIPS=[['maria','🐱 Хочу сюда'],['friend','💬 От друга'],['open','✅ Открыто'],['indoor','🏠 Под крышей'],['free0','€0'],['fav','⭐ Мой день'],['food'],['art'],['hidden'],['photo'],['water'],['market'],['shop'],['nature'],['walk'],['saint'],['grocery'],['transport']];
function chips(){$('#chips').innerHTML=CHIPS.filter(c=>!['friend','maria'].includes(c[0])||PLACES.some(p=>p.cats.includes(c[0]))).map(([k,l])=>`<button class="chip ${filt.has(k)?'on':''} ${k==='friend'||k==='maria'?k:''}" onclick="filt.has('${k}')?filt.delete('${k}'):filt.add('${k}');chips();draw()">${l||CATS[k][0]+' '+CATS[k][1]}</button>`).join('')}
$('#bNear').onclick=near;$('#bDay').onclick=myDay;$('#bEv').onclick=events;$('#bTodo').onclick=todo;$('#bWx').onclick=weather;
if(WX0&&!WX0._at)WX0._at='снимок '+BUILT;
daysBar();chips();draw();topWx();loadWx();
